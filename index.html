      ${brand}${inner}</div></div></div>`;
  }
  const errBox = () => `<div class="notice danger" id="g-err" hidden role="alert"></div>`;
  function showErr(msg) { const e = document.getElementById("g-err"); if (e) { e.innerHTML = UI.icon("alert", 15) + "<div>" + esc(msg) + "</div>"; e.hidden = !msg; } }
  function busy(btn, on, label) { btn.disabled = on; btn.innerHTML = on ? UI.icon("refresh", 15, "spin") + " Patientez…" : label; }

  const FEATURES = [
    ["gauge", "Analyse des DPE", "Import des exports Excel 3CL ADEME, étiquettes, déperditions, synthèse multi-logements."],

  function supportForm(kind, prefillEmail) {
    const opts = Object.entries(Cloud.KINDS).map(([k, l]) => [k, l]);
    return `<form id="g-sup" class="stack" novalidate>
      ${UI.field("Objet", UI.selectInput("kind", opts, kind || "creation_compte"))}

      <button class="btn btn-primary" type="submit" style="justify-content:center;padding:9px">${UI.icon("external", 15)} Envoyer la demande</button>

    </form>`;

  function sentBox(res, req) {
    return `<div class="stack">
      <div class="notice">${UI.icon("check", 16)}<div><strong>Demande envoyée.</strong><br>
        ${req.kind === "mot_de_passe"
          ? "L'administrateur va réinitialiser votre accès et vous transmettre un mot de passe provisoire par e-mail."
          : "L'administrateur a bien reçu votre message et vous répondra à l'adresse indiquée."}</div></div>
      ${res.mailed ? "" : `<div class="notice warn">${UI.icon("alert", 15)}<div>L'e-mail automatique n'a pas pu partir ;
        la demande est bien enregistrée. Pour aller plus vite :
        <a href="${esc(Cloud.mailtoFor(req))}">écrire directement à l'administrateur</a>.</div></div>`}
      <button class="btn" type="button" data-gtab="login">${UI.icon("lock", 15)} Retour à la connexion</button>
    </div>`;
  }

  function bindSupport(box, onSent) {
    const f = box.querySelector("#g-sup");
    if (!f) return;
    const btn = f.querySelector("button[type=submit]"), label = btn.innerHTML;
    f.addEventListener("submit", async e => {
      e.preventDefault();
      const req = UI.readForm(f);
      const err = t => { const b = f.querySelector("#g-err"); b.innerHTML = UI.icon("alert", 15) + "<div>" + esc(t) + "</div>"; b.hidden = !t; };
      err("");
      if (!req.full_name.trim()) return err("Indiquez votre nom.");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(req.email.trim())) return err("Adresse e-mail invalide.");
      if (req.kind !== "mot_de_passe" && req.kind !== "creation_compte" && !req.message.trim()) return err("Décrivez votre demande.");
      busy(btn, true, label);
      try { const res = await Cloud.support(req); onSent(res, req); }
      catch (x) { err(x.message); busy(btn, false, label); }
    });
  }

  function loginScreen() {
    return new Promise(resolve => {
      const hero = Hero.cached();
      root().innerHTML = `
      <div class="gate">
        <section class="gate-visual ${hero ? "has-photo" : ""}" aria-label="Présentation">

          </div>
          <div class="gate-float gate-float-a" aria-hidden="true">
            <div class="gf-lbl">Étiquette énergie</div>
            <div class="gf-dpe">
              <span class="gf-cls" style="background:#F0B40F;color:#3A2A00">E</span>
              <svg width="38" height="12" viewBox="0 0 38 12"><path d="M1 6h32m-5-4 5 4-5 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              <span class="gf-cls" style="background:#52B153;color:#fff">B</span>
            </div>
            <div class="gf-sub">312 → 96 kWh/m².an</div>
          </div>
          <div class="gate-float gate-float-b" aria-hidden="true">
            <div class="gf-lbl">Reste à charge / logement</div>
            <div class="gf-big">8 420 €</div>
            <div class="gf-bars"><span style="height:38%"></span><span style="height:62%"></span><span style="height:47%"></span><span style="height:88%"></span><span style="height:71%"></span></div>
          </div>
          <div class="gate-float gate-float-c" aria-hidden="true"><span class="gate-dot hot"></span> Murs : 38 % des déperditions</div>
          <div class="gate-copy">
            <div class="gate-eyebrow">Bureau d'études · Rénovation énergétique</div>
            <h1 class="gate-title">Du diagnostic au chiffrage,<br><em>sans jamais ressaisir.</em></h1>
            <p class="gate-lead">Importez vos DPE, générez les métrés, comparez les scénarios de travaux et remettez un rapport
              complet — aides et reste à charge compris.</p>
            <ul class="gate-feats">
              ${FEATURES.map(([ic, t]) => `<li>${UI.icon(ic, 15)} ${esc(t)}</li>`).join("")}
            </ul>
          </div>
          ${hero && hero.credit ? `<div class="gate-credit">${esc(hero.credit)}</div>` : ""}
        </section>
        <section class="gate-side">
          <div class="gate-side-inner">
            <div class="gate-hello">
              <div class="gate-eyebrow dark">Espace sécurisé</div>
              <h2>Bienvenue</h2>
              <p class="small muted">Connectez-vous pour retrouver vos projets, vos DPE et vos chiffrages.</p>
            </div>
            <div class="gate-card">
              <div class="tabs gate-tabs" role="tablist">
                <button class="tab active" data-gtab="login">Connexion</button>
                <button class="tab" data-gtab="forgot">Mot de passe oublié</button>
                <button class="tab" data-gtab="support">Support</button>
              </div>
              <div id="g-pane" class="gate-pane"></div>
            </div>
            <div class="gate-trust">
              <span>${UI.icon("lock", 13)} Connexion chiffrée</span>
              <span>${UI.icon("user", 13)} Accès sur invitation</span>
              <span>${UI.icon("info", 13)} <a href="#" data-gtab="support">Besoin d'aide ?</a></span>
            </div>
            <div class="gate-legal xsmall muted-3">© ${new Date().getFullYear()} BET Chiffrage · Établi par Saad Oufaaiz</div>
          </div>
        </section>
      </div>`;
      // Photo à jour (réglage public), sans bloquer l'affichage.
      Hero.fetchSetting().then(v => {
        const media = root().querySelector(".gate-media"); const vis = root().querySelector(".gate-visual");
        if (!media || !vis) return;
        const same = (v && v.url) === (hero && hero.url);
        if (same) return;
        vis.classList.toggle("has-photo", !!v);
        media.innerHTML = v ? `<img src="${esc(v.url)}" alt="" style="object-position:${esc(v.position || "center")}">` : Hero.illustration();
      });
      const pane = document.getElementById("g-pane");
      const panes = {
        login: () => `
          <form id="g-form" class="stack" novalidate>
            ${UI.field("Adresse e-mail", `<input class="inp" name="email" type="email" autocomplete="username" required>`)}
            ${UI.field("Mot de passe", `<input class="inp" name="password" type="password" autocomplete="current-password" required>`)}
            ${errBox()}

            ${UI.field("Adresse e-mail du compte *", `<input class="inp" name="email" type="email" autocomplete="email">`)}
            <input type="hidden" name="company" value=""><input type="hidden" name="message" value="Demande de réinitialisation du mot de passe.">
            ${errBox()}

        root().querySelectorAll(".gate-card [data-gtab]").forEach(b => { if (b.classList.contains("tab")) b.classList.toggle("active", b.dataset.gtab === k); });
        pane.innerHTML = panes[k](kind);
        if (k === "login") bindLogin(); else bindSupport(pane, (res, req) => { pane.innerHTML = sentBox(res, req); });
        const first = pane.querySelector("input:not([type=hidden])"); if (first) first.focus();
      };
      root().addEventListener("click", e => {
        const t = e.target.closest("[data-gtab]"); if (!t) return;
        e.preventDefault(); show(t.dataset.gtab, t.dataset.kind);
      });
      const bindLogin = () => {
        const f = document.getElementById("g-form");
        const btn = f.querySelector("button[type=submit]");
        const label = btn.innerHTML;
        f.addEventListener("submit", async e => {
          e.preventDefault();
          showErr("");
          const email = f.email.value.trim(), pwd = f.password.value;
          if (!email || !pwd) return showErr("Saisissez votre e-mail et votre mot de passe.");
          busy(btn, true, label);
          try { await Cloud.signIn(email, pwd); resolve(); }
          catch (err) { showErr(err.message); busy(btn, false, label); f.password.select(); }
        });
      };
      show("login");
    });
  }

  function passwordFields(withCurrent) {
    return `${withCurrent ? UI.field("Mot de passe actuel", `<input class="inp" name="current" type="password" autocomplete="current-password">`) : ""}
      ${UI.field("Nouveau mot de passe", `<input class="inp" name="next" type="password" autocomplete="new-password">`,
        Cloud.MIN_PWD + " caractères minimum, avec au moins une lettre et un chiffre.")}
      ${UI.field("Confirmer le nouveau mot de passe", `<input class="inp" name="confirm" type="password" autocomplete="new-password">`)}
      <label class="row xsmall muted" style="gap:6px;cursor:pointer"><input type="checkbox" data-showpwd> Afficher les mots de passe</label>`;
  }
  function bindShow(scope) {
    const cb = scope.querySelector("[data-showpwd]");
    if (cb) cb.addEventListener("change", () => scope.querySelectorAll("input[type=password],input[data-pw]").forEach(i => {
      i.setAttribute("data-pw", "1"); i.type = cb.checked ? "text" : "password";
    }));
  }

  function forcedChangeScreen() {
    const p = Cloud.profile() || {};
    return new Promise(resolve => {
      frame(`
        <h2 style="font-size:18px;margin-bottom:4px">Choisissez votre mot de passe</h2>
        <p class="small muted" style="margin-bottom:16px">Bonjour ${esc(p.full_name || p.email || "")}. Vous êtes connecté avec un mot de passe
          provisoire : remplacez-le par un mot de passe personnel pour accéder à l'application.</p>
        <form id="g-form" class="stack" novalidate>
          ${passwordFields(false)}
          ${errBox()}
          <button class="btn btn-primary" type="submit" style="justify-content:center;padding:9px">${UI.icon("check", 15)} Enregistrer et continuer</button>
          <button class="btn btn-ghost" type="button" id="g-out" style="justify-content:center">Se déconnecter</button>
        </form>`);
      const f = document.getElementById("g-form");
      bindShow(f);
      const btn = f.querySelector("button[type=submit]");
      const label = btn.innerHTML;
      document.getElementById("g-out").addEventListener("click", async () => { await Cloud.signOut(); location.reload(); });
      f.addEventListener("submit", async e => {
        e.preventDefault();
        showErr("");
        const bad = Cloud.checkNew(f.next.value, f.confirm.value);
        if (bad) return showErr(bad);
        busy(btn, true, label);
        try { await Cloud.changePassword(null, f.next.value); resolve(); }
        catch (err) { showErr(err.message); busy(btn, false, label); }
      });
    });
  }

  function fatal(msg) {
    frame(`<h2 style="font-size:18px;margin-bottom:8px">Connexion impossible</h2>
      <div class="notice danger">${UI.icon("alert", 15)}<div>${esc(msg)}</div></div>
      <button class="btn btn-primary" style="margin-top:14px" onclick="location.reload()">${UI.icon("refresh", 15)} Réessayer</button>`);
  }

  /** Résout quand l'utilisateur est connecté avec un mot de passe personnel. */
  async function ensure() {
    try { await Cloud.restore(); }
    catch (e) { fatal(e.message); return new Promise(() => {}); }
    if (!Cloud.session()) await loginScreen();
    if (Cloud.profile() && Cloud.profile().must_change_password) await forcedChangeScreen();
    root().innerHTML = `<div style="display:grid;place-items:center;min-height:70vh;color:var(--c-text-2)">Chargement de l'application…</div>`;
  }

  return { ensure, passwordFields, bindShow, supportForm, bindSupport, sentBox };
})();

/* =========================================================================
 * 08 — APP : coque applicative, routeur, raccourcis, statut de sauvegarde.
 * ========================================================================= */
const App = (() => {
  "use strict";
  const { esc, icon } = { esc: Core.esc, icon: UI.icon };

  const ROUTES = {
    dashboard: { label: "Tableau de bord", icon: "dashboard" },
    projects: { label: "Projets", icon: "folder" },
    project: { label: "Projet", icon: "folder", hidden: true },
    dpe: { label: "Analyse DPE", icon: "gauge" },
    users: { label: "Comptes utilisateurs", icon: "user" },
    support: { label: "Support", icon: "info" },
    catalog: { label: "Catalogue de prix", icon: "book" },
    compare: { label: "Scénarios", icon: "layers" },
    reports: { label: "Rapports", icon: "report" },
    settings: { label: "Paramètres", icon: "settings" },
  };

  const state = {
    route: "dashboard",
    projectId: null,
    tab: null,
    railOpen: false,
    theme: null, // null = thème du visiteur
  };

  /* ------------------------------------------------------------- Navigation */
  function go(route, params = {}) {
    state.route = route;
    if (params.projectId !== undefined) state.projectId = params.projectId;
    if (params.tab !== undefined) state.tab = params.tab; else if (route !== "project") state.tab = null;
    state.railOpen = false;
    try { location.hash = "#" + route + (state.projectId && route === "project" ? "/" + state.projectId : "") + (state.tab ? "/" + state.tab : ""); }
    catch (e) { /* hash indisponible */ }
    render();
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }

  function readHash() {
    const h = (location.hash || "").replace(/^#/, "");
    if (!h) return;
    const [r, a, b] = h.split("/");
    if (!ROUTES[r]) return;
    state.route = r;
    if (r === "project") { state.projectId = a || state.projectId; state.tab = b || "fiche"; }
    else state.tab = a || null;
  }

  const currentProject = () => (state.projectId ? Repo.projects.get(state.projectId) : null);

  /* ------------------------------------------------------------------ Rendu */
  function render() {
    const root = document.getElementById("app");
    if (!root) return;
    const p = currentProject();
    if (state.route === "project" && !p) { state.route = "projects"; state.projectId = null; }

    root.innerHTML = `
      ${renderRail()}
      <div class="rail-scrim ${state.railOpen ? "on" : ""}" data-act="closeRail"></div>
      <div class="main">
        <header class="topbar">
          <button class="btn btn-ghost btn-icon rail-toggle" data-act="toggleRail" aria-label="Menu">${icon("menu", 18)}</button>
          <div>
            ${topCrumb()}
            <h1>${esc(topTitle())}</h1>
          </div>
          <div class="topbar-actions">${topActions()}</div>
        </header>
        <div class="page" id="page"></div>
      </div>`;
    const page = document.getElementById("page");
    try {
      page.innerHTML = viewHtml();
      if (currentView() && currentView().mount) currentView().mount(page);
    } catch (e) {
      console.error(e);
      page.innerHTML = `<div class="card"><div class="card-body"><div class="notice danger">${icon("alert", 16)}
        <div><strong>Erreur d'affichage.</strong><br>${esc(e.message)}</div></div></div></div>`;
    }
    updateSaveStatus();
  }

  function currentView() {
    return {
      dashboard: Views.Dashboard,
      projects: Views.Projects,
      project: Views.Project,
      dpe: Views.Dpe,
      users: Views.Users,
      support: Views.Support,
      catalog: Views.Catalog,
      compare: Views.Compare,
      reports: Views.Reports,
      settings: Views.Settings,
    }[state.route];
  }

  function viewHtml() {
    const v = currentView();
    return v ? v.render() : `<div class="empty">Écran introuvable.</div>`;
  }

  function topTitle() {
    if (state.route === "project") { const p = currentProject(); return p ? p.name : "Projet"; }
    return ROUTES[state.route] ? ROUTES[state.route].label : "";
  }
  function topCrumb() {
    if (state.route === "project") {
      const p = currentProject();
      return `<div class="topbar-crumb">Projets · ${esc(p ? p.reference || p.coproName || "—" : "")} · ${esc(p ? p.version : "")}</div>`;
    }
    const map = {
      dashboard: "Vue d'ensemble", projects: "Dossiers de chiffrage", catalog: "Référentiel de prix",
      compare: "Comparaison de variantes", dpe: "Extraction DPE 3CL ADEME", users: "Accès et mots de passe", support: "Aide et demandes", reports: "Livrables", settings: "Configuration",
    };
    return `<div class="topbar-crumb">${esc(map[state.route] || "")}</div>`;
  }

  function topActions() {
    const v = currentView();
    const extra = v && v.actions ? v.actions() : "";
    return `${extra}
      <button class="btn btn-ghost btn-icon" data-act="toggleTheme" title="Thème clair / sombre" aria-label="Basculer le thème">${icon("sun", 17)}</button>
      <button class="btn btn-ghost btn-icon" data-act="help" title="Aide et raccourcis" aria-label="Aide">${icon("info", 17)}</button>`;
  }

  /* ------------------------------------------------------------------- Rail */
  function renderRail() {
    const projects = Repo.projects.list(p => p.status !== "archivé");
    const items = Repo.items.list(i => i.active !== false);
    const dpeCount = (Repo.state().dpeInbox || []).length;
    const u = Auth.user();
    const initials = (u && u.name ? u.name : "?").split(/\s+/).map(s => s[0]).slice(0, 2).join("").toUpperCase();
    const link = (route, badge) => {
      const r = ROUTES[route];
      return `<button class="rail-link ${state.route === route ? "active" : ""}" data-act="go" data-route="${route}">
        ${icon(r.icon, 17)}<span>${esc(r.label)}</span>${badge !== undefined ? `<span class="rail-badge">${badge}</span>` : ""}
      </button>`;
    };
    return `
    <nav class="rail ${state.railOpen ? "open" : ""}" aria-label="Navigation principale">
      <div class="rail-brand">
        <div class="rail-mark">BE</div>
        <div>
          <div class="rail-title">BET Chiffrage</div>
          <div class="rail-sub">DPE · Rénovation énergétique</div>
        </div>
      </div>
      <div class="rail-nav">
        ${link("dashboard")}
        ${link("projects", projects.length)}
        <div class="rail-group">Référentiels</div>
        ${link("catalog", items.length)}
        <div class="rail-group">Études</div>
        ${link("dpe", dpeCount || undefined)}
        ${link("compare")}
        ${link("reports")}
        <div class="rail-group">Configuration</div>
        ${link("settings")}
        ${Auth.role() === "admin" ? link("users") : ""}
        ${link("support", Auth.role() === "admin" && Views.Support.newCount() ? Views.Support.newCount() : undefined)}
      </div>
      <div class="rail-foot">
        <div class="rail-status" id="save-status"><span class="dot"></span><span>Enregistré</span></div>
        <button class="rail-user" data-act="switchUser" title="Mon compte : mot de passe, déconnexion">
          <span class="rail-avatar">${esc(initials)}</span>
          <span>
            <span class="rail-user-name">${esc(u ? u.name : "—")}</span><br>
            <span class="rail-user-role">${esc(Auth.roleLabel())}</span>
          </span>
        </button>
      </div>
    </nav>`;
  }

  function updateSaveStatus() {
    const el = document.getElementById("save-status");
    if (!el) return;
    const dirty = Repo.isDirty();
    const at = Repo.savedAt();
    el.innerHTML = dirty
      ? `<span class="dot pending"></span><span>Modifications en cours…</span>`
      : `<span class="dot"></span><span>Enregistré ${at ? Core.dateTimeFR(at).slice(-5) : ""} · ${esc(Repo.driverName())}</span>`;
  }

  /* -------------------------------------------------------- Recherche globale */
  function globalSearch() {
    const body = `
      <div class="search" style="max-width:none">
        ${icon("search", 16)}
        <input class="inp" id="gsearch" placeholder="Projet, poste de prix, catégorie…" autocomplete="off">
      </div>
      <div id="gresults" class="stack-sm"></div>`;
    const m = UI.modal({ title: "Recherche globale", sub: "Projets, postes de prix et catégories", body, footer: null, size: "" });
    const input = m.el.querySelector("#gsearch");
    const out = m.el.querySelector("#gresults");
    const run = () => {
      const q = input.value.trim();
      if (!q) { out.innerHTML = `<p class="hint">Saisissez au moins deux caractères.</p>`; return; }
      const projects = Repo.projects.list(p => Core.matches([p.name, p.coproName, p.city, p.reference].join(" "), q)).slice(0, 6);
      const items = Repo.items.list(i => Core.matches([i.label, i.subCategory, i.source].join(" "), q)).slice(0, 8);
      out.innerHTML = `
        ${projects.length ? `<div class="lbl">Projets</div>` + projects.map(p =>
          `<button class="btn" style="justify-content:flex-start;width:100%" data-act="gsProject" data-id="${p.id}">
            ${icon("folder", 15)} ${esc(p.name)} <span class="muted-3 small">· ${esc(p.city || "—")} · ${esc(p.version)}</span></button>`).join("") : ""}
        ${items.length ? `<div class="lbl" style="margin-top:8px">Postes de prix</div>` + items.map(i =>
          `<button class="btn" style="justify-content:flex-start;width:100%" data-act="gsItem" data-id="${i.id}">
            ${icon("tag", 15)} ${esc(i.label)} <span class="muted-3 small mono">· ${Core.eur(i.priceHT)}/${esc(i.unit)}</span></button>`).join("") : ""}
        ${!projects.length && !items.length ? `<p class="hint">Aucun résultat.</p>` : ""}`;
    };
    input.addEventListener("input", Core.debounce(run, 120));
    run();
    UI.Actions.gsProject = (d) => { m.close(); go("project", { projectId: d.id, tab: "fiche" }); };
    UI.Actions.gsItem = (d) => { m.close(); go("catalog"); setTimeout(() => Views.Catalog.focusItem(d.id), 60); };
  }

  function help() {
    UI.modal({
      title: "Aide & raccourcis",
      sub: "BET Chiffrage — application de chiffrage pour bureau d'études",
      body: `
      <div class="stack">
        <div>
          <div class="lbl">Raccourcis clavier</div>
          <table class="tbl" style="margin-top:6px">
            <tbody>
              <tr><td><span class="kbd">Ctrl</span> + <span class="kbd">K</span></td><td>Recherche globale</td></tr>
              <tr><td><span class="kbd">Ctrl</span> + <span class="kbd">S</span></td><td>Forcer l'enregistrement</td></tr>
              <tr><td><span class="kbd">Ctrl</span> + <span class="kbd">N</span></td><td>Nouveau projet</td></tr>
              <tr><td><span class="kbd">g</span> puis <span class="kbd">d/p/e/c/s</span></td><td>Aller à Tableau de bord / Projets / Analyse DPE / Catalogue / Paramètres</td></tr>
              <tr><td><span class="kbd">Échap</span></td><td>Fermer la fenêtre active</td></tr>
            </tbody>
          </table>
        </div>
        <div>
          <div class="lbl">Où sont mes données ?</div>
          <p class="small muted" style="margin-top:6px">
            Elles sont enregistrées automatiquement dans le stockage de ce navigateur
            (${esc(Repo.driverName())}) et survivent au rechargement de la page.
            Pour les transporter d'un poste à l'autre ou les archiver, utilisez
            <strong>Paramètres → Données → Exporter la sauvegarde</strong>.
          </p>
        </div>
        <div>
          <div class="lbl">Enchaînement d'une étude</div>
          <p class="small muted" style="margin-top:6px">
            DPE (exports 3CL) → projet pré-rempli → bâtiments et métrés générés → préconisations →
            scénarios de travaux (postes issus du catalogue,
            quantités, coefficients) → frais annexes → aides → analyse économique → exports.
          </p>
        </div>
      </div>`,
    });
  }

  /* ------------------------------------------------------------- Utilisateur */
  function switchUser() {
    const users = Repo.users.list();
    const body = `
      <p class="small muted">Le rôle détermine ce qui est modifiable dans l'application.</p>
      <div class="stack-sm">
        ${users.filter(u => u.active !== false).map(u => `
          <button class="btn" style="justify-content:flex-start;width:100%;padding:9px 12px" data-act="pickUser" data-id="${u.id}">
            <span class="rail-avatar" style="background:var(--c-accent-soft);color:var(--c-accent)">${esc((u.name || "?").split(/\s+/).map(s => s[0]).slice(0, 2).join("").toUpperCase())}</span>
            <span style="text-align:left">
              <span class="strong">${esc(u.name)}</span><br>
              <span class="small muted-3">${esc((Auth.ROLES[u.role] || {}).label || u.role)}</span>
            </span>
            ${Auth.user() && Auth.user().id === u.id ? `<span class="tag accent spacer">Session active</span>` : ""}
          </button>`).join("")}
      </div>
      <div class="notice">${icon("info", 15)}<div>
        En mode local, les rôles pilotent l'interface et les garde-fous métier ; ils ne constituent
        pas une barrière de sécurité. L'authentification réelle par mot de passe est fournie par
        Supabase Auth dans la version serveur.</div></div>`;
    const m = UI.modal({ title: "Utilisateur et rôle", body, footer: `<button class="btn" data-modal-close>Fermer</button>` });
    UI.Actions.pickUser = (d) => {
      Auth.signIn(d.id);
      m.close();
      UI.toast("Session : " + Auth.name() + " (" + Auth.roleLabel() + ")", "ok");
      render();
    };
  }

  /* ------------------------------------------------------------------ Thème */
  function toggleTheme() {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("bet_theme", next); } catch (e) { /* ignore */ }
    UI.toast(next === "dark" ? "Thème sombre" : "Thème clair", "ok", 1500);
  }
  function restoreTheme() {
    let t = "";
    try { t = localStorage.getItem("bet_theme") || ""; } catch (e) { /* ignore */ }
    // Clair par défaut, même si le système est en mode sombre ; le sombre reste disponible via le bouton.
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  }

  /* ------------------------------------------------------------- Raccourcis */
  let gPending = false;
  function bindShortcuts() {
    document.addEventListener("keydown", e => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); globalSearch(); return; }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
        e.preventDefault();
        Repo.flush().then(() => { UI.toast("Chiffrage enregistré.", "ok", 1600); updateSaveStatus(); });
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "n" && !typing) {
        e.preventDefault(); Views.Projects.createDialog(); return;
      }
      if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === "g") { gPending = true; setTimeout(() => { gPending = false; }, 900); return; }
      if (gPending) {
        const map = { d: "dashboard", p: "projects", c: "catalog", s: "settings", r: "reports", e: "dpe" };
        if (map[e.key]) { e.preventDefault(); gPending = false; go(map[e.key]); }
      }
    });
  }

  /* ------------------------------------------------------------- Démarrage */
  async function boot() {
    restoreTheme();
    await Gate.ensure();
    await Repo.init();
    Auth.restore();
    readHash();
    bindShortcuts();
    Core.Bus.on("repo:changed", () => updateSaveStatus());
    Core.Bus.on("repo:saved", () => updateSaveStatus());
    Core.Bus.on("repo:error", () => UI.toast("Sauvegarde impossible : espace de stockage saturé ou refusé par le navigateur. Exportez une sauvegarde depuis Paramètres → Données.", "err", 9000));
    window.addEventListener("hashchange", () => { readHash(); render(); });
    window.addEventListener("beforeunload", () => { if (Repo.isDirty()) Repo.flush(); });
    render();
    if (Auth.role() === "admin") Views.Support.load();
    Hero.fetchSetting();
    // Photo d'accueil (Paramètres → Page d'accueil)
    const heroVals = () => { const pos = document.querySelector('[name="heroPos"]'); const cr = document.querySelector('[name="heroCredit"]');
      return { position: pos ? pos.value : "center", credit: cr ? cr.value.trim() : "" }; };
    UI.register({
      heroPick: () => { const i = document.getElementById("hero-file"); if (!i) return;
        i.onchange = async () => { const f = i.files && i.files[0]; i.value = ""; if (!f) return;
          if (!/^image\/(jpeg|png|webp)$/.test(f.type)) return UI.toast("Format accepté : JPEG, PNG ou WebP.", "warn");
          UI.toast("Envoi de la photo…", "ok", 1500);
          try { const v = heroVals(); await Hero.upload(f, v.position, v.credit); UI.toast("Photo d'accueil publiée.", "ok"); render(); }
          catch (e) { UI.toast(e.message, "err", 6000); } };
        i.click(); },
      heroSave: async () => { const h = Hero.cached(); if (!h) return;
        try { await Hero.save(Object.assign({}, h, heroVals())); UI.toast("Cadrage enregistré.", "ok"); render(); } catch (e) { UI.toast(e.message, "err"); } },
      heroReset: async () => { const ok = await UI.confirm({ title: "Revenir à l'illustration ?", message: "La photo actuelle sera retirée de la page de connexion.", confirmLabel: "Retirer la photo", danger: true });
        if (!ok) return; try { await Hero.reset(); UI.toast("Illustration rétablie.", "ok"); render(); } catch (e) { UI.toast(e.message, "err"); } },
    }, UI.Actions);
  }

  UI.register({
    go: d => go(d.route),
    toggleRail: () => { state.railOpen = !state.railOpen; render(); },
    closeRail: () => { state.railOpen = false; render(); },
    toggleTheme,
    help,
    switchUser,
    search: globalSearch,
  }, UI.Actions);

  return { state, go, render, boot, currentProject, updateSaveStatus, globalSearch, ROUTES };
})();


/* ===== 09-views-base.js ============================================== */
/* =========================================================================
 * 09 — VIEWS : espace de noms des écrans + fragments réutilisables.
 * ========================================================================= */
const Views = {};

const Frag = (() => {
  "use strict";
  const { esc, eur, num } = Core;
  const icon = UI.icon;

  /** Pastille de catégorie (couleur issue du référentiel, pas du code). */
  function catBadge(categoryId) {
    const c = Repo.categories.get(categoryId);
    if (!c) return `<span class="tag">Sans catégorie</span>`;
    return `<span class="tag tag-cat" style="background:${esc(c.color)}22;color:var(--c-text)">
      <span class="cat-dot" style="background:${esc(c.color)}"></span>${esc(c.name)}</span>`;
  }

  function stat(label, value, sub, cls = "") {
    return `<div class="stat">
      <span class="stat-l">${esc(label)}</span>
      <span class="stat-v ${cls}">${value}</span>
      ${sub ? `<span class="stat-sub">${sub}</span>` : ""}
    </div>`;
  }

  function empty(title, message, actionHtml = "") {
    return `<div class="empty"><strong>${esc(title)}</strong>${esc(message)}
      ${actionHtml ? `<div style="margin-top:12px">${actionHtml}</div>` : ""}</div>`;
  }

  function searchBox(actName, value, placeholder) {
    return `<div class="search">${icon("search", 15)}
      <input class="inp" data-inp="${actName}" value="${esc(value || "")}" placeholder="${esc(placeholder)}" autocomplete="off"></div>`;
  }

  /** Barre récapitulative HT / TVA / TTC — reprise du bordereau d'origine. */
  function totalBar(t, title = "Récapitulatif chiffrage", extraHtml = "") {
    return `<div class="totalbar">
      <div class="totalbar-head">${icon("calculator", 14)} ${esc(title)}<span class="spacer"></span>${extraHtml}</div>
      <div class="totalbar-body">
        <div class="totalbar-cell"><div class="stat-l">Postes</div><div class="stat-v" style="font-size:17px">${t.nbLines}</div></div>
        <div class="totalbar-cell"><div class="stat-l">Travaux HT</div><div class="stat-v" style="font-size:17px">${eur(t.worksHT)}</div></div>
        <div class="totalbar-cell"><div class="stat-l">Frais annexes HT</div><div class="stat-v" style="font-size:17px">${eur(t.feesHT)}</div></div>
        <div class="totalbar-cell"><div class="stat-l">Total HT</div><div class="stat-v" style="font-size:17px">${eur(t.totalHT)}</div></div>
        <div class="totalbar-cell"><div class="stat-l">dont TVA</div><div class="stat-v" style="font-size:17px">${eur(t.totalVAT)}</div></div>
        <div class="totalbar-cell"><div class="stat-l">Total TTC</div><div class="stat-v accent" style="font-size:19px">${eur(t.totalTTC)}</div></div>
      </div>
    </div>`;
  }

  /** Fourchette d'incertitude (§19). */
  function rangeLine(t) {
    if (!t.range.pct) return "";
    return `<div class="row small muted" style="margin-top:8px">
      ${icon("ruler", 14)}
      <span>Fourchette ±${num(t.range.pct, 0)} % :
        <strong class="mono">${eur(t.range.ttcLow)}</strong> — <strong class="mono">${eur(t.range.ttcHigh)}</strong> TTC</span>
    </div>`;
  }

  function roleNotice(action) {
    if (Auth.can(action)) return "";
    return `<div class="notice warn">${icon("lock", 15)}<div>
      Votre rôle <strong>${esc(Auth.roleLabel())}</strong> donne un accès en lecture sur cet écran.
      Demandez à un administrateur de modifier votre rôle si nécessaire.</div></div>`;
  }

  /** Sélecteur multi-valeurs sous forme de cases à cocher compactes. */
  function checkList(name, options, selectedIds) {
    const sel = new Set(selectedIds || []);
    return `<div class="stack-sm" style="max-height:210px;overflow-y:auto;border:1px solid var(--c-line);border-radius:var(--r-md);padding:8px">
      ${options.map(o => `<label class="row small" style="gap:7px;cursor:pointer">
        <input type="checkbox" name="${name}" value="${esc(o.id)}"${sel.has(o.id) ? " checked" : ""}>
        <span>${esc(o.label)}${o.hint ? ` <span class="muted-3">· ${esc(o.hint)}</span>` : ""}</span>
      </label>`).join("")}
    </div>`;
  }

  return { catBadge, stat, empty, searchBox, totalBar, rangeLine, roleNotice, checkList };
})();


/* ===== 10-view-catalog.js ============================================ */
/* =========================================================================
 * 10 — ÉCRAN CATALOGUE (§6, §7, §8, §9, §31)
 *
 * Le catalogue est une donnée, pas du code : tout se crée, se modifie et se
 * supprime depuis cet écran. Chaque changement de prix empile une entrée
 * d'historique — l'ancien prix n'est jamais perdu.
 * ========================================================================= */
Views.Catalog = (() => {
  "use strict";
  const { esc, eur, eur2, num, dateFR } = Core;
  const icon = UI.icon;

  const ui = {
    q: "",
    categoryId: "all",
    showInactive: false,
    sort: UI.sortState("label"),
    highlight: null,
  };

  const vatOptions = () => Repo.vatRates.list(v => v.active !== false).map(v => [v.rate, num(v.rate, 1) + " % — " + v.label]);
  const unitOptions = () => Repo.units.list(u => u.active !== false).map(u => u.code);
  const categoryOptions = () => Repo.categories.list(c => c.active !== false).sort((a, b) => a.order - b.order).map(c => [c.id, c.name]);

  function filtered() {
    let rows = Repo.items.list(i => (ui.showInactive || i.active !== false));
    if (ui.categoryId !== "all") rows = rows.filter(i => i.categoryId === ui.categoryId);
    if (ui.q) rows = rows.filter(i => Core.matches([i.label, i.subCategory, i.description, i.source, i.supplier, i.region].join(" "), ui.q));
    return UI.applySort(rows, ui.sort, {
      label: r => r.label,
      cat: r => (Repo.categories.get(r.categoryId) || {}).name || "",
      unit: r => r.unit,
      priceHT: r => r.priceHT,
      vatRate: r => r.vatRate,
      ttc: r => r.priceHT * (1 + r.vatRate / 100),
      priceDate: r => r.priceDate || "",
    });
  }

  function actions() {
    return `
      <button class="btn" data-act="search" title="Recherche globale">${icon("search", 15)} <span class="kbd">Ctrl K</span></button>
      <button class="btn" data-act="catImport">${icon("upload", 15)} Importer</button>
      <button class="btn" data-act="catExport">${icon("download", 15)} Exporter</button>
      <button class="btn btn-primary" data-act="catNew">${icon("plus", 15)} Ajouter un poste</button>`;
  }

  function render() {
    const rows = filtered();
    const all = Repo.items.all();
    const cats = Repo.categories.list().sort((a, b) => a.order - b.order);
    const inactive = all.filter(i => i.active === false).length;
    const avgUpdate = all.length ? all.filter(i => i.priceDate).sort((a, b) => Core.cmp(b.priceDate, a.priceDate))[0] : null;

    return `
    <div class="stack">
      ${Frag.roleNotice("catalogWrite")}

      <div class="stat-grid">
        ${Frag.stat("Postes actifs", String(all.length - inactive), inactive ? esc(inactive + " désactivé" + (inactive > 1 ? "s" : "")) : "Tous actifs")}
        ${Frag.stat("Catégories", String(cats.filter(c => c.active !== false).length), esc(cats.reduce((a, c) => a + (c.subCategories || []).length, 0) + " sous-catégories"))}
        ${Frag.stat("Prix le plus récent", avgUpdate ? dateFR(avgUpdate.priceDate) : "—", avgUpdate ? esc(avgUpdate.label.slice(0, 42)) : "")}
        ${Frag.stat("Affichés", String(rows.length), ui.q || ui.categoryId !== "all" ? "Filtre actif" : "Catalogue complet")}
      </div>

      <div class="card">
        <div class="card-head">
          ${Frag.searchBox("catSearch", ui.q, "Rechercher un poste, une source, un fournisseur…")}
          <label class="row small muted nowrap" style="gap:6px;cursor:pointer">
            <input type="checkbox" data-chg="catToggleInactive"${ui.showInactive ? " checked" : ""}> Afficher les postes désactivés
          </label>
        </div>
        <div class="card-body" style="padding-bottom:10px">
          <div class="chip-row">
            <button class="chip ${ui.categoryId === "all" ? "active" : ""}" data-act="catFilterCat" data-id="all">Toutes (${all.length})</button>
            ${cats.map(c => {
              const n = all.filter(i => i.categoryId === c.id).length;
              return `<button class="chip ${ui.categoryId === c.id ? "active" : ""}" data-act="catFilterCat" data-id="${c.id}">
                <span class="cat-dot" style="background:${esc(c.color)}"></span> ${esc(c.name)} (${n})</button>`;
            }).join("")}
          </div>
        </div>
        <div class="table-wrap">
          <table class="tbl">
            <thead><tr>
              ${UI.sortTh("Désignation", "label", ui.sort)}
              ${UI.sortTh("Catégorie", "cat", ui.sort)}
              ${UI.sortTh("Unité", "unit", ui.sort)}
              ${UI.sortTh("Prix HT", "priceHT", ui.sort, "r")}
              ${UI.sortTh("TVA", "vatRate", ui.sort, "r")}
              ${UI.sortTh("Prix TTC", "ttc", ui.sort, "r")}
              <th>Source</th>
              ${UI.sortTh("Mise à jour", "priceDate", ui.sort, "r")}
              <th class="r">Actions</th>
            </tr></thead>
            <tbody>
              ${rows.length ? rows.map(rowHtml).join("") : `<tr><td colspan="9">${Frag.empty(
                "Aucun poste ne correspond",
                "Ajustez la recherche ou le filtre de catégorie.",
                `<button class="btn btn-primary" data-act="catNew">${icon("plus", 15)} Ajouter un poste</button>`)}</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>

      <p class="hint">
        Les taux de TVA proviennent du référentiel (Paramètres → TVA) : 5,5 % travaux d'amélioration
        énergétique, 10 % autres travaux de rénovation, 20 % études et diagnostics. Ils sont modifiables.
      </p>
    </div>`;
  }

  function rowHtml(i) {
    const c = Repo.categories.get(i.categoryId);
    const prev = Repo.items.previous(i);
    const ttc = i.priceHT * (1 + i.vatRate / 100);
    let delta = "";
    if (prev && prev.priceHT !== i.priceHT && prev.priceHT > 0) {
      const d = ((i.priceHT - prev.priceHT) / prev.priceHT) * 100;
      delta = `<span class="xsmall ${d > 0 ? "delta-up" : "delta-down"} mono" title="Prix précédent : ${eur2(prev.priceHT)}">
        ${d > 0 ? "▲" : "▼"} ${num(Math.abs(d), 1)} %</span>`;
    }
    return `<tr class="${i.active === false ? "inactive" : ""} ${ui.highlight === i.id ? "picked" : ""}" id="row-${i.id}">
      <td>
        <div class="strong">${esc(i.label)}</div>
        <div class="xsmall muted-3">${esc(i.subCategory || "")}${i.description ? " · " + esc(i.description.slice(0, 70)) : ""}</div>
      </td>
      <td>${c ? `<span class="tag" style="background:${esc(c.color)}22"><span class="cat-dot" style="background:${esc(c.color)}"></span>${esc(c.name)}</span>` : `<span class="tag">—</span>`}</td>
      <td class="muted small">${esc(i.unit)}</td>
      <td class="num r strong">${eur2(i.priceHT)} ${delta}</td>
      <td class="num r muted">${num(i.vatRate, 1)} %</td>
      <td class="num r">${eur2(ttc)}</td>
      <td class="small muted">${esc(i.source || "—")}${i.region ? `<br><span class="xsmall muted-3">${esc(i.region)}</span>` : ""}</td>
      <td class="num r small muted">${dateFR(i.priceDate)}${(i.history || []).length > 1 ? `<br><span class="xsmall muted-3">${i.history.length} versions</span>` : ""}</td>
      <td class="r nowrap">
        <button class="btn btn-ghost btn-icon" data-act="catHistory" data-id="${i.id}" title="Historique des prix">${icon("history", 15)}</button>
        <button class="btn btn-ghost btn-icon" data-act="catEdit" data-id="${i.id}" title="Modifier">${icon("edit", 15)}</button>
        <button class="btn btn-ghost btn-icon" data-act="catDup" data-id="${i.id}" title="Dupliquer">${icon("copy", 15)}</button>
        <button class="btn btn-ghost btn-icon" data-act="catToggle" data-id="${i.id}" title="${i.active === false ? "Réactiver" : "Désactiver"}">${icon(i.active === false ? "check" : "archive", 15)}</button>
        <button class="btn btn-ghost btn-icon" data-act="catDel" data-id="${i.id}" title="Supprimer">${icon("trash", 15)}</button>
      </td>
    </tr>`;
  }

  /* ------------------------------------------------------- Formulaire de poste */
  function editDialog(item) {
    const isNew = !item;
    const it = item || Schema.catalogItem({ vatRate: Repo.settings.get().defaultVat || 5.5 });
    const cats = categoryOptions();
    const subs = [...new Set(Repo.items.all().map(i => i.subCategory).filter(Boolean))].sort();

    const body = `
      <div class="grid-2">
        ${UI.field("Catégorie *", UI.selectInput("categoryId", cats, it.categoryId || (cats[0] && cats[0][0])))}
        ${UI.field("Sous-catégorie", `<input class="inp" name="subCategory" list="sublist" value="${esc(it.subCategory)}">
          <datalist id="sublist">${subs.map(s => `<option value="${esc(s)}"></option>`).join("")}</datalist>`)}
      </div>
      ${UI.field("Désignation *", UI.textInput("label", it.label, 'placeholder="ex. Isolation toiture — R = 6 m².K/W" required'))}
      ${UI.field("Description", UI.textArea("description", it.description, 'rows="2" placeholder="Composition, mise en œuvre, performance visée…"'))}
      <div class="grid-3">
        ${UI.field("Unité *", `<input class="inp" name="unit" list="unitlist" value="${esc(it.unit)}" required>
          <datalist id="unitlist">${unitOptions().map(u => `<option value="${esc(u)}"></option>`).join("")}</datalist>`)}
        ${UI.field("Prix HT *", UI.numInput("priceHT", it.priceHT, 'min="0" required'))}
        ${UI.field("TVA", UI.selectInput("vatRate", vatOptions(), it.vatRate))}
      </div>
      <div class="notice" id="ttc-preview">${icon("calculator", 15)}<div>Prix TTC calculé : <strong class="mono" id="ttc-val">—</strong></div></div>
      <div class="grid-3">
        ${UI.field("Source du prix", UI.textInput("source", it.source, 'list="srclist" placeholder="Base interne BET, devis, série de prix…"'))}
        ${UI.field("Date de mise à jour", `<input class="inp" type="date" name="priceDate" value="${esc(it.priceDate || "")}">`)}
        ${UI.field("Région", UI.textInput("region", it.region, 'placeholder="Île-de-France, national…"'))}
      </div>
      <datalist id="srclist">${[...new Set(Repo.items.all().map(i => i.source).filter(Boolean))].map(s => `<option value="${esc(s)}"></option>`).join("")}</datalist>
      <div class="grid-2">
        ${UI.field("Fournisseur", UI.textInput("supplier", it.supplier))}
        ${UI.field("Statut", `<label class="row small" style="gap:7px;padding-top:7px"><input type="checkbox" name="active"${it.active !== false ? " checked" : ""}> Poste actif (proposé dans les chiffrages)</label>`)}
      </div>
      ${UI.field("Commentaire", UI.textArea("comment", it.comment, 'rows="2"'))}
      ${isNew ? "" : `${UI.field("Motif de la modification", UI.textInput("note", "", 'placeholder="ex. actualisation marché 2026"'), "Consigné dans l'historique des prix.")}`}`;

    const m = UI.modal({
      title: isNew ? "Nouveau poste de prix" : "Modifier le poste",
      sub: isNew ? "Il sera immédiatement disponible dans tous les chiffrages" : it.label,
      body, size: "",
      footer: `<button class="btn" data-modal-close>Annuler</button>
               <button class="btn btn-primary" data-cat-save>${icon("save", 15)} Enregistrer</button>`,
    });

    const preview = () => {
      const f = UI.readForm(m.el);
      const ht = Core.parseNum(f.priceHT), tva = Core.parseNum(f.vatRate);
      m.el.querySelector("#ttc-val").textContent =
        eur2(ht * (1 + tva / 100)) + " / " + (f.unit || "u") + "  (HT " + eur2(ht) + " + TVA " + num(tva, 1) + " %)";
    };
    m.el.addEventListener("input", preview);
    m.el.addEventListener("change", preview);
    preview();

    m.el.querySelector("[data-cat-save]").addEventListener("click", async () => {
      const f = UI.readForm(m.el);
      if (!f.label || !f.label.trim()) return UI.toast("La désignation est obligatoire.", "warn");
      if (!f.unit || !f.unit.trim()) return UI.toast("L'unité est obligatoire.", "warn");
      if (Core.parseNum(f.priceHT) <= 0) return UI.toast("Le prix HT doit être supérieur à 0.", "warn");
      const payload = {
        categoryId: f.categoryId, subCategory: f.subCategory.trim(), label: f.label.trim(),
        description: f.description.trim(), unit: f.unit.trim(), priceHT: Core.parseNum(f.priceHT),
        vatRate: Core.parseNum(f.vatRate), source: f.source.trim(), priceDate: f.priceDate,
        region: f.region.trim(), supplier: f.supplier.trim(), comment: f.comment.trim(), active: !!f.active,
      };
      let saved;
      if (isNew) saved = await Repo.items.create(payload, Auth.name());
      else saved = await Repo.items.update(it.id, payload, Auth.name(), f.note);
      // Rattache la sous-catégorie à la catégorie
      const cat = Repo.categories.get(payload.categoryId);
      if (cat && payload.subCategory && !(cat.subCategories || []).includes(payload.subCategory)) {
        await Repo.categories.update(cat.id, { subCategories: [...(cat.subCategories || []), payload.subCategory] });
      }
      await Repo.flush();
      m.close();
      ui.highlight = saved.id;
      UI.toast(isNew ? "Poste ajouté au catalogue — disponible dans tous les projets." : "Poste mis à jour.", "ok");
      App.render();
    });
  }

  /* ---------------------------------------------------- Historique des prix (§7) */
  function historyDialog(item) {
    const h = (item.history || []).slice().reverse();
    const body = `
      <div class="row between">
        <div>
          <div class="lbl">Prix actuel</div>
          <div class="stat-v accent">${eur2(item.priceHT)} <span class="small muted">/ ${esc(item.unit)} · TVA ${num(item.vatRate, 1)} %</span></div>
        </div>
        <div class="right">
          <div class="lbl">Dernière mise à jour</div>
          <div class="mono">${dateFR(item.priceDate)}</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="hist">
        ${h.length ? h.map((e, idx) => {
          const older = h[idx + 1];
          let d = "";
          if (older && older.priceHT > 0) {
            const pc = ((e.priceHT - older.priceHT) / older.priceHT) * 100;
            d = `<span class="xsmall mono ${pc > 0 ? "delta-up" : "delta-down"}">${pc > 0 ? "+" : ""}${num(pc, 1)} %</span>`;
          }
          return `<div class="hist-row">
            <span class="hist-date">${dateFR(e.priceDate || e.at)}</span>
            <span class="hist-price">${eur2(e.priceHT)}</span>
            <span class="xsmall muted">TVA ${num(e.vatRate, 1)} %</span>
            ${d}
            <span class="small muted-3 spacer right">${esc(e.user || "—")}${e.source ? " · " + esc(e.source) : ""}${e.note ? "<br>" + esc(e.note) : ""}</span>
          </div>`;
        }).join("") : `<p class="hint">Aucun historique enregistré.</p>`}
      </div>`;
    UI.modal({ title: "Historique des prix", sub: item.label, body });
  }

  /* -------------------------------------------------------------- Actions */
  UI.register({
    catFilterCat: d => { ui.categoryId = d.id; App.render(); },
    catNew: () => { if (!Auth.require("catalogWrite", "Seul un administrateur peut modifier le catalogue.")) return; editDialog(null); },
    catEdit: d => { if (!Auth.require("catalogWrite", "Seul un administrateur peut modifier le catalogue.")) return; editDialog(Repo.items.get(d.id)); },
    catHistory: d => historyDialog(Repo.items.get(d.id)),
    catDup: async d => {
      if (!Auth.require("catalogWrite")) return;
      const src = Repo.items.get(d.id);
      const copy = await Repo.items.duplicate(d.id, c => { c.label = src.label + " (copie)"; c.history = []; });
      await Repo.flush();
      ui.highlight = copy.id;
      UI.toast("Poste dupliqué.", "ok");
      App.render();
      editDialog(copy);
    },
    catToggle: async d => {
      if (!Auth.require("catalogWrite")) return;
      const it = Repo.items.get(d.id);
      await Repo.items.update(d.id, { active: it.active === false }, Auth.name());
      await Repo.flush();
      UI.toast(it.active === false ? "Poste réactivé." : "Poste désactivé — il reste dans les chiffrages existants.", "ok");
      App.render();
    },
    catDel: async d => {
      if (!Auth.require("catalogWrite")) return;
      const it = Repo.items.get(d.id);
      const used = Repo.projects.all().filter(p => (p.scenarios || []).some(s => (s.lines || []).some(l => l.catalogItemId === it.id)));
      const ok = await UI.confirm({
        title: "Supprimer ce poste ?",
        message: `« ${it.label} » sera retiré du catalogue.`,
        detail: used.length
          ? `Ce poste est utilisé dans ${used.length} projet${used.length > 1 ? "s" : ""}. Les lignes déjà chiffrées conservent leur prix (copie figée) et ne seront pas modifiées. Vous pouvez aussi simplement le désactiver.`
          : "L'historique des prix de ce poste sera également supprimé.",
        confirmLabel: "Supprimer", danger: true,
      });
      if (!ok) return;
      await Repo.items.remove(d.id);
      await Repo.flush();
      UI.toast("Poste supprimé.", "ok");
      App.render();
    },
    catSearchClear: () => { ui.q = ""; App.render(); },
    catImport: () => { if (!Auth.require("catalogWrite")) return; ImportExport.catalogImportDialog(); },
    catExport: () => ImportExport.exportCatalogXlsx(),
    sort: d => {
      if (App.state.route !== "catalog") return;
      ui.sort = ui.sort.key === d.key
        ? { key: d.key, dir: ui.sort.dir === "asc" ? "desc" : "asc" }
        : { key: d.key, dir: "asc" };
      App.render();
    },
  }, UI.Actions);

  UI.register({
    catSearch: (d, el) => {
      ui.q = el.value;
      const page = document.getElementById("page");
      const pos = el.selectionStart;
      App.render();
      const again = document.querySelector('[data-inp="catSearch"]');
      if (again) { again.focus(); again.setSelectionRange(pos, pos); }
      void page;
    },
  }, UI.Inputs);

  UI.register({
    catToggleInactive: (d, el) => { ui.showInactive = el.checked; App.render(); },
  }, UI.Changes);

  function focusItem(id) {
    ui.highlight = id; ui.categoryId = "all"; ui.q = "";
    App.render();
    const el = document.getElementById("row-" + id);
    if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  return { render, actions, focusItem, editDialog, ui };
})();


/* ===== 11-view-projects.js =========================================== */
/* =========================================================================
 * 11 — ÉCRAN PROJETS (§3, §4) : liste, création, duplication, versions,
 * archivage, suppression, recherche.
 * ========================================================================= */
Views.Projects = (() => {
  "use strict";
  const { esc, eur, dateFR } = Core;
  const icon = UI.icon;

  const ui = { q: "", status: "actif", sort: UI.sortState("updatedAt", "desc") };

  function totalsOf(p) {
    const t = Calc.projectTotals(p, { coefficients: Repo.coefficients.all() });
    return t || { totalTTC: 0, totalHT: 0, nbLines: 0 };
  }

  function list() {
    let rows = Repo.projects.list(p => (ui.status === "tous" ? true : ui.status === "archivé" ? p.status === "archivé" : p.status !== "archivé"));
    if (ui.q) rows = rows.filter(p => Core.matches([p.name, p.coproName, p.city, p.postalCode, p.reference, p.engineer, p.missionType].join(" "), ui.q));
    return UI.applySort(rows, ui.sort, {
      name: r => r.name, city: r => r.city, updatedAt: r => r.updatedAt,
      studyDate: r => r.studyDate, amount: r => totalsOf(r).totalTTC, engineer: r => r.engineer,
    });
  }

  function actions() {
    return `<button class="btn btn-primary" data-act="prjNew">${icon("plus", 15)} Nouveau projet</button>`;
  }

  function render() {
    const rows = list();
    const all = Repo.projects.all();
    return `
    <div class="stack">
      ${Frag.roleNotice("projectWrite")}
      <div class="card">
        <div class="card-head">
          ${Frag.searchBox("prjSearch", ui.q, "Rechercher un projet, une copropriété, une ville, une référence…")}
          <div class="chip-row spacer">
            ${[["actif", "Actifs"], ["archivé", "Archivés"], ["tous", "Tous"]].map(([v, l]) =>
              `<button class="chip ${ui.status === v ? "active" : ""}" data-act="prjStatus" data-v="${v}">${l}</button>`).join("")}
          </div>
        </div>
        <div class="table-wrap">
          <table class="tbl">
            <thead><tr>
              <th class="sortable" data-act="prjSort" data-key="name">Projet</th>
              <th class="sortable" data-act="prjSort" data-key="city">Localisation</th>
              <th>Mission</th>
              <th class="r">Logements</th>
              <th class="r">Bâtiments</th>
              <th class="r sortable" data-act="prjSort" data-key="amount">Montant TTC</th>
              <th class="sortable" data-act="prjSort" data-key="engineer">Chargé d'étude</th>
              <th class="r sortable" data-act="prjSort" data-key="updatedAt">Modifié</th>
              <th class="r">Actions</th>
            </tr></thead>
            <tbody>
              ${rows.length ? rows.map(rowHtml).join("") : `<tr><td colspan="9">${Frag.empty(
                all.length ? "Aucun projet ne correspond" : "Aucun projet pour l'instant",
                all.length ? "Modifiez la recherche ou le filtre de statut." : "Créez votre premier dossier de chiffrage : fiche projet, bâtiments, métrés, scénarios.",
                `<button class="btn btn-primary" data-act="prjNew">${icon("plus", 15)} Nouveau projet</button>`)}</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
  }

  function rowHtml(p) {
    const t = totalsOf(p);
    const nbScn = (p.scenarios || []).length;
    return `<tr>
      <td>
        <button class="btn btn-ghost" style="padding:0" data-act="prjOpen" data-id="${p.id}">
          <span class="strong">${esc(p.name)}</span></button>
        <div class="xsmall muted-3">${esc(p.coproName || "—")}${p.reference ? " · " + esc(p.reference) : ""}
          <span class="tag" style="margin-left:4px">${esc(p.version)}</span>
          ${p.status === "archivé" ? `<span class="tag warn">Archivé</span>` : ""}
          ${nbScn ? `<span class="tag accent">${nbScn} scénario${nbScn > 1 ? "s" : ""}</span>` : ""}
          ${(p.dpes || []).length ? `<span class="tag ember">${p.dpes.length} DPE</span>` : ""}
        </div>
      </td>
      <td class="small">${esc(p.city || "—")}<div class="xsmall muted-3">${esc(p.postalCode || "")}${p.department ? " · " + esc(p.department) : ""}</div></td>
      <td><span class="tag">${esc(p.missionType || "—")}</span></td>
      <td class="num r">${p.nbDwellings || "—"}</td>
      <td class="num r">${(p.buildings || []).length || p.nbBuildings || "—"}</td>
      <td class="num r strong">${t.totalTTC ? eur(t.totalTTC) : "—"}</td>
      <td class="small muted">${esc(p.engineer || "—")}</td>
      <td class="num r small muted">${dateFR(p.updatedAt)}</td>
      <td class="r nowrap">
        <button class="btn btn-ghost btn-icon" data-act="prjOpen" data-id="${p.id}" title="Ouvrir">${icon("external", 15)}</button>
        <button class="btn btn-ghost btn-icon" data-act="prjEdit" data-id="${p.id}" title="Modifier la fiche">${icon("edit", 15)}</button>
        <button class="btn btn-ghost btn-icon" data-act="prjVersion" data-id="${p.id}" title="Créer une nouvelle version">${icon("layers", 15)}</button>
        <button class="btn btn-ghost btn-icon" data-act="prjDup" data-id="${p.id}" title="Dupliquer">${icon("copy", 15)}</button>
        <button class="btn btn-ghost btn-icon" data-act="prjArchive" data-id="${p.id}" title="${p.status === "archivé" ? "Désarchiver" : "Archiver"}">${icon("archive", 15)}</button>
        <button class="btn btn-ghost btn-icon" data-act="prjDel" data-id="${p.id}" title="Supprimer">${icon("trash", 15)}</button>
      </td>
    </tr>`;
  }

  /**
   * Copie profonde d'un projet (version ou duplication) : nouveaux identifiants
   * ET remappage des affectations bâtiment des lignes de travaux et des DPE,
   * pour que la ventilation par bâtiment survive à la copie.
   */
  function remapCopy(c) {
    const map = {};
    c.buildings = (c.buildings || []).map(b => { const id = Core.uid("bat"); map[b.id] = id; return Object.assign({}, b, { id }); });
    c.scenarios = (c.scenarios || []).map(s => Object.assign({}, s, {
      id: Core.uid("scn"),
      lines: (s.lines || []).map(l => Object.assign({}, l, {
        id: Core.uid("lin"), buildingIds: (l.buildingIds || []).map(id => map[id]).filter(Boolean),
      })),
      fees: (s.fees || []).map(f => Object.assign({}, f, { id: Core.uid("fee") })),
      aids: (s.aids || []).map(a => Object.assign({}, a, { id: Core.uid("aid") })),
    }));
    c.dpes = (c.dpes || []).map(r => Object.assign({}, r, { id: Core.uid("dpe"), buildingId: r.buildingId ? (map[r.buildingId] || null) : null }));
  }

  /* ------------------------------------------------------ Formulaire projet */
  function formBody(p) {
    const s = Repo.settings.get();
    return `
      <div class="grid-2">
        ${UI.field("Nom du projet *", UI.textInput("name", p.name, 'placeholder="ex. Résidence Les Lilas — PPPT" required'))}
        ${UI.field("Nom de la copropriété", UI.textInput("coproName", p.coproName))}
      </div>
      ${UI.field("Adresse", UI.textInput("address", p.address))}
      <div class="grid-3">
        ${UI.field("Code postal", UI.textInput("postalCode", p.postalCode, 'inputmode="numeric" maxlength="5"'))}
        ${UI.field("Ville", UI.textInput("city", p.city))}
        ${UI.field("Département", UI.textInput("department", p.department))}
      </div>
      <div class="grid-3">
        ${UI.field("Année de construction", UI.textInput("constructionYear", p.constructionYear, 'inputmode="numeric" maxlength="4"'))}
        ${UI.field("Nombre de bâtiments", UI.numInput("nbBuildings", p.nbBuildings || "", 'min="0"'))}
        ${UI.field("Nombre de logements", UI.numInput("nbDwellings", p.nbDwellings || "", 'min="0"'))}
      </div>
      <div class="grid-3">
        ${UI.field("Surface habitable (m²)", UI.numInput("livingArea", p.livingArea || "", 'min="0"'))}
        ${UI.field("Surface de plancher (m²)", UI.numInput("floorArea", p.floorArea || "", 'min="0"'))}
        ${UI.field("Nombre de niveaux", UI.numInput("nbLevels", p.nbLevels || "", 'min="0"'))}
      </div>
      <div class="grid-3">
        ${UI.field("Type de chauffage", UI.selectInput("heatingType", ["", ...Seed.HEATING_TYPES], p.heatingType))}
        ${UI.field("Type d'ECS", UI.selectInput("dhwType", ["", ...Seed.DHW_TYPES], p.dhwType))}
        ${UI.field("Énergie utilisée", UI.selectInput("energy", ["", ...Seed.ENERGIES], p.energy))}
      </div>
      <div class="grid-3">
        ${UI.field("Type de mission", UI.selectInput("missionType", Seed.MISSION_TYPES, p.missionType))}
        ${UI.field("Date du chiffrage", `<input class="inp" type="date" name="studyDate" value="${esc(p.studyDate || "")}">`)}
        ${UI.field("Chargé d'étude", UI.textInput("engineer", p.engineer || s.defaultEngineer || ""))}
      </div>
      <div class="grid-3">
        ${UI.field("Référence dossier", UI.textInput("reference", p.reference, 'placeholder="ex. 2026-042"'))}
        ${UI.field("Version du chiffrage", UI.textInput("version", p.version, 'placeholder="V1"'))}
        ${UI.field("Tantièmes généraux", UI.numInput("totalTantiemes", p.totalTantiemes || "", 'min="0"'), "Base de la quote-part")}
      </div>
      <div class="grid-2">
        ${UI.field("Niveau de précision", UI.selectInput("precisionLevel", Seed.PRECISION_LEVELS.map(x => x.label), p.precisionLevel))}
        ${UI.field("Incertitude (±%)", UI.numInput("uncertainty", p.uncertainty, 'min="0" max="50"'), "Affichée en fourchette sur tous les montants")}
      </div>
      ${UI.field("Commentaires", UI.textArea("comment", p.comment, 'rows="3"'))}`;
  }

  function readProject(el) {
    const f = UI.readForm(el);
    return {
      name: f.name.trim(), coproName: f.coproName.trim(), address: f.address.trim(),
      postalCode: f.postalCode.trim(), city: f.city.trim(), department: f.department.trim(),
      constructionYear: f.constructionYear.trim(),
      nbBuildings: Core.parseNum(f.nbBuildings), nbDwellings: Core.parseNum(f.nbDwellings),
      livingArea: Core.parseNum(f.livingArea), floorArea: Core.parseNum(f.floorArea),
      nbLevels: Core.parseNum(f.nbLevels), heatingType: f.heatingType, dhwType: f.dhwType,
      energy: f.energy, missionType: f.missionType, studyDate: f.studyDate,
      engineer: f.engineer.trim(), reference: f.reference.trim(), version: f.version.trim() || "V1",
      totalTantiemes: Core.parseNum(f.totalTantiemes), precisionLevel: f.precisionLevel,
      uncertainty: Core.parseNum(f.uncertainty), comment: f.comment.trim(),
    };
  }

  /**
   * Création d'un projet. `prefill` pré-remplit la fiche (ex. depuis des DPE) ;
   * `after(p)` est appelé une fois le projet créé et peut renvoyer {tab, toast}.
   */
  function createDialog(prefill, after) {
    if (!Auth.require("projectWrite", "Votre rôle ne permet pas de créer un projet.")) return;
    const draft = Schema.project(Object.assign({ engineer: Repo.settings.get().defaultEngineer || Auth.name() }, prefill || {}));
    const m = UI.modal({
      title: "Nouveau projet", sub: prefill ? "Fiche pré-remplie à partir des DPE — vérifiez et complétez" : "Fiche d'identification du dossier de chiffrage",
      body: formBody(draft), size: "wide",
      footer: `<button class="btn" data-modal-close>Annuler</button>
               <button class="btn btn-primary" data-prj-save>${icon("check", 15)} Créer le projet</button>`,
    });
    m.el.querySelector("[data-prj-save]").addEventListener("click", async () => {
      const payload = readProject(m.el);
      if (!payload.name) return UI.toast("Le nom du projet est obligatoire.", "warn");
      const p = await Repo.projects.create(Object.assign(payload, { createdBy: Auth.name() }));
      // Amorçage : un bâtiment et un scénario, pour que le projet soit exploitable tout de suite.
      const nb = Math.max(1, Math.min(Core.parseNum(payload.nbBuildings) || 1, 12));
      const letters = "ABCDEFGHIJKL";
      p.buildings = Array.from({ length: nb }, (_, i) => Schema.building({
        name: "Bâtiment " + letters[i],
        nbDwellings: nb ? Math.round(Core.parseNum(payload.nbDwellings) / nb) : 0,
        nbLevels: Core.parseNum(payload.nbLevels),
        metrics: { livingArea: Schema.measurement({ value: nb ? Core.round(Core.parseNum(payload.livingArea) / nb, 2) : 0, by: Auth.name() }) },
      }));
      p.scenarios = [Schema.scenario({ name: "Scénario 1 — Travaux prioritaires", selected: true })];
      let nav = { tab: "fiche", toast: "Projet créé." };
      if (typeof after === "function") nav = Object.assign(nav, (await after(p)) || {});
      Repo.touch("projects");
      await Repo.flush();
      m.close();
      UI.toast(nav.toast, "ok");
      App.go("project", { projectId: p.id, tab: nav.tab });
    });
  }

  function editDialog(p) {
    if (!Auth.require("projectWrite")) return;
    const m = UI.modal({
      title: "Fiche projet", sub: p.name, body: formBody(p), size: "wide",
      footer: `<button class="btn" data-modal-close>Annuler</button>
               <button class="btn btn-primary" data-prj-save>${icon("save", 15)} Enregistrer</button>`,
    });
    m.el.querySelector("[data-prj-save]").addEventListener("click", async () => {
      const payload = readProject(m.el);
      if (!payload.name) return UI.toast("Le nom du projet est obligatoire.", "warn");
      await Repo.projects.update(p.id, Object.assign(payload, { updatedBy: Auth.name() }));
      await Repo.flush();
      m.close();
      UI.toast("Fiche projet enregistrée.", "ok");
      App.render();
    });
  }

  /** Nouvelle version : copie complète, chaînée au projet d'origine (§4). */
  async function newVersion(p) {
    if (!Auth.require("projectWrite")) return;
    const family = Repo.projects.all().filter(x => x.id === p.id || x.parentId === p.id || x.parentId === p.parentId);
    const maxV = family.reduce((mx, x) => {
      const n = parseInt(String(x.version).replace(/[^0-9]/g, ""), 10);
      return Number.isFinite(n) ? Math.max(mx, n) : mx;
    }, 1);
    const nextV = "V" + (maxV + 1);
    const ok = await UI.confirm({
      title: "Créer la version " + nextV + " ?",
      message: `Une copie complète de « ${p.name} » est créée en ${nextV} (bâtiments, métrés, DPE, scénarios, aides).`,
      detail: "La version actuelle est conservée intacte : vous pourrez comparer les deux.",
      confirmLabel: "Créer " + nextV,
    });
    if (!ok) return;
    const copy = await Repo.projects.duplicate(p.id, c => {
      c.version = nextV;
      c.parentId = p.parentId || p.id;
      c.status = "actif";
      c.createdBy = Auth.name();
      remapCopy(c);
    });
    await Repo.flush();
    UI.toast("Version " + nextV + " créée.", "ok");
    App.go("project", { projectId: copy.id, tab: "fiche" });
  }

  UI.register({
    prjNew: () => createDialog(),
    prjOpen: d => App.go("project", { projectId: d.id, tab: "fiche" }),
    prjEdit: d => editDialog(Repo.projects.get(d.id)),
    prjVersion: d => newVersion(Repo.projects.get(d.id)),
    prjStatus: d => { ui.status = d.v; App.render(); },
    prjSort: d => {
      ui.sort = ui.sort.key === d.key ? { key: d.key, dir: ui.sort.dir === "asc" ? "desc" : "asc" } : { key: d.key, dir: "asc" };
      App.render();
    },
    prjDup: async d => {
      if (!Auth.require("projectWrite")) return;
      const src = Repo.projects.get(d.id);
      const copy = await Repo.projects.duplicate(d.id, c => {
        c.name = src.name + " (copie)"; c.version = "V1"; c.parentId = null; c.createdBy = Auth.name();
        remapCopy(c);
      });
      await Repo.flush();
      UI.toast("Projet dupliqué.", "ok");
      App.go("project", { projectId: copy.id, tab: "fiche" });
    },
    prjArchive: async d => {
      if (!Auth.require("projectWrite")) return;
      const p = Repo.projects.get(d.id);
      await Repo.projects.update(d.id, { status: p.status === "archivé" ? "actif" : "archivé" });
      await Repo.flush();
      UI.toast(p.status === "archivé" ? "Projet réactivé." : "Projet archivé.", "ok");
      App.render();
    },
    prjDel: async d => {
      if (!Auth.require("projectWrite")) return;
      const p = Repo.projects.get(d.id);
      const ok = await UI.confirm({
        title: "Supprimer ce projet ?",
        message: `« ${p.name} » (${p.version}) et l'ensemble de ses scénarios seront supprimés.`,
        detail: "Cette action est définitive. Pour conserver le dossier sans l'afficher, préférez l'archivage.",
        confirmLabel: "Supprimer définitivement", danger: true,
      });
      if (!ok) return;
      await Repo.projects.remove(d.id);
      await Repo.flush();
      UI.toast("Projet supprimé.", "ok");
      if (App.state.projectId === d.id) App.go("projects");
      else App.render();
    },
  }, UI.Actions);

  UI.register({
    prjSearch: (d, el) => {
      ui.q = el.value;
      const pos = el.selectionStart;
      App.render();
      const again = document.querySelector('[data-inp="prjSearch"]');
      if (again) { again.focus(); again.setSelectionRange(pos, pos); }
    },
  }, UI.Inputs);

  return { render, actions, createDialog, editDialog, newVersion };
})();


/* ===== 12-view-project.js ============================================ */
/* =========================================================================
 * 12 — ÉCRAN PROJET : fiche, bâtiments & métrés, scénarios, travaux,
 * frais annexes, aides, analyse économique. (§4, §5, §10 à §19)
 * ========================================================================= */
Views.Project = (() => {
  "use strict";
  const { esc, eur, eur2, num, dateFR } = Core;
  const icon = UI.icon;

  const TABS = [
    ["fiche", "Fiche projet", "file"],
    ["dpe", "Diagnostic DPE", "gauge"],
    ["batiments", "Bâtiments & métrés", "building"],
    ["scenarios", "Scénarios", "layers"],
    ["travaux", "Travaux", "ruler"],
    ["frais", "Frais annexes", "euro"],
    ["aides", "Aides & reste à charge", "star"],
    ["economie", "Analyse économique", "chart"],
  ];

  const P = () => App.currentProject();
  const refs = () => ({ coefficients: Repo.coefficients.all() });

  function activeScenario(p) {
    const s = p.scenarios || [];
    if (!s.length) return null;
    return s.find(x => x.selected) || s[0];
  }
  const tab = () => App.state.tab || "fiche";

  function actions() {
    const p = P();
    if (!p) return "";
    return `
      <button class="btn" data-act="prjEdit" data-id="${p.id}">${icon("edit", 15)} Modifier la fiche</button>
      <button class="btn" data-act="prjVersion" data-id="${p.id}">${icon("layers", 15)} Nouvelle version</button>
      <button class="btn" data-act="pXlsx">${icon("download", 15)} Excel</button>
      <button class="btn btn-primary" data-act="pPdf">${icon("report", 15)} Rapport PDF</button>`;
  }

  function render() {
    const p = P();
    if (!p) return Frag.empty("Projet introuvable", "Il a peut-être été supprimé.");
    const t = Calc.projectTotals(p, refs());
    const cur = tab();
    return `
    <div class="stack">
      <div class="tabs">
        ${TABS.map(([k, l, ic]) => `<button class="tab ${cur === k ? "active" : ""}" data-act="pTab" data-tab="${k}">
          ${icon(ic, 15)} ${esc(l)}${k === "dpe" && (p.dpes || []).length ? `<span class="cnt">${p.dpes.length}</span>` : ""}</button>`).join("")}
      </div>
      ${cur === "fiche" ? fiche(p, t)
        : cur === "dpe" ? Views.Dpe.panel(p.id)
        : cur === "batiments" ? batiments(p)
        : cur === "scenarios" ? scenarios(p)
        : cur === "travaux" ? travaux(p)
        : cur === "frais" ? frais(p)
        : cur === "aides" ? aides(p)
        : economie(p)}
    </div>`;
  }

  /* =========================================================== FICHE PROJET */
  function fiche(p, t) {
    const line = (l, v) => `<div><div class="lbl">${esc(l)}</div><div>${v || "<span class='muted-3'>—</span>"}</div></div>`;
    const versions = Repo.projects.list(x => x.id === p.id || x.parentId === (p.parentId || p.id) || x.id === p.parentId)
      .sort((a, b) => Core.cmp(a.version, b.version));
    return `
      <div class="stat-grid">
        ${Frag.stat("Montant TTC (scénario retenu)", t ? eur(t.totalTTC) : "—", t ? esc(t.name) : "Aucun scénario", "accent")}
        ${Frag.stat("Coût par logement", t && t.perDwellingTTC ? eur(t.perDwellingTTC) : "—", (p.nbDwellings || 0) + " logements")}
        ${Frag.stat("Postes chiffrés", t ? String(t.nbLines) : "0", (p.scenarios || []).length + " scénario(s)")}
        ${Frag.stat("Précision", esc(p.precisionLevel), "± " + num(p.uncertainty, 0) + " %")}
      </div>

      ${t ? `<div class="card"><div class="card-body">
        <div class="row between">
          <div><div class="lbl">Fourchette d'estimation TTC</div>
            <div class="mono" style="font-size:15px"><strong>${eur(t.range.ttcLow)}</strong> — <strong>${eur(t.range.ttcHigh)}</strong></div></div>
          <div class="right"><div class="lbl">Valeur centrale</div><div class="stat-v accent">${eur(t.totalTTC)}</div></div>
        </div>
        <div class="range-bar"><div class="range-track"></div><div class="range-mid" style="left:50%"></div></div>
        <p class="hint">${esc(p.precisionLevel)} — un chiffrage de BET est une estimation, pas un devis d'entreprise.</p>
      </div></div>` : ""}

      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3>Identification</h3></div>
          <div class="card-body grid-2">
            ${line("Copropriété", esc(p.coproName))}
            ${line("Référence dossier", esc(p.reference))}
            ${line("Adresse", esc(p.address))}
            ${line("Ville", esc([p.postalCode, p.city].filter(Boolean).join(" ")))}
            ${line("Département", esc(p.department))}
            ${line("Année de construction", esc(p.constructionYear))}
            ${line("Type de mission", esc(p.missionType))}
            ${line("Date du chiffrage", dateFR(p.studyDate))}
            ${line("Chargé d'étude", esc(p.engineer))}
            ${line("Version", esc(p.version))}
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Caractéristiques du bâti</h3></div>
          <div class="card-body grid-2">
            ${line("Bâtiments", (p.buildings || []).length || p.nbBuildings)}
            ${line("Logements", p.nbDwellings)}
            ${line("Surface habitable", p.livingArea ? num(p.livingArea, 0) + " m²" : "")}
            ${line("Surface de plancher", p.floorArea ? num(p.floorArea, 0) + " m²" : "")}
            ${line("Niveaux", p.nbLevels)}
            ${line("Tantièmes généraux", p.totalTantiemes ? num(p.totalTantiemes, 0) : "")}
            ${line("Chauffage", esc(p.heatingType))}
            ${line("ECS", esc(p.dhwType))}
            ${line("Énergie", esc(p.energy))}
          </div>
        </div>
      </div>

      ${Views.Dpe.ficheCard(p)}

      ${versions.length > 1 ? `<div class="card">
        <div class="card-head"><h3>Versions du chiffrage</h3></div>
        <div class="card-body chip-row">
          ${versions.map(v => `<button class="chip ${v.id === p.id ? "active" : ""}" data-act="prjOpen" data-id="${v.id}">
            ${esc(v.version)} · ${dateFR(v.updatedAt)}</button>`).join("")}
        </div>
      </div>` : ""}

      ${p.comment ? `<div class="card"><div class="card-head"><h3>Commentaires</h3></div>
        <div class="card-body small" style="white-space:pre-wrap">${esc(p.comment)}</div></div>` : ""}`;
  }

  /* ====================================================== BÂTIMENTS & MÉTRÉS */
  function batiments(p) {
    const bs = p.buildings || [];
    return `
      <div class="row between">
        <p class="small muted">Chaque bâtiment porte ses propres métrés. Les travaux peuvent ensuite être affectés
          à un bâtiment, à plusieurs, ou à toute la copropriété.</p>
        <div class="btn-group">
          <button class="btn" data-act="bMetricsImport">${icon("upload", 15)} Importer des métrés</button>
          <button class="btn btn-primary" data-act="bNew">${icon("plus", 15)} Ajouter un bâtiment</button>
        </div>
      </div>
      ${bs.length ? bs.map(buildingCard(p)).join("") : Frag.empty("Aucun bâtiment",
        "Ajoutez au moins un bâtiment pour saisir les métrés et ventiler les travaux.",
        `<button class="btn btn-primary" data-act="bNew">${icon("plus", 15)} Ajouter un bâtiment</button>`)}
      ${bs.length ? totalsMetrics(bs) : ""}`;
  }

  const buildingCard = (p) => (b) => {
    const m = b.metrics || {};
    return `<div class="card">
      <div class="card-head">
        <h3>${esc(b.name)}</h3>
        <span class="tag">${b.nbDwellings || 0} logements</span>
        <span class="tag">${b.nbLevels || 0} niveaux</span>
        ${b.tantiemes ? `<span class="tag">${num(b.tantiemes, 0)} tantièmes</span>` : ""}
        <span class="spacer"></span>
        <button class="btn btn-sm" data-act="bEdit" data-id="${b.id}">${icon("edit", 14)} Modifier</button>
        <button class="btn btn-sm" data-act="bDup" data-id="${b.id}">${icon("copy", 14)}</button>
        <button class="btn btn-sm btn-danger" data-act="bDel" data-id="${b.id}">${icon("trash", 14)}</button>
      </div>
      <div class="table-wrap">
        <table class="tbl">
          <thead><tr><th>Métré</th><th class="r">Valeur</th><th>Unité</th><th>Origine</th><th>Détail</th><th class="r"></th></tr></thead>
          <tbody>
            ${Seed.BUILDING_METRICS.map(def => metricRow(b, def.key, def.label, def.unit, m[def.key])).join("")}
            ${(b.customMetrics || []).map((cm, i) => metricRow(b, "custom:" + i, cm.label, cm.unit, cm.measure)).join("")}
            <tr><td colspan="6"><button class="btn btn-sm btn-ghost" data-act="bCustomMetric" data-id="${b.id}">
              ${icon("plus", 14)} Ajouter un métré personnalisé</button></td></tr>
          </tbody>
        </table>
      </div>
    </div>`;
  };

  function metricRow(b, key, label, unit, mea) {
    const v = mea ? Core.parseNum(mea.value) : 0;
    const origin = mea ? mea.origin : "—";
    const badge = { saisie: "tag", calcul: "tag accent", import: "tag ember" }[origin] || "tag";
    return `<tr>
      <td>${esc(label)}</td>
      <td class="num r strong">${v ? num(v, 2) : "<span class='muted-3'>—</span>"}</td>
      <td class="muted small">${esc(unit)}</td>
      <td>${mea ? `<span class="${badge}">${esc(origin)}</span>` : "<span class='muted-3 small'>non renseigné</span>"}</td>
      <td class="small muted-3">${mea && mea.formula ? `<span class="mono">${esc(mea.formula)}</span>` : mea && mea.sourceFile ? esc(mea.sourceFile) : ""}
        ${mea && mea.at ? `<span class="xsmall"> · ${dateFR(mea.at)}</span>` : ""}</td>
      <td class="r"><button class="btn btn-sm" data-act="bMetric" data-id="${b.id}" data-key="${esc(key)}" data-label="${esc(label)}" data-unit="${esc(unit)}">
        ${icon("edit", 14)} Saisir</button></td>
    </tr>`;
  }

  function totalsMetrics(bs) {
    const tot = k => bs.reduce((a, b) => a + Core.parseNum((b.metrics || {})[k] && b.metrics[k].value), 0);
    return `<div class="card"><div class="card-head"><h3>Cumul copropriété</h3></div>
