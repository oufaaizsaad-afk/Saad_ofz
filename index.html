      <div class="card-body stat-grid">
        ${Seed.BUILDING_METRICS.map(d => Frag.stat(d.label, num(tot(d.key), 0) + " " + d.unit)).join("")}
      </div></div>`;
  }

  /* ============================================================= SCÉNARIOS */
  function scenarios(p) {
    const all = Calc.compare(p, refs());
    return `
      <div class="row between">
        <p class="small muted">Un scénario = un bouquet de travaux. Créez-en plusieurs pour comparer
          des niveaux d'ambition, puis retenez celui qui sert de référence au projet.</p>
        <div class="btn-group">
          <button class="btn" data-act="go" data-route="compare">${icon("chart", 15)} Comparateur</button>
          <button class="btn btn-primary" data-act="sNew">${icon("plus", 15)} Nouveau scénario</button>
        </div>
      </div>
      ${(p.scenarios || []).length ? `<div class="grid-3">
        ${p.scenarios.map(s => {
          const t = all.find(x => x.scenarioId === s.id);
          return `<div class="card" style="${s.selected ? "border-color:var(--c-accent)" : ""}">
            <div class="card-head">
              <h3 style="text-transform:none;font-size:14px;color:var(--c-text)">${esc(s.name)}</h3>
              ${s.selected ? `<span class="tag accent">Retenu</span>` : ""}
            </div>
            <div class="card-body stack-sm">
              <div class="row between"><span class="small muted">Postes</span><span class="mono">${t.nbLines}</span></div>
              <div class="row between"><span class="small muted">Total HT</span><span class="mono">${eur(t.totalHT)}</span></div>
              <div class="row between"><span class="small muted">Total TTC</span><span class="mono strong">${eur(t.totalTTC)}</span></div>
              <div class="row between"><span class="small muted">Aides</span><span class="mono">${t.aidsTotal ? "− " + eur(t.aidsTotal) : "—"}</span></div>
              <div class="row between"><span class="small muted">Reste à charge</span><span class="mono strong" style="color:var(--c-ember)">${eur(t.remainder)}</span></div>
              <div class="row between"><span class="small muted">€ / logement</span><span class="mono">${t.perDwellingRemainder ? eur(t.perDwellingRemainder) : "—"}</span></div>
              <div class="row between"><span class="small muted">Temps de retour</span><span class="mono">${t.eco.payback ? num(t.eco.payback, 1) + " ans" : "—"}</span></div>
              ${s.description ? `<p class="xsmall muted-3">${esc(s.description)}</p>` : ""}
              <div class="divider"></div>
              <div class="row">
                <button class="btn btn-sm" data-act="sOpen" data-id="${s.id}">${icon("ruler", 14)} Travaux</button>
                <button class="btn btn-sm" data-act="sEdit" data-id="${s.id}">${icon("edit", 14)}</button>
                <button class="btn btn-sm" data-act="sDup" data-id="${s.id}">${icon("copy", 14)}</button>
                <button class="btn btn-sm btn-danger" data-act="sDel" data-id="${s.id}">${icon("trash", 14)}</button>
                ${s.selected ? "" : `<button class="btn btn-sm spacer" data-act="sSelect" data-id="${s.id}">Retenir</button>`}
              </div>
            </div>
          </div>`;
        }).join("")}
      </div>` : Frag.empty("Aucun scénario", "Créez un premier scénario pour commencer à chiffrer des travaux.",
        `<button class="btn btn-primary" data-act="sNew">${icon("plus", 15)} Nouveau scénario</button>`)}`;
  }

  /* =============================================================== TRAVAUX */
  function scenarioPicker(p, s) {
    return `<div class="row" style="gap:8px">
      <span class="lbl">Scénario</span>
      <select class="inp" style="max-width:340px" data-chg="pPickScenario">
        ${(p.scenarios || []).map(x => `<option value="${x.id}"${x.id === s.id ? " selected" : ""}>${esc(x.name)}</option>`).join("")}
      </select>
      ${s.selected ? `<span class="tag accent">Scénario retenu</span>` : `<button class="btn btn-sm" data-act="sSelect" data-id="${s.id}">Retenir ce scénario</button>`}
    </div>`;
  }

  function travaux(p) {
    const s = activeScenario(p);
    if (!s) return Frag.empty("Aucun scénario", "Créez d'abord un scénario dans l'onglet Scénarios.",
      `<button class="btn btn-primary" data-act="sNew">${icon("plus", 15)} Nouveau scénario</button>`);
    const t = Calc.scenarioTotals(s, p, refs());
    const byCat = Core.groupBy(t.lines, x => x.line.categoryId);

    return `
      <div class="card"><div class="card-body">
        <div class="row between">
          ${scenarioPicker(p, s)}
          <div class="btn-group">
            <button class="btn" data-act="wCoefAll">${icon("ruler", 15)} Coefficients globaux</button>
            <button class="btn btn-primary" data-act="wAdd">${icon("plus", 15)} Ajouter des postes</button>
          </div>
        </div>
      </div></div>

      ${t.lines.length ? `
      <div class="card">
        <div class="table-wrap">
          <table class="tbl">
            <thead><tr>
              <th style="min-width:240px">Désignation</th>
              <th>Unité</th>
              <th class="r">PU catalogue</th>
              <th class="c">Coef.</th>
              <th class="r">PU projet</th>
              <th class="c" style="width:110px">Quantité</th>
              <th class="r">TVA</th>
              <th class="r">Total HT</th>
              <th class="r">Total TTC</th>
              <th>Affectation</th>
              <th class="r"></th>
            </tr></thead>
            <tbody>
              ${[...byCat.entries()].map(([catId, rows]) => {
                const c = Repo.categories.get(catId);
                return `<tr class="grp"><td colspan="11">
                  <span class="cat-dot" style="background:${esc(c ? c.color : "#ccc")}"></span>
                  ${esc(c ? c.name : "Hors catégorie")} · ${rows.length} poste${rows.length > 1 ? "s" : ""}
                  · ${eur(Core.sum(rows, r => r.t.totalHT))} HT</td></tr>`
                  + rows.map(r => lineRow(p, r)).join("");
              }).join("")}
            </tbody>
          </table>
        </div>
      </div>
      ${Frag.totalBar(t, "Récapitulatif — " + s.name,
        `<button class="btn btn-sm btn-ghost" data-act="wReset">${icon("refresh", 14)} Réinitialiser les quantités</button>`)}
      ${Frag.rangeLine(t)}
      ${byBuildingCard(t)}
      ` : Frag.empty("Aucun poste dans ce scénario",
        "Ajoutez des postes depuis le catalogue de prix, puis saisissez les quantités.",
        `<button class="btn btn-primary" data-act="wAdd">${icon("plus", 15)} Ajouter des postes</button>`)}`;
  }

  function lineRow(p, r) {
    const l = r.line, t = r.t;
    const bnames = (l.buildingIds || []).map(id => (p.buildings.find(b => b.id === id) || {}).name).filter(Boolean);
    const coefTip = l.coefficientIds.length || l.manualCoef !== 1
      ? `title="Prix catalogue ${eur2(t.basePrice)} × ${num(t.coef, 3)} = ${eur2(t.priceAfterCoef)}${t.discount ? " puis −" + num(t.discount, 1) + " %" : ""}"` : "";
    return `<tr id="lr-${l.id}">
      <td>
        <div class="strong">${esc(l.label)}</div>
        ${l.comment ? `<div class="xsmall muted-3">${esc(l.comment)}</div>` : ""}
        ${l.quantityOrigin !== "saisie" ? `<span class="tag ${l.quantityOrigin === "calcul" ? "accent" : "ember"}" title="${esc(l.quantityFormula || "")}">métré ${esc(l.quantityOrigin)}</span>` : ""}
      </td>
      <td class="muted small">${esc(l.unit)}</td>
      <td class="num r muted">${eur2(l.catalogPriceHT || l.priceHT)}</td>
      <td class="c"><button class="btn btn-sm btn-ghost mono" data-act="wCoef" data-id="${l.id}" ${coefTip}>
        ×${num(t.coef, 3)}${t.discount ? " −" + num(t.discount, 0) + "%" : ""}</button></td>
      <td class="num r strong" id="lu-${l.id}">${eur2(t.unitPriceHT)}</td>
      <td class="c">
        <span class="row" style="gap:2px;flex-wrap:nowrap;justify-content:center">
          <input class="inp num" style="width:84px" data-inp="wQty" data-id="${l.id}" type="number" step="any" min="0"
            value="${l.quantity || ""}" placeholder="0" aria-label="Quantité pour ${esc(l.label)}">
          <button class="btn btn-ghost btn-icon" data-act="wMetre" data-id="${l.id}" title="Métré : calcul ou reprise d'un métré bâtiment">${icon("calculator", 14)}</button>
        </span>
      </td>
      <td class="num r muted">${num(l.vatRate, 1)} %</td>
      <td class="num r" id="lh-${l.id}">${eur(t.totalHT)}</td>
      <td class="num r strong" id="lt-${l.id}">${eur(t.totalTTC)}</td>
      <td class="small">${bnames.length ? bnames.map(n => `<span class="tag">${esc(n)}</span>`).join(" ") : `<span class="tag accent">Copropriété</span>`}</td>
      <td class="r nowrap">
        <button class="btn btn-ghost btn-icon" data-act="wEdit" data-id="${l.id}" title="Modifier la ligne">${icon("edit", 14)}</button>
        <button class="btn btn-ghost btn-icon" data-act="wDel" data-id="${l.id}" title="Retirer">${icon("trash", 14)}</button>
      </td>
    </tr>`;
  }

  function byBuildingCard(t) {
    if (!t.byBuilding.length) return "";
    return `<div class="card">
      <div class="card-head"><h3>Ventilation par bâtiment</h3>
        <span class="spacer small muted-3">Travaux affectés + quote-part des postes communs et frais annexes</span></div>
      <div class="table-wrap"><table class="tbl">
        <thead><tr><th>Bâtiment</th><th class="r">Clé de répartition</th><th class="r">Total HT</th><th class="r">Total TTC</th><th class="r">€ / logement</th></tr></thead>
        <tbody>${t.byBuilding.map(b => `<tr>
          <td class="strong">${esc(b.name)}</td>
          <td class="num r muted">${num(b.weight, 0)}</td>
          <td class="num r">${eur(b.ht)}</td>
          <td class="num r strong">${eur(b.ttc)}</td>
          <td class="num r">${b.perDwellingTTC ? eur(b.perDwellingTTC) : "—"}</td>
        </tr>`).join("")}</tbody>
      </table></div>
    </div>`;
  }

  /* =========================================================== FRAIS ANNEXES */
  function frais(p) {
    const s = activeScenario(p);
    if (!s) return Frag.empty("Aucun scénario", "Créez d'abord un scénario.");
    const t = Calc.scenarioTotals(s, p, refs());
    return `
      <div class="card"><div class="card-body"><div class="row between">
        ${scenarioPicker(p, s)}
        <div class="btn-group">
          <button class="btn" data-act="fFromTemplate">${icon("copy", 15)} Depuis les modèles</button>
          <button class="btn btn-primary" data-act="fNew">${icon("plus", 15)} Ajouter un frais</button>
        </div>
      </div></div></div>

      ${t.fees.length ? `<div class="card"><div class="table-wrap"><table class="tbl">
        <thead><tr><th>Poste de frais</th><th>Mode</th><th class="r">Valeur</th><th class="r">Base</th>
          <th class="r">Montant HT</th><th class="r">TVA</th><th class="r">Montant TTC</th><th class="r"></th></tr></thead>
        <tbody>
          ${t.fees.map(f => `<tr>
            <td class="strong">${esc(f.fee.label)}${f.fee.comment ? `<div class="xsmall muted-3">${esc(f.fee.comment)}</div>` : ""}</td>
            <td><span class="tag">${esc(modeLabel(f.fee.mode))}</span></td>
            <td class="num r">${f.fee.mode === "pct" ? num(f.fee.value, 2) + " %" : eur2(f.fee.value)}</td>
            <td class="num r muted small">${basisLabel(f.fee, p, t)}</td>
            <td class="num r strong">${eur(f.ht)}</td>
            <td class="num r muted">${num(f.fee.vatRate, 1)} %</td>
            <td class="num r">${eur(f.ttc)}</td>
            <td class="r nowrap">
              <button class="btn btn-ghost btn-icon" data-act="fEdit" data-id="${f.fee.id}">${icon("edit", 14)}</button>
              <button class="btn btn-ghost btn-icon" data-act="fDel" data-id="${f.fee.id}">${icon("trash", 14)}</button>
            </td></tr>`).join("")}
          <tr class="grp"><td colspan="4">Total frais annexes</td>
            <td class="num r">${eur(t.feesHT)}</td><td></td><td class="num r">${eur(t.feesTTC)}</td><td></td></tr>
        </tbody>
      </table></div></div>` : Frag.empty("Aucun frais annexe",
        "Installation de chantier, échafaudage, MOE, SPS, contrôle technique, aléas…",
        `<button class="btn btn-primary" data-act="fFromTemplate">${icon("copy", 15)} Partir des modèles</button>`)}

      ${Frag.totalBar(t, "Récapitulatif — " + s.name)}`;
  }

  const modeLabel = m => ({ forfait: "Forfait", m2: "€ / m²", logement: "€ / logement", pct: "% des travaux" }[m] || m);
  function basisLabel(f, p, t) {
    if (f.mode === "forfait") return "—";
    if (f.mode === "pct") return eur(t.worksHT) + " HT";
    if (f.mode === "logement") return (t.dwellings || 0) + " logements";
    const metric = (Seed.BUILDING_METRICS.find(b => b.key === f.basis) || { label: f.basis });
    return num(Calc.feeAreaBasis(p, f.basis), 0) + " m² (" + esc(metric.label) + ")";
  }

  /* ==================================================== AIDES / RESTE À CHARGE */
  function aides(p) {
    const s = activeScenario(p);
    if (!s) return Frag.empty("Aucun scénario", "Créez d'abord un scénario.");
    const t = Calc.scenarioTotals(s, p, refs());
    const unverified = t.aids.filter(a => !a.aid.verified).length;
    return `
      <div class="card"><div class="card-body"><div class="row between">
        ${scenarioPicker(p, s)}
        <div class="btn-group">
          <button class="btn" data-act="aFromRule">${icon("copy", 15)} Depuis les dispositifs</button>
          <button class="btn btn-primary" data-act="aNew">${icon("plus", 15)} Ajouter une aide</button>
        </div>
      </div></div></div>

      <div class="notice warn">${icon("alert", 15)}<div>
        Les montants et conditions des dispositifs (MaPrimeRénov', CEE, éco-PTZ, aides locales) ne sont
        pas pré-remplis par l'application : ils évoluent et doivent être vérifiés au cas par cas.
        Renseignez-les dans <strong>Paramètres → Dispositifs d'aide</strong>, puis marquez-les « vérifié »
        une fois contrôlés.${unverified ? ` <strong>${unverified} aide(s) de ce scénario ne sont pas marquées vérifiées.</strong>` : ""}
      </div></div>

      ${t.aids.length ? `<div class="card"><div class="table-wrap"><table class="tbl">
        <thead><tr><th>Aide</th><th>Mode</th><th class="r">Valeur</th><th class="r">Plafond</th>
          <th class="r">Montant</th><th>Statut</th><th class="r"></th></tr></thead>
        <tbody>
          ${t.aids.map(a => `<tr>
            <td class="strong">${esc(a.aid.label)}${a.aid.comment ? `<div class="xsmall muted-3">${esc(a.aid.comment)}</div>` : ""}</td>
            <td><span class="tag">${esc(aidModeLabel(a.aid.mode))}</span></td>
            <td class="num r">${a.aid.mode === "pct" ? num(a.aid.value, 2) + " % " + (a.aid.basis === "ttc" ? "TTC" : "HT") : eur2(a.aid.value)}</td>
            <td class="num r muted">${a.aid.cap ? eur(a.aid.cap) : "—"}</td>
            <td class="num r strong" style="color:var(--c-ok)">${eur(a.amount)}</td>
            <td>${a.aid.verified ? `<span class="tag ok">Vérifié</span>` : `<span class="tag warn">À vérifier</span>`}</td>
            <td class="r nowrap">
              <button class="btn btn-ghost btn-icon" data-act="aEdit" data-id="${a.aid.id}">${icon("edit", 14)}</button>
              <button class="btn btn-ghost btn-icon" data-act="aDel" data-id="${a.aid.id}">${icon("trash", 14)}</button>
            </td></tr>`).join("")}
        </tbody>
      </table></div></div>` : Frag.empty("Aucune aide renseignée", "Ajoutez les dispositifs mobilisables pour ce scénario.")}

      ${t.aidsCapped ? `<div class="notice warn">${icon("alert", 15)}<div>Le total des aides dépasse le montant TTC des travaux : il a été plafonné à ${eur(t.totalTTC)}.</div></div>` : ""}

      <div class="stat-grid">
        ${Frag.stat("Montant TTC", eur(t.totalTTC), esc(s.name))}
        ${Frag.stat("Total des aides", "− " + eur(t.aidsTotal), t.totalTTC ? num(t.aidsTotal / t.totalTTC * 100, 1) + " % du TTC" : "", "")}
        ${Frag.stat("Reste à charge", eur(t.remainder), "après aides", "ember")}
        ${Frag.stat("Reste à charge / logement", t.perDwellingRemainder ? eur(t.perDwellingRemainder) : "—", (t.dwellings || 0) + " logements")}
        ${Frag.stat("Par tantième", p.totalTantiemes ? eur2(Calc.perTantieme(t.remainder, p)) : "—", p.totalTantiemes ? num(p.totalTantiemes, 0) + " tantièmes" : "Tantièmes non renseignés")}
      </div>

      ${p.buildings && p.buildings.length ? `<div class="card">
        <div class="card-head"><h3>Reste à charge par bâtiment</h3></div>
        <div class="table-wrap"><table class="tbl">
          <thead><tr><th>Bâtiment</th><th class="r">Logements</th><th class="r">Total TTC</th><th class="r">Quote-part d'aides</th><th class="r">Reste à charge</th><th class="r">€ / logement</th></tr></thead>
          <tbody>${t.byBuilding.map(b => {
            const share = t.totalTTC ? b.ttc / t.totalTTC : 0;
            const aidShare = t.aidsTotal * share;
            const rest = b.ttc - aidShare;
            return `<tr><td class="strong">${esc(b.name)}</td>
              <td class="num r">${b.nbDwellings || "—"}</td>
              <td class="num r">${eur(b.ttc)}</td>
              <td class="num r" style="color:var(--c-ok)">− ${eur(aidShare)}</td>
              <td class="num r strong">${eur(rest)}</td>
              <td class="num r">${b.nbDwellings ? eur(rest / b.nbDwellings) : "—"}</td></tr>`;
          }).join("")}</tbody>
        </table></div>
      </div>` : ""}`;
  }

  const aidModeLabel = m => ({ forfait: "Forfait", pct: "% du montant", logement: "€ / logement", m2: "€ / m²", custom: "Règle libre" }[m] || m);

  /* ====================================================== ANALYSE ÉCONOMIQUE */
  function economie(p) {
    const s = activeScenario(p);
    if (!s) return Frag.empty("Aucun scénario", "Créez d'abord un scénario.");
    const t = Calc.scenarioTotals(s, p, refs());
    const e = t.eco;
    const eco = p.economics || {};
    return `
      <div class="card"><div class="card-body"><div class="row between">
        ${scenarioPicker(p, s)}
        <button class="btn" data-act="ecoEdit">${icon("edit", 15)} Hypothèses énergétiques</button>
      </div></div></div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3>Hypothèses</h3></div>
          <div class="card-body grid-2">
            <div><div class="lbl">Conso. avant travaux</div><div class="mono">${eco.consoBefore ? num(eco.consoBefore, 0) + " kWh/an" : "—"}</div></div>
            <div><div class="lbl">Économie visée (scénario)</div><div class="mono">${num(s.energySavingPct, 0)} %</div></div>
            <div><div class="lbl">Conso. après travaux</div><div class="mono">${e.consoAfter ? num(e.consoAfter, 0) + " kWh/an" : "—"}</div></div>
            <div><div class="lbl">Prix de l'énergie</div><div class="mono">${eco.energyPrice ? eur2(eco.energyPrice) + " / kWh" : "—"}</div></div>
            <div><div class="lbl">OPEX avant / après</div><div class="mono">${eur(eco.opexBefore)} → ${eur(eco.opexAfter)}</div></div>
            <div><div class="lbl">Horizon · actualisation · inflation énergie</div>
              <div class="mono">${num(e.horizon, 0)} ans · ${num(e.discountRate, 1)} % · ${num(e.energyInflation, 1)} %</div></div>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Résultats</h3></div>
          <div class="card-body grid-2">
            <div><div class="lbl">CAPEX (TTC)</div><div class="stat-v" style="font-size:17px">${eur(e.capex)}</div></div>
            <div><div class="lbl">CAPEX net (reste à charge)</div><div class="stat-v ember" style="font-size:17px">${eur(e.netCapex)}</div></div>
            <div><div class="lbl">Énergie économisée</div><div class="mono">${e.energySavedKwh ? num(e.energySavedKwh, 0) + " kWh/an" : "—"}</div></div>
            <div><div class="lbl">Économie annuelle</div><div class="mono strong">${e.annualSaving ? eur(e.annualSaving) + " / an" : "—"}</div></div>
            <div><div class="lbl">Temps de retour brut</div><div class="mono">${e.paybackGross ? num(e.paybackGross, 1) + " ans" : "—"}</div></div>
            <div><div class="lbl">Temps de retour net d'aides</div><div class="stat-v accent" style="font-size:17px">${e.payback ? num(e.payback, 1) + " ans" : "—"}</div></div>
            <div><div class="lbl">VAN (${num(e.horizon, 0)} ans)</div><div class="mono ${e.npv >= 0 ? "" : ""}" style="color:${e.npv >= 0 ? "var(--c-ok)" : "var(--c-danger)"}">${eur(e.npv)}</div></div>
            <div><div class="lbl">TRI</div><div class="mono">${e.irr === null ? "—" : num(e.irr, 1) + " %"}</div></div>
            <div><div class="lbl">Coût global (${num(e.horizon, 0)} ans)</div><div class="mono">${eur(e.globalCost)}</div></div>
          </div>
        </div>
      </div>

      ${!eco.consoBefore || !eco.energyPrice ? `<div class="notice">${icon("info", 15)}<div>
        Renseignez la consommation avant travaux et le prix de l'énergie (bouton « Hypothèses énergétiques »)
        pour obtenir les économies, le temps de retour, la VAN et le TRI.
        ${(p.dpes || []).length ? `<div style="margin-top:6px"><button class="btn btn-sm" data-act="dpeEco">${icon("gauge", 14)} Reprendre depuis les DPE du projet</button></div>` : ""}</div></div>` : ""}

      <div class="card">
        <div class="card-head"><h3>Comparaison des scénarios</h3>
          <button class="btn btn-sm spacer" data-act="go" data-route="compare">${icon("chart", 14)} Ouvrir le comparateur</button></div>
        <div class="table-wrap"><table class="tbl">
          <thead><tr><th>Scénario</th><th class="r">TTC</th><th class="r">Aides</th><th class="r">Reste à charge</th>
            <th class="r">Économie / an</th><th class="r">Retour</th><th class="r">VAN</th></tr></thead>
          <tbody>${Calc.compare(p, refs()).map(x => `<tr${x.scenarioId === s.id ? ' class="picked"' : ""}>
            <td class="strong">${esc(x.name)}</td>
            <td class="num r">${eur(x.totalTTC)}</td>
            <td class="num r">${x.aidsTotal ? "− " + eur(x.aidsTotal) : "—"}</td>
            <td class="num r strong">${eur(x.remainder)}</td>
            <td class="num r">${x.eco.annualSaving ? eur(x.eco.annualSaving) : "—"}</td>
            <td class="num r">${x.eco.payback ? num(x.eco.payback, 1) + " ans" : "—"}</td>
            <td class="num r">${x.eco.annualSaving ? eur(x.eco.npv) : "—"}</td>
          </tr>`).join("")}</tbody>
        </table></div>
      </div>`;
  }

  /** Glisser-déposer des DPE quand l'onglet Diagnostic est affiché. */
  function mount(page) { if (tab() === "dpe") Views.Dpe.bindDrops(page); }

  return { render, actions, mount, TABS, activeScenario, refs, P, lineRow, buildingCard };
})();


/* ===== 13-project-actions.js ========================================= */
/* =========================================================================
 * 13 — ACTIONS DE L'ÉCRAN PROJET : bâtiments, métrés, scénarios, lignes de
 * travaux, coefficients, frais annexes, aides, hypothèses économiques.
 * ========================================================================= */
(() => {
  "use strict";
  const { esc, eur, eur2, num } = Core;
  const icon = UI.icon;
  const V = Views.Project;

  const P = () => App.currentProject();
  const S = () => { const p = P(); return p ? V.activeScenario(p) : null; };
  const save = async () => { Repo.touch("projects"); await Repo.flush(); };

  /* ============================================================= Bâtiments */
  function buildingDialog(b) {
    const p = P();
    const isNew = !b;
    const bd = b || Schema.building({ name: "Bâtiment " + String.fromCharCode(65 + (p.buildings || []).length) });
    const m = UI.modal({
      title: isNew ? "Nouveau bâtiment" : "Modifier le bâtiment", sub: p.name,
      body: `
        ${UI.field("Nom du bâtiment *", UI.textInput("name", bd.name))}
        <div class="grid-3">
          ${UI.field("Logements", UI.numInput("nbDwellings", bd.nbDwellings || "", 'min="0"'))}
          ${UI.field("Niveaux", UI.numInput("nbLevels", bd.nbLevels || "", 'min="0"'))}
          ${UI.field("Tantièmes", UI.numInput("tantiemes", bd.tantiemes || "", 'min="0"'), "Clé de répartition des parties communes")}
        </div>
        ${UI.field("Commentaire", UI.textArea("comment", bd.comment, 'rows="2"'))}`,
      footer: `<button class="btn" data-modal-close>Annuler</button>
               <button class="btn btn-primary" data-save>${icon("check", 15)} Enregistrer</button>`,
    });
    m.el.querySelector("[data-save]").addEventListener("click", async () => {
      const f = UI.readForm(m.el);
      if (!f.name.trim()) return UI.toast("Le nom du bâtiment est obligatoire.", "warn");
      Object.assign(bd, {
        name: f.name.trim(), nbDwellings: Core.parseNum(f.nbDwellings), nbLevels: Core.parseNum(f.nbLevels),
        tantiemes: Core.parseNum(f.tantiemes), comment: f.comment.trim(),
      });
      if (isNew) p.buildings.push(bd);
      await save();
      m.close();
      UI.toast(isNew ? "Bâtiment ajouté." : "Bâtiment modifié.", "ok");
      App.render();
    });
  }

  /** Saisie d'un métré : directe, calculée ou importée (§11). */
  function metricDialog(building, key, label, unit) {
    const p = P();
    const isCustom = key.startsWith("custom:");
    const idx = isCustom ? parseInt(key.split(":")[1], 10) : -1;
    const cur = isCustom ? (building.customMetrics[idx] || {}).measure : (building.metrics || {})[key];
    const val = cur ? cur.value : "";
    const body = `
      <div class="tabs" id="mtabs">
        <button class="tab active" data-mtab="saisie">${icon("edit", 14)} Saisie directe</button>
        <button class="tab" data-mtab="calcul">${icon("calculator", 14)} Calcul</button>
        <button class="tab" data-mtab="import">${icon("upload", 14)} Reprise / import</button>
      </div>
      <div data-pane="saisie">
        ${UI.field(label + " (" + unit + ")", UI.numInput("value", val, 'min="0" autofocus'))}
      </div>
      <div data-pane="calcul" hidden>
        ${UI.field("Formule", UI.textInput("formula", cur && cur.formula ? cur.formula : "", 'placeholder="ex. 100 * 12 * 0,85"'),
          "Opérateurs autorisés : + − × ÷ et parenthèses.")}
        <div class="notice" id="fres">${icon("calculator", 15)}<div>Résultat : <strong class="mono" id="fval">—</strong></div></div>
      </div>
      <div data-pane="import" hidden>
        <p class="small muted">Reprendre une valeur déjà saisie ailleurs dans le projet :</p>
        <div class="chip-row">
          ${(p.buildings || []).flatMap(b => Seed.BUILDING_METRICS
            .filter(d => (b.metrics || {})[d.key] && Core.parseNum(b.metrics[d.key].value) > 0)
            .map(d => `<button class="chip" data-pick="${Core.parseNum(b.metrics[d.key].value)}">
              ${esc(b.name)} · ${esc(d.label)} : ${num(Core.parseNum(b.metrics[d.key].value), 2)} ${esc(d.unit)}</button>`)).join("")
            || `<span class="hint">Aucun métré disponible ailleurs. Utilisez « Importer des métrés » pour charger un fichier Excel.</span>`}
        </div>
      </div>`;
    const m = UI.modal({
      title: "Métré — " + label, sub: building.name, body,
      footer: `<button class="btn" data-modal-close>Annuler</button>
               <button class="btn btn-primary" data-save>${icon("check", 15)} Enregistrer le métré</button>`,
    });
    let mode = "saisie";
    m.el.querySelectorAll("[data-mtab]").forEach(btn => btn.addEventListener("click", () => {
      mode = btn.dataset.mtab;
      m.el.querySelectorAll("[data-mtab]").forEach(b => b.classList.toggle("active", b === btn));
      m.el.querySelectorAll("[data-pane]").forEach(pane => { pane.hidden = pane.dataset.pane !== mode; });
    }));
    const fInput = m.el.querySelector('[name="formula"]');
    fInput.addEventListener("input", () => {
      const r = Core.evalFormula(fInput.value);
      m.el.querySelector("#fval").textContent = r.ok ? num(r.value, 2) + " " + unit : r.error;
    });
    m.el.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => {
      m.el.querySelector('[name="value"]').value = b.dataset.pick;
      mode = "import";
      m.el.querySelector("[data-save]").click();
    }));

    m.el.querySelector("[data-save]").addEventListener("click", async () => {
      let value = 0, formula = "", origin = mode;
      if (mode === "calcul") {
        const r = Core.evalFormula(m.el.querySelector('[name="formula"]').value);
        if (!r.ok) return UI.toast(r.error, "warn");
        value = Core.round(r.value, 2); formula = m.el.querySelector('[name="formula"]').value;
      } else {
        value = Core.parseNum(m.el.querySelector('[name="value"]').value);
        if (mode === "import") origin = "import";
      }
      const mea = Schema.measurement({ value, origin, formula, by: Auth.name() });
      if (isCustom) building.customMetrics[idx].measure = mea;
      else { building.metrics = building.metrics || {}; building.metrics[key] = mea; }
      await save();
      m.close();
      UI.toast("Métré enregistré : " + num(value, 2) + " " + unit, "ok");
      App.render();
    });
  }

  /* ================================================= Sélecteur de postes (§10) */
  function addLinesDialog() {
    const p = P(), s = S();
    const picked = new Map();
    const cats = Repo.categories.list(c => c.active !== false).sort((a, b) => a.order - b.order);
    let q = "", catId = "all";

    const listHtml = () => {
      let rows = Repo.items.list(i => i.active !== false);
      if (catId !== "all") rows = rows.filter(i => i.categoryId === catId);
      if (q) rows = rows.filter(i => Core.matches([i.label, i.subCategory, i.source].join(" "), q));
      rows.sort((a, b) => Core.cmp(a.label, b.label));
      if (!rows.length) return `<tr><td colspan="6" class="empty">Aucun poste. Ajustez la recherche ou créez le poste dans le catalogue.</td></tr>`;
      return rows.map(i => {
        const already = (s.lines || []).some(l => l.catalogItemId === i.id);
        const c = Repo.categories.get(i.categoryId);
        return `<tr class="${picked.has(i.id) ? "picked" : ""}">
          <td><label class="row small" style="gap:7px;cursor:pointer">
            <input type="checkbox" data-pick-item="${i.id}"${picked.has(i.id) ? " checked" : ""}>
            <span><span class="strong">${esc(i.label)}</span>
              ${already ? `<span class="tag warn">déjà présent</span>` : ""}
              <br><span class="xsmall muted-3">${esc(c ? c.name : "")}${i.subCategory ? " · " + esc(i.subCategory) : ""}</span></span>
          </label></td>
          <td class="muted small">${esc(i.unit)}</td>
          <td class="num r">${eur2(i.priceHT)}</td>
          <td class="num r muted">${num(i.vatRate, 1)} %</td>
          <td class="c"><input class="inp num" style="width:88px" type="number" step="any" min="0"
              data-qty-item="${i.id}" value="${picked.get(i.id) || ""}" placeholder="0"></td>
          <td class="num r" data-tot-item="${i.id}">${picked.get(i.id) ? eur(picked.get(i.id) * i.priceHT) : "—"}</td>
        </tr>`;
      }).join("");
    };

    const body = `
      <div class="row">
        <div class="search" style="max-width:none">${icon("search", 15)}
          <input class="inp" id="pick-q" placeholder="Rechercher un poste du catalogue…" autocomplete="off"></div>
        <button class="btn" data-newitem>${icon("plus", 15)} Créer un poste</button>
      </div>
      <div class="chip-row" id="pick-cats">
        <button class="chip active" data-pick-cat="all">Toutes</button>
        ${cats.map(c => `<button class="chip" data-pick-cat="${c.id}">
          <span class="cat-dot" style="background:${esc(c.color)}"></span> ${esc(c.name)}</button>`).join("")}
      </div>
      <div class="table-wrap" style="max-height:46vh;overflow-y:auto;border:1px solid var(--c-line)">
        <table class="tbl"><thead><tr>
          <th>Poste</th><th>Unité</th><th class="r">Prix HT</th><th class="r">TVA</th><th class="c">Quantité</th><th class="r">Total HT</th>
        </tr></thead><tbody id="pick-body">${listHtml()}</tbody></table>
      </div>
      <div class="row between">
        <span class="small muted" id="pick-count">0 poste sélectionné</span>
        <span class="mono strong" id="pick-total">—</span>
      </div>`;

    const m = UI.modal({
      title: "Ajouter des postes au scénario", sub: s.name, body, size: "wide",
      footer: `<button class="btn" data-modal-close>Annuler</button>
               <button class="btn btn-primary" data-save>${icon("check", 15)} Ajouter au scénario</button>`,
    });

    const refresh = () => {
      m.el.querySelector("#pick-body").innerHTML = listHtml();
      let n = 0, tot = 0;
      picked.forEach((qty, id) => { const it = Repo.items.get(id); if (it) { n++; tot += qty * it.priceHT; } });
      m.el.querySelector("#pick-count").textContent = n + " poste" + (n > 1 ? "s" : "") + " sélectionné" + (n > 1 ? "s" : "");
      m.el.querySelector("#pick-total").textContent = tot ? eur(tot) + " HT" : "—";
    };
    m.el.querySelector("#pick-q").addEventListener("input", Core.debounce(e => { q = e.target.value; refresh(); }, 140));
    m.el.querySelector("#pick-cats").addEventListener("click", e => {
      const b = e.target.closest("[data-pick-cat]"); if (!b) return;
      catId = b.dataset.pickCat;
      m.el.querySelectorAll("[data-pick-cat]").forEach(x => x.classList.toggle("active", x === b));
      refresh();
    });
    m.el.addEventListener("change", e => {
      const cb = e.target.closest("[data-pick-item]");
      if (cb) { if (cb.checked) picked.set(cb.dataset.pickItem, picked.get(cb.dataset.pickItem) || 0); else picked.delete(cb.dataset.pickItem); refresh(); }
    });
    m.el.addEventListener("input", e => {
      const qi = e.target.closest("[data-qty-item]");
      if (!qi) return;
      const id = qi.dataset.qtyItem, v = Core.parseNum(qi.value);
      if (v > 0) picked.set(id, v); else if (picked.has(id)) picked.set(id, 0);
      const it = Repo.items.get(id);
      const cell = m.el.querySelector(`[data-tot-item="${id}"]`);
      if (cell && it) cell.textContent = v > 0 ? eur(v * it.priceHT) : "—";
      const cb = m.el.querySelector(`[data-pick-item="${id}"]`);
      if (cb && v > 0 && !cb.checked) cb.checked = true;
      let n = 0, tot = 0;
      picked.forEach((qty, pid) => { const x = Repo.items.get(pid); if (x) { n++; tot += qty * x.priceHT; } });
      m.el.querySelector("#pick-count").textContent = n + " poste" + (n > 1 ? "s" : "") + " sélectionné" + (n > 1 ? "s" : "");
      m.el.querySelector("#pick-total").textContent = tot ? eur(tot) + " HT" : "—";
    });
    m.el.querySelector("[data-newitem]").addEventListener("click", () => { m.close(); Views.Catalog.editDialog(null); });

    m.el.querySelector("[data-save]").addEventListener("click", async () => {
      if (!picked.size) return UI.toast("Sélectionnez au moins un poste.", "warn");
      picked.forEach((qty, id) => {
        const it = Repo.items.get(id);
        if (!it) return;
        s.lines.push(Schema.line({
          catalogItemId: it.id, label: it.label, categoryId: it.categoryId, unit: it.unit,
          priceHT: it.priceHT, catalogPriceHT: it.priceHT, vatRate: it.vatRate, quantity: qty,
        }));
      });
      await save();
      m.close();
      UI.toast(picked.size + " poste(s) ajouté(s) au scénario.", "ok");
      App.render();
    });
    void p;
  }

  /* ------------------------------------------------- Recalcul en place (perf) */
  function recalcWorks() {
    const p = P(), s = S();
    if (!p || !s) return;
    const t = Calc.scenarioTotals(s, p, V.refs());
    t.lines.forEach(({ line, t: lt }) => {
      const u = document.getElementById("lu-" + line.id);
      const h = document.getElementById("lh-" + line.id);
      const c = document.getElementById("lt-" + line.id);
      if (u) u.textContent = eur2(lt.unitPriceHT);
      if (h) h.textContent = eur(lt.totalHT);
      if (c) c.textContent = eur(lt.totalTTC);
    });
    const bar = document.querySelector(".totalbar-body");
    if (bar) {
      const cells = bar.querySelectorAll(".totalbar-cell .stat-v");
      const vals = [String(t.nbLines), eur(t.worksHT), eur(t.feesHT), eur(t.totalHT), eur(t.totalVAT), eur(t.totalTTC)];
      cells.forEach((el, i) => { if (vals[i] !== undefined) el.textContent = vals[i]; });
    }
  }

      .filter(d => (b.metrics || {})[d.key] && Core.parseNum(b.metrics[d.key].value) > 0)
      .map(d => ({ v: Core.parseNum(b.metrics[d.key].value), label: b.name + " · " + d.label, unit: d.unit })));

      title: "Métré de la ligne", sub: l.label,

          <div class="chip-row" style="margin-top:6px">
            ${opts.length ? opts.map(o => `<button class="chip" data-pick="${o.v}">${esc(o.label)} : ${num(o.v, 2)} ${esc(o.unit)}</button>`).join("")
              : `<span class="hint">Aucun métré saisi. Onglet « Bâtiments & métrés ».</span>`}
          </div>
        </div>`,

    };

    m.el.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", async () => {

/* ===== 13b-view-dpe.js =============================================== */
/* =========================================================================
 * 13b — ÉCRAN DPE : import, consultation (6 onglets), synthèse multi-DPE,
 * et passerelles vers le chiffrage :
 *   · fiche projet pré-remplie   · métrés bâtiment générés
 *   · préconisations → scénario  · hypothèses énergétiques
 * Le même panneau sert à l'espace « Analyse DPE » (DPE non rattachés) et à
 * l'onglet « Diagnostic DPE » d'un projet.
 * ========================================================================= */
Views.Dpe = (() => {
  "use strict";
  const { esc, num, eur, eur2 } = Core;
  const icon = UI.icon;
  const N = Dpe.numOf;

  const SUBS = [
    ["gen", "Général"], ["env", "Enveloppe"], ["vmc", "Ventilation"],
    ["ch", "Chauffage & ECS"], ["dep", "Déperditions"], ["bilan", "Bilan"],
  ];
  const METRIC_KEYS = [
    ["livingArea", "Surface habitable", "m²", "Somme des surfaces habitables des DPE"],
    ["facadeArea", "Surface de façade", "m²", "Murs donnant sur l'extérieur (surface opaque)"],
    ["roofArea", "Surface de toiture", "m²", "Planchers hauts déperditifs"],
    ["lowFloorArea", "Surface de plancher bas", "m²", "Planchers bas déperditifs hors terre-plein"],
    ["glazingArea", "Surface de vitrages", "m²", "Surface totale des baies"],
    ["nbBaies", "Nombre de menuiseries", "unité", "Nombre de baies (métré personnalisé)"],
  ];
  const BAIES_LABEL = "Nombre de menuiseries (DPE)";

  /* ------------------------------------------------------------ État d'écran */
  const ui = {};
  const st = scope => (ui[scope] = ui[scope] || { sel: null, sub: "gen" });

  function listFor(scope) {
    const db = Repo.state();
    if (scope === "inbox") { if (!Array.isArray(db.dpeInbox)) db.dpeInbox = []; return db.dpeInbox; }
    const p = Repo.projects.get(scope);
    if (!p) return [];
    if (!Array.isArray(p.dpes)) p.dpes = [];
    return p.dpes;
  }
  const projectOf = scope => (scope === "inbox" ? null : Repo.projects.get(scope));
  const findRec = (scope, id) => listFor(scope).find(r => r.id === id) || null;
  async function persist(scope) {
    const p = projectOf(scope);
    if (p) p.updatedAt = Core.nowIso();
    Repo.touch(scope === "inbox" ? "dpeInbox" : "projects");
    await Repo.flush();
  }

  /* ------------------------------------------------------------ Fragments */
  function badge(cls, kind = "ep", size = "") {
    if (!cls) return `<span class="dpe-badge none ${size}" title="Classe non déterminée">—</span>`;
    const [bg, fg] = (kind === "ges" ? Dpe.GES_COLORS : Dpe.COLORS)[cls];
    return `<span class="dpe-badge ${size}" style="background:${bg};color:${fg}" title="Classe ${kind === "ges" ? "climat (GES)" : "énergie"} ${cls}">${cls}</span>`;
  }

  /** Valeur formatée : texte échappé, ou nombre fr-FR si `dec` est fourni. */
  function V(v, unit = "", dec = null) {
    if (v === null || v === undefined || v === "") return `<span class="muted-3">—</span>`;
    const n = N(v);
    const t = dec !== null && n !== null ? num(n, dec) : esc(String(v));
    return t + (unit ? ` <span class="xsmall muted-3">${esc(unit)}</span>` : "");
  }
  const P100 = (v, dec = 0) => (N(v) === null ? null : N(v) * 100);
  const yesNo = v => (v === null || v === undefined || v === "" ? null : (Number(v) === 1 || v === true || /^(oui|vrai|true)$/i.test(String(v)) ? "Oui" : "Non"));

  function kvCard(title, rows) {
    return `<div class="card"><div class="card-head"><h3>${esc(title)}</h3></div>
      <table class="tbl dpe-kv"><tbody>${rows.map(([l, v]) =>
        `<tr><td class="muted small">${esc(l)}</td><td class="strong small">${v}</td></tr>`).join("")}</tbody></table></div>`;
  }

  function elTable(title, rows, cols, extra = "") {
    return `<div class="card">
      <div class="card-head"><h3>${esc(title)}</h3><span class="tag spacer">${rows.length}</span>${extra}</div>
      ${rows.length ? `<div class="table-wrap"><table class="tbl">
        <thead><tr><th>#</th>${cols.map(c => `<th class="${c[2] || ""}">${esc(c[0])}</th>`).join("")}</tr></thead>
        <tbody>${rows.map((r, i) => `<tr><td class="muted-3 mono xsmall">${i + 1}</td>${cols.map(c =>
          `<td class="${c[2] || "small"}">${c[1](r)}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>` : `<p class="hint" style="padding:12px 14px">Aucun élément dans le fichier.</p>`}
    </div>`;
  }

  function bars(rows, total, unitFn) {
    return rows.map(r => {
      const pct = total > 0 ? r.value / total * 100 : 0;
      return `<div class="dpe-barrow">
        <div class="row between xsmall"><span>${esc(r.label)}</span><span class="mono muted">${unitFn(r, pct)}</span></div>
        <div class="bar"><span style="width:${Math.min(pct, 100).toFixed(1)}%;background:${r.color}"></span></div>
      </div>`;
    }).join("");
  }

  /** Étiquette énergie façon DPE, classe active mise en avant. */
  function energyLabel(sm) {
    const ranges = ["≤ 70", "71 à 110", "111 à 180", "181 à 250", "251 à 330", "331 à 420", "> 420"];
    return `<div class="dpe-label" role="img" aria-label="Étiquette énergie : classe ${esc(sm.cls || "non déterminée")}">
      ${Dpe.LETTERS.map((L, i) => {
        const [bg, fg] = Dpe.COLORS[L];
        const on = sm.cls === L;
        return `<div class="dpe-step ${on ? "on" : ""}" style="--w:${34 + i * 9}%;background:${bg};color:${fg}">
          <span>${L}${on ? "" : ` <small>${ranges[i]}</small>`}</span>
          ${on ? `<em>${sm.epM2 !== null ? num(sm.epM2, 0) : "—"} kWh/m².an${sm.gesM2 !== null ? ` · ${num(sm.gesM2, 0)} kgCO₂/m².an` : ""}</em>` : ""}
        </div>`;
      }).join("")}
    </div>`;
  }

  /* =========================================================== Panneau */
  function panel(scope) {
    const list = listFor(scope);
    const s = st(scope);
    const p = projectOf(scope);
    if (s.sel !== "synth" && !list.some(r => r.id === s.sel)) s.sel = list.length ? list[0].id : null;
    if (s.sel === "synth" && !list.length) s.sel = null;
    const cur = list.find(r => r.id === s.sel);
    return `
    <div class="stack">
      ${bridgeBar(scope, p, list)}
      <div class="dpe-layout">
        <aside class="card dpe-side" aria-label="Fichiers DPE">
          <div class="card-head"><h3>Fichiers DPE</h3><span class="tag spacer">${list.length}</span></div>
          <div class="dpe-files">
            ${list.length ? list.map(r => fileItem(scope, r, s, p)).join("") : `<p class="hint" style="padding:10px 12px">Aucun DPE importé.</p>`}
          </div>
          <div class="dpe-drop" data-dpe-drop="${esc(scope)}" data-act="dpeImport" data-scope="${esc(scope)}" role="button" tabindex="0">
            <span>${icon("upload", 15)} Importer des DPE</span><span class="xsmall muted-3">.xlsx 3CL · glisser-déposer</span>
          </div>
          ${list.length ? `<button class="dpe-synth-btn ${s.sel === "synth" ? "active" : ""}" data-act="dpeSel" data-scope="${esc(scope)}" data-id="synth">
            ${icon("chart", 15)} Synthèse ${list.length > 1 ? "multi-DPE" : "DPE"}<span class="tag accent spacer">${list.length}</span></button>` : ""}
          <input type="file" id="dpe-file-${esc(scope)}" accept=".xlsx,.xls" multiple hidden data-chg="dpeFiles" data-scope="${esc(scope)}">
        </aside>
        <section class="dpe-main stack">
          ${!list.length ? emptyDrop(scope, p) : s.sel === "synth" ? synthView(scope, list, p) : detail(scope, cur, p)}
        </section>
      </div>
    </div>`;
  }

  function fileItem(scope, r, s, p) {
    const sm = Dpe.summary(r.data);
    const b = p && r.buildingId ? (p.buildings || []).find(x => x.id === r.buildingId) : null;
    return `<button class="dpe-file ${s.sel === r.id ? "active" : ""}" data-act="dpeSel" data-scope="${esc(scope)}" data-id="${esc(r.id)}" title="${esc(r.fileName)}">
      ${badge(sm.cls, "ep", "sm")}
      <span class="dpe-file-txt">
        <span class="dpe-file-name">${esc(r.fileName.replace(/\.xlsx?$/i, ""))}</span>
        <span class="xsmall muted-3 dpe-file-sub">${esc([sm.city, sm.surface ? num(sm.surface, 0) + " m²" : "", b ? b.name : ""].filter(Boolean).join(" · ") || "—")}</span>
      </span>
    </button>`;
  }

  function emptyDrop(scope, p) {
    return `<div class="dpe-drop big" data-dpe-drop="${esc(scope)}" data-act="dpeImport" data-scope="${esc(scope)}" role="button" tabindex="0">
      <span class="dpe-drop-ic">${icon("upload", 22)}</span>
      <strong>Importer un ou plusieurs fichiers DPE</strong>
      <span class="small muted">Glisser-déposer ou cliquer pour sélectionner</span>
      <span class="tag" style="margin-top:6px">Format Excel DPE 3CL ADEME 2021 (.xlsx)</span>
      <span class="xsmall muted-3" style="margin-top:10px;max-width:460px">
        ${p ? "Les DPE importés ici alimentent la fiche projet, les métrés des bâtiments, les préconisations de travaux et les hypothèses énergétiques de ce chiffrage."
            : "Analyse rapide sans projet : consultez, comparez et éditez les rapports, puis créez un projet de chiffrage en un clic à partir des DPE importés."}
      </span>
    </div>`;
  }

  /** Barre de passerelle vers le chiffrage. */
  function bridgeBar(scope, p, list) {
    if (!list.length) return "";
    if (!p) {
      const others = Repo.projects.list(x => x.status !== "archivé").length;
      return `<div class="card"><div class="card-body row between">
        <div class="small muted" style="max-width:620px">${icon("info", 14)} Espace d'analyse : ces ${list.length} DPE ne sont rattachés à aucun projet.
          Transformez-les en dossier de chiffrage — la fiche, les métrés et les préconisations seront pré-remplis.</div>
        <div class="btn-group">
          ${others ? `<button class="btn" data-act="dpeAttach">${icon("link", 15)} Rattacher à un projet</button>` : ""}
          <button class="btn btn-primary" data-act="dpeToProject">${icon("plus", 15)} Créer un projet de chiffrage</button>
        </div>
      </div></div>`;
    }
    const m = Dpe.metrics(list);
    return `<div class="card dpe-bridge">
      <div class="card-head"><h3>Exploiter les DPE dans le chiffrage</h3>
        <span class="spacer xsmall muted-3">${list.length} DPE · ${num(m.livingArea, 0)} m² habitables · ${num(m.facadeArea, 0)} m² de façade · ${num(m.nbBaies, 0)} baies</span></div>
      <div class="card-body dpe-bridge-grid">
        <button class="dpe-bridge-btn" data-act="dpeFiche">${icon("file", 18)}<span><strong>Pré-remplir la fiche</strong><span class="xsmall muted-3">Adresse, année, surfaces, systèmes</span></span></button>
        <button class="dpe-bridge-btn" data-act="dpeMetrics">${icon("building", 18)}<span><strong>Générer les métrés</strong><span class="xsmall muted-3">Façades, toiture, planchers, vitrages</span></span></button>
        <button class="dpe-bridge-btn" data-act="dpeSuggest">${icon("wand", 18)}<span><strong>Préconisations → scénario</strong><span class="xsmall muted-3">Postes du catalogue et quantités</span></span></button>
        <button class="dpe-bridge-btn" data-act="dpeEco">${icon("flame", 18)}<span><strong>Hypothèses énergétiques</strong><span class="xsmall muted-3">Consommation et prix de l'énergie</span></span></button>
      </div>
    </div>`;
  }

  /* ============================================================ Détail */
  function detail(scope, r, p) {
    if (!r) return "";
    const s = st(scope);
    const d = r.data || {};
    const sm = Dpe.summary(d);
    const chips = [
      sm.year ? "Construit en " + sm.year : "",
      sm.surface ? num(sm.surface, 0) + " m²" : "",
      sm.zone ? "Zone " + sm.zone : "",
      sm.date ? "Visite le " + sm.date : "",
      sm.method ? String(sm.method) : "",
    ].filter(Boolean);
    const buildings = p ? (p.buildings || []) : [];
    const sub = SUBS.some(x => x[0] === s.sub) ? s.sub : "gen";
    const body = { gen: tabGen, env: tabEnv, vmc: tabVmc, ch: tabCh, dep: tabDep, bilan: tabBilan }[sub](d, sm);
    return `
      <div class="card"><div class="card-body dpe-head">
        <div class="dpe-head-cls">${badge(sm.cls, "ep", "lg")}${sm.gesCls ? badge(sm.gesCls, "ges", "md") : ""}</div>
        <div class="dpe-head-txt">
          <div class="strong">${esc(sm.address || r.fileName)}</div>
          <div class="xsmall muted-3" style="margin-top:2px">${esc(r.fileName)} · importé le ${Core.dateFR(r.importedAt)}${r.importedBy ? " par " + esc(r.importedBy) : ""}
            ${sm.clsSource ? ` · classe ${sm.clsSource === "fichier" ? "issue du fichier" : "recalculée (double seuil énergie / GES)"}` : ""}</div>
          ${chips.length ? `<div class="chip-row" style="margin-top:7px">${chips.map(c => `<span class="tag">${esc(c)}</span>`).join("")}</div>` : ""}
        </div>
        <div class="row" style="gap:6px">
          ${p ? `<select class="inp" style="width:auto;max-width:190px" data-chg="dpeBuilding" data-scope="${esc(scope)}" data-id="${esc(r.id)}" aria-label="Bâtiment rattaché">
              <option value="">Bâtiment : non rattaché</option>
              ${buildings.map(b => `<option value="${esc(b.id)}"${r.buildingId === b.id ? " selected" : ""}>${esc(b.name)}</option>`).join("")}
            </select>` : ""}
          <button class="btn" data-act="dpePdf" data-scope="${esc(scope)}" data-id="${esc(r.id)}">${icon("report", 15)} Rapport PDF</button>
          <button class="btn btn-ghost btn-icon" data-act="dpeDel" data-scope="${esc(scope)}" data-id="${esc(r.id)}" title="Retirer ce DPE" aria-label="Retirer ce DPE">${icon("trash", 15)}</button>
        </div>
      </div></div>
      <div class="tabs">
        ${SUBS.map(([k, l]) => `<button class="tab ${sub === k ? "active" : ""}" data-act="dpeSub" data-scope="${esc(scope)}" data-sub="${k}">${esc(l)}</button>`).join("")}
      </div>
      ${body}`;
  }

  function tabGen(d, sm) {
    return `<div class="grid-2">
      ${kvCard("Identification", [
        ["Adresse", V(sm.address)],
        ["Code postal / commune", V([sm.postcode, sm.city].filter(Boolean).join(" "))],
        ["Date de visite", V(sm.date)],
        ["N° DPE", V(sm.numero)],
        ["Logiciel", V(sm.software)],
        ["Méthode d'application", V(sm.method)],
      ])}
      ${kvCard("Caractéristiques générales", [
        ["Année de construction", V(sm.year)],
        ["Période de construction", V(sm.period)],
        ["Surface habitable", V(sm.surface, "m²", 2)],
        ["Hauteur sous plafond", V(sm.hsp, "m", 2)],
        ["Nombre de niveaux", V(sm.levels, "", 0)],
        ["Nombre de logements", V(sm.nbLog, "", 0)],
      ])}
      ${kvCard("Données météo et inertie", [
        ["Zone climatique", V(sm.zone)],
        ["Altitude", V(sm.altitude, "m")],
        ["Classe d'altitude", V(sm.altClass)],
        ["Classe d'inertie", V(sm.inertie)],
      ])}
      ${kvCard("Résultat", [
        ["Classe énergie", sm.cls ? badge(sm.cls, "ep", "sm") : V(null)],
        ["Classe climat (GES)", sm.gesCls ? badge(sm.gesCls, "ges", "sm") : V(null)],
        ["Énergie primaire", V(sm.epM2, "kWh EP/m².an", 0)],
        ["Émissions", V(sm.gesM2, "kgCO₂/m².an", 1)],
      ])}
    </div>`;
  }

  function tabEnv(d) {
    const m = Dpe.metrics([{ data: d }]);
    const murs = d.murs || [];
    const uMurs = Core.sum(murs, x => (N(x.umur) || 0) * (N(x.surface_paroi_opaque) || 0));
    const sMurs = Core.sum(murs, x => (N(x.umur) !== null ? N(x.surface_paroi_opaque) || 0 : 0));
    return `
      <div class="stat-grid">
        ${Frag.stat("Façades extérieures", num(m.facadeArea, 1) + " m²", sMurs ? "U moyen murs " + num(uMurs / sMurs, 2) + " W/m².K" : "")}
        ${Frag.stat("Toiture / plancher haut", num(m.roofArea, 1) + " m²", (d.phauts || []).length + " paroi(s)")}
        ${Frag.stat("Plancher bas", num(m.lowFloorArea, 1) + " m²", "hors terre-plein")}
        ${Frag.stat("Vitrages", num(m.glazingArea, 1) + " m²", num(m.nbBaies, 0) + " baie(s)")}
      </div>
      ${elTable("Murs", murs, [
        ["Orientation", x => V(x.orientation)], ["Adjacence", x => V(x.type_adjacence)],
        ["Matériaux", x => V(x.materiaux_structure_mur)], ["Isolation", x => V(x.type_isolation)],
        ["Surface m²", x => V(x.surface_paroi_opaque, "", 2), "num r"],
        ["U W/m².K", x => V(x.umur, "", 2), "num r"], ["U nu", x => V(x.umur0, "", 2), "num r"], ["b", x => V(x.b, "", 2), "num r"],
      ])}
      ${elTable("Planchers bas", d.pbas || [], [
        ["Adjacence", x => V(x.type_adjacence)], ["Type", x => V(x.type_plancher_bas)], ["Isolation", x => V(x.type_isolation)],
        ["Surface m²", x => V(x.surface_paroi_opaque, "", 2), "num r"],
        ["U final", x => V(x.upb_final !== undefined ? x.upb_final : x.upb, "", 3), "num r"], ["b", x => V(x.b, "", 2), "num r"],
      ])}
      ${elTable("Planchers hauts", d.phauts || [], [
        ["Adjacence", x => V(x.type_adjacence)], ["Type", x => V(x.type_plancher_haut)], ["Isolation", x => V(x.type_isolation)],
        ["Surface m²", x => V(x.surface_paroi_opaque, "", 2), "num r"],
        ["U", x => V(x.uph, "", 2), "num r"], ["b", x => V(x.b, "", 2), "num r"],
      ])}
      ${elTable("Baies vitrées", d.baies || [], [
        ["Réf.", x => V(x.reference)], ["Orientation", x => V(x.orientation)], ["Vitrage", x => V(x.type_vitrage)],
        ["Menuiserie", x => V(x.type_materiaux_menuiserie)], ["Fermeture", x => V(x.type_fermeture)],
        ["Surface m²", x => V(x.surface_totale_baie, "", 2), "num r"],
        ["Uw", x => V(x.uw, "", 2), "num r"], ["Sw", x => V(x.sw, "", 2), "num r"], ["Ujn", x => V(x.ujn, "", 2), "num r"],
      ])}
      ${elTable("Portes", d.portes || [], [
        ["Adjacence", x => V(x.type_adjacence)], ["Type", x => V(x.type_porte)],
        ["Surface m²", x => V(x.surface_porte, "", 2), "num r"], ["U", x => V(x.uporte, "", 2), "num r"],
      ])}
      ${elTable("Ponts thermiques", d.ponts || [], [
        ["Type de liaison", x => V(x.type_liaison)],
        ["Longueur m", x => V(x.l, "", 2), "num r"], ["k W/m.K", x => V(x.k, "", 3), "num r"],
      ])}`;
  }

  function tabVmc(d) {
    const v = d.vmc || {};
    return `<div class="grid-2">
      ${kvCard("Système de ventilation", [
        ["Type", V(v.type_ventilation)],
        ["Surface ventilée", V(v.surface_ventile, "m²", 2)],
        ["Q4Pa conventionnel", V(v.q4pa_conv, "m³/h.m²", 2)],
        ["Plusieurs façades exposées", V(yesNo(v.plusieurs_facade_exposee))],
        ["Installation postérieure à 2012", V(yesNo(v.ventilation_post_2012))],
      ])}
      ${kvCard("Résultats", [
        ["Puissance moyenne ventilateurs", V(v.pvent_moy, "W", 2)],
        ["Hperm", V(v.hperm, "W/K", 3)],
        ["Hvent", V(v.hvent, "W/K", 3)],
        ["Consommation auxiliaires", V(v.conso_auxiliaire_ventilation, "kWh/an", 1)],
      ])}
    </div>`;
  }

  function tabCh(d) {
    const g = d.genCH || {}, e = d.emetteur || {}, w = d.genECS || {}, i = d.installCH || {};
    return `<div class="grid-2">
      ${kvCard("Générateur de chauffage", [
        ["Type", V(g.type_generateur_ch)],
        ["Énergie", V(g.type_energie)],
        ["Puissance nominale", V(N(g.pn) !== null ? N(g.pn) / 1000 : null, "kW", 1)],
        ["Rendement Pn", V(P100(g.rpn), "%", 1)],
        ["Rendement de génération", V(P100(g.rendement_generation), "%", 0)],
        ["Température 100 % / 30 %", `${V(g.temp_fonc_100, "°C")} / ${V(g.temp_fonc_30, "°C")}`],
      ])}
      ${kvCard("Émission et distribution", [
        ["Type", V(e.type_emission_distribution)],
        ["Régulation", V(e.type_regulation)],
        ["Température de distribution", V(e.temp_distribution_ch)],
        ["Rendement d'émission", V(P100(e.rendement_emission), "%", 0)],
        ["Rendement de distribution", V(P100(e.rendement_distribution), "%", 0)],
        ["Période d'installation", V(e.periode_installation_emetteur)],
      ])}
      ${kvCard("Installation de chauffage", [
        ["Type d'installation", V(i.type_installation)],
        ["Surface chauffée", V(i.surface_chauffee, "m²", 1)],
        ["Besoin de chauffage", V(i.besoin_ch, "kWh/an", 0)],
        ["Consommation", V(i.conso_ch, "kWh/an", 0)],
      ])}
      ${kvCard("Eau chaude sanitaire", [
        ["Type de générateur", V(w.type_generateur_ecs)],
        ["Énergie", V(w.type_energie)],
        ["Stockage", V(w.type_stockage_ecs)],
        ["Volume de stockage", V(w.volume_stockage, "L", 0)],
        ["Rendement de génération", V(P100(w.rendement_generation), "%", 0)],
        ["Besoin ECS", V(w.besoin_ecs, "kWh/an", 0)],
      ])}
    </div>`;
  }

  function tabDep(d) {
    const s = d.sortie || {};
    const L = Dpe.losses([{ data: d }]);
    return `<div class="grid-2">
      <div class="card">
        <div class="card-head"><h3>Déperditions thermiques</h3></div>
        <table class="tbl dpe-kv"><tbody>
          ${L.rows.map(r => `<tr><td class="small"><span class="cat-dot" style="background:${r.color}"></span> ${esc(r.label)}</td>
            <td class="num r small">${r.value ? num(r.value, 1) + " W/K" : "—"}</td><td class="num r small muted">${r.value ? num(r.pct, 1) + " %" : ""}</td></tr>`).join("")}
          <tr class="grp"><td>Total des postes</td><td class="num r">${num(L.total, 1)} W/K</td><td></td></tr>
          <tr><td class="small muted">Déperdition enveloppe (fichier)</td><td class="num r small">${V(s.deperdition_enveloppe, "W/K", 1)}</td><td></td></tr>
          <tr><td class="small muted">Hperm / Hvent</td><td class="num r small">${V(s.hperm, "", 2)} / ${V(s.hvent, "", 2)}</td><td></td></tr>
        </tbody></table>
      </div>
      <div class="card">
        <div class="card-head"><h3>Répartition des déperditions</h3></div>
        <div class="card-body stack-sm">
          ${L.total > 0 ? bars(L.rows.filter(r => r.value > 0), L.total, (r, pct) => num(pct, 1) + " % · " + num(r.value, 0) + " W/K")
            : `<p class="hint">Aucune déperdition détaillée dans le fichier.</p>`}
        </div>
      </div>
      ${kvCard("Apports et besoins", [
        ["Besoin de chauffage", V(s.besoin_ch, "kWh/an", 0)],
        ["Besoin d'ECS", V(s.besoin_ecs, "kWh/an", 0)],
        ["Apports solaires (chauffage)", V(s.apport_solaire_ch, "kWh", 0)],
        ["Apports internes (chauffage)", V(s.apport_interne_ch, "kWh", 0)],
        ["Fraction d'apports gratuits", V(P100(s.fraction_apport_gratuit_ch), "%", 1)],
      ])}
    </div>`;
  }

  function tabBilan(d, sm) {
    const s = d.sortie || {};
    const ef = sm.hasEp ? " (EF)" : "";
    return `<div class="grid-2">
      <div class="card">
        <div class="card-head"><h3>Étiquette énergie</h3>
          <span class="spacer">${sm.gesCls ? `<span class="xsmall muted-3">Climat</span> ${badge(sm.gesCls, "ges", "sm")}` : ""}</span></div>
        <div class="card-body">${energyLabel(sm)}
          <p class="hint" style="margin-top:10px">${sm.clsSource === "fichier" ? "Classe reprise du fichier DPE."
            : sm.clsSource === "calcul" ? "Classe recalculée selon le double seuil énergie primaire / émissions de GES du DPE 2021." : "Classe non déterminable."}</p>
        </div>
      </div>
      <div class="stack">
        <div class="stat-grid dpe-stats">
          ${Frag.stat("Besoin chauffage", sm.besoinCh !== null ? num(sm.besoinCh, 0) : "—", "kWh/an")}
          ${Frag.stat("Conso chauffage" + ef, N(s.conso_ch) !== null ? num(N(s.conso_ch), 0) : "—", "kWh/an")}
          ${Frag.stat("Besoin ECS", sm.besoinEcs !== null ? num(sm.besoinEcs, 0) : "—", "kWh/an")}
