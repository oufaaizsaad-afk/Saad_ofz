    // Alimente les sous-catégories déclarées sur les postes.
    categories.forEach(c => {
      c.subCategories = [...new Set(items.filter(i => i.categoryId === c.id).map(i => i.subCategory).filter(Boolean))];
    });

    return {
      categories,
      items,
      units: UNITS.map(([code, label]) => Schema.unit({ code, label })),
      vatRates: VAT_RATES.map(([rate, label, isDefault]) => Schema.vatRate({ rate, label, isDefault })),
      coefficients: COEFFICIENTS.map(([family, label, value]) => Schema.coefficient({ family, label, value })),
      aidRules: AID_RULES.map(([name, device, mode, value, basis, cap, conditions]) =>
        Schema.aidRule({ name, device, mode, value, basis, cap, conditions, verified: false })),
      feeTemplates: FEE_TEMPLATES.map(([label, mode, value, vatRate]) => Schema.fee({ label, mode, value, vatRate })),
      users: [Schema.user({ name: "Saad Oufaaiz", email: "", role: "admin" })],
      settings: {
        bureauName: "Bureau d'études",
        bureauLegal: "",
        bureauAddress: "",
        bureauContact: "",
        bureauLogo: "",
        defaultEngineer: "Saad Oufaaiz",
        defaultVat: 5.5,
        autoSave: true,
        currency: "EUR",
        updatedAt: Core.nowIso(),
      },
      projects: [],
      dpeInbox: [],
      meta: { schemaVersion: 1, seededAt: Core.nowIso(), seedSource: "SO_chiffrage_VF.html" },
    };
  }

  return {
    build, BUILDING_METRICS, HEATING_TYPES, DHW_TYPES, ENERGIES,
    MISSION_TYPES, PRECISION_LEVELS, SEED_DATE, SEED_SOURCE,
  };
})();


/* ===== 04-repo.js ==================================================== */
/* =========================================================================
 * 04 — REPOSITORY : accès aux données.
 *
 * Toute l'application passe par Repo.* et ne connaît JAMAIS le support de
 * stockage. L'API est asynchrone (Promises) exactement comme le serait un
 * client Supabase, pour que la bascule vers PostgreSQL soit un remplacement
 * de driver et non une réécriture :
 *
 *   LocalDriver  → IndexedDB (avec repli localStorage)   [actif]
 *   SupabaseDriver → @supabase/supabase-js               [prévu, cf. repo Next.js]
 *
 * Le driver ne connaît que deux opérations : load() / save(snapshot).
 * ========================================================================= */
const Repo = (() => {
  "use strict";

  const DB_NAME = "bet_chiffrage";
  const STORE = "kv";
  const KEY = "snapshot_v1";
  const LS_KEY = "bet_chiffrage_snapshot_v1";

  /* --------------------------------------------------- Driver : IndexedDB */
  const IdbDriver = (() => {
    let dbp = null;
    function open() {
      if (dbp) return dbp;
      dbp = new Promise((resolve, reject) => {
        if (typeof indexedDB === "undefined") return reject(new Error("IndexedDB indisponible"));
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error("Ouverture IndexedDB refusée"));
      });
      return dbp;
    }
    return {
      name: "IndexedDB",
      async load() {
        const db = await open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readonly");
          const req = tx.objectStore(STORE).get(KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      },
      async save(snapshot) {
        const db = await open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readwrite");
          tx.objectStore(STORE).put(snapshot, KEY);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      },
    };
  })();

  /* ------------------------------------------------- Driver : localStorage */
  const LsDriver = {
    name: "localStorage",
    async load() {
      try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; }
      catch (e) { console.warn("localStorage indisponible", e); return null; }
    },
    async save(snapshot) {
      try { localStorage.setItem(LS_KEY, JSON.stringify(snapshot)); return true; }
      catch (e) { console.warn("Écriture localStorage impossible", e); return false; }
    },
  };

  /** Driver mémoire — filet de sécurité si aucun stockage n'est autorisé. */
  const MemDriver = (() => {
    let mem = null;
    return { name: "mémoire (non persistant)", async load() { return mem; }, async save(s) { mem = s; return true; } };
  })();

  let driver = LsDriver;
  let db = null;                 // snapshot en mémoire
  let dirty = false;
  let lastSavedAt = null;
  let saving = false;

  /* ---------------------------------------------------------- Cycle de vie */
  async function init() {
    // Choix du driver le plus durable disponible.
    const candidates = [IdbDriver, LsDriver, MemDriver];
    for (const d of candidates) {
      try {
        const loaded = await d.load();
        driver = d;
        if (loaded) { db = migrate(loaded); }
        break;
      } catch (e) { /* driver suivant */ }
    }
    if (!db) {
      // Reprise éventuelle d'une sauvegarde localStorage si on est passé sur IndexedDB.
      if (driver !== LsDriver) {
        try { const legacy = await LsDriver.load(); if (legacy) db = migrate(legacy); } catch (e) { /* ignore */ }
      }
    }
    if (!db) { db = Seed.build(); await flush(); }
    Core.Bus.emit("repo:ready", { driver: driver.name });
    return db;
  }

  /** Montée de version du schéma stocké (jamais destructive). */
  function migrate(snapshot) {
    const s = snapshot || {};
    s.meta = s.meta || { schemaVersion: 1 };
    s.categories = s.categories || [];
    s.items = s.items || [];
    s.units = s.units || [];
    s.vatRates = s.vatRates || [];
    s.coefficients = s.coefficients || [];
    s.aidRules = s.aidRules || [];
    s.feeTemplates = s.feeTemplates || [];
    s.users = s.users && s.users.length ? s.users : [Schema.user({ name: "Administrateur", role: "admin" })];
    s.projects = s.projects || [];
    s.dpeInbox = Array.isArray(s.dpeInbox) ? s.dpeInbox : [];
    s.projects.forEach(p => { if (!Array.isArray(p.dpes)) p.dpes = []; });
    s.settings = Object.assign({ autoSave: true, defaultVat: 5.5 }, s.settings || {});
    s.items.forEach(i => { if (!Array.isArray(i.history)) i.history = []; });
    return s;
  }

  const state = () => db;
  const driverName = () => driver.name;
  const isDirty = () => dirty;
  const savedAt = () => lastSavedAt;

  async function flush() {
    if (saving) return false;
    saving = true;
    try {
      const ok = await driver.save(db);
      if (ok !== false) { dirty = false; lastSavedAt = Core.nowIso(); Core.Bus.emit("repo:saved", lastSavedAt); }
      return ok;
    } catch (e) {
      console.error("Échec de sauvegarde", e);
      Core.Bus.emit("repo:error", e);
      return false;
    } finally { saving = false; }
  }

  const scheduleSave = Core.debounce(() => { flush(); }, 500);

  /** Marque la base modifiée et déclenche la sauvegarde automatique. */
  function touch(entity) {
    dirty = true;
    Core.Bus.emit("repo:changed", entity || null);
    if (db.settings.autoSave !== false) scheduleSave();
  }

  /* ---------------------------------------------- CRUD générique typé par collection */
  function collection(key, factory) {
    return {
      /** Liste brute (référence vive : ne pas muter hors des méthodes ci-dessous). */
      all: () => db[key],
      list(filterFn) { return filterFn ? db[key].filter(filterFn) : db[key].slice(); },
      get(id) { return db[key].find(x => x.id === id) || null; },
      async create(payload) {
        const entity = factory(payload);
        db[key].push(entity);
        touch(key);
        return entity;
      },
      async update(id, patch) {
        const e = db[key].find(x => x.id === id);
        if (!e) throw new Error("Élément introuvable : " + id);
        Object.assign(e, patch, { updatedAt: Core.nowIso() });
        touch(key);
        return e;
      },
      async remove(id) {
        const i = db[key].findIndex(x => x.id === id);
        if (i < 0) return false;
        db[key].splice(i, 1);
        touch(key);
        return true;
      },
      async duplicate(id, mutate) {
        const e = db[key].find(x => x.id === id);
        if (!e) throw new Error("Élément introuvable");
        const copy = Core.clone(e);
        copy.id = Core.uid(String(e.id).split("_")[0] || "id");
        copy.createdAt = copy.updatedAt = Core.nowIso();
        if (mutate) mutate(copy);
        db[key].push(copy);
        touch(key);
        return copy;
      },
    };
  }

  const categories = collection("categories", Schema.category);
  const units = collection("units", Schema.unit);
  const vatRates = collection("vatRates", Schema.vatRate);
  const coefficients = collection("coefficients", Schema.coefficient);
  const aidRules = collection("aidRules", Schema.aidRule);
  const feeTemplates = collection("feeTemplates", Schema.fee);
  const users = collection("users", Schema.user);
  const projects = collection("projects", Schema.project);

  /* ---------------------------------------------------- Catalogue (spécifique) */
  const items = (() => {
    const base = collection("items", Schema.catalogItem);
    return Object.assign({}, base, {
      async create(payload, userName) {
        const it = await base.create(Object.assign({ createdBy: userName || "" }, payload));
        it.history = [Schema.priceHistoryEntry({
          priceHT: it.priceHT, vatRate: it.vatRate, source: it.source,
          priceDate: it.priceDate, user: userName || "", note: "Création du poste",
        })];
        touch("items");
        return it;
      },
      /**
       * Mise à jour d'un poste. Si le prix HT ou la TVA change, une entrée
       * d'historique est empilée : l'ancien prix n'est jamais perdu (§7).
       */
      async update(id, patch, userName, note) {
        const before = base.get(id);
        if (!before) throw new Error("Poste introuvable");
        const priceChanged =
          patch.priceHT !== undefined && Core.round(Core.parseNum(patch.priceHT), 4) !== Core.round(before.priceHT, 4);
        const vatChanged =
          patch.vatRate !== undefined && Core.parseNum(patch.vatRate) !== before.vatRate;
        const e = await base.update(id, Object.assign({}, patch, { updatedBy: userName || "" }));
        if (priceChanged || vatChanged) {
          e.history = e.history || [];
          e.history.push(Schema.priceHistoryEntry({
            priceHT: e.priceHT, vatRate: e.vatRate, source: e.source, priceDate: e.priceDate,
            user: userName || "", note: note || "Mise à jour du prix",
          }));
          touch("items");
        }
        return e;
      },
      /** Prix précédent connu (avant-dernière entrée d'historique). */
      previous(item) {
        const h = item.history || [];
        return h.length >= 2 ? h[h.length - 2] : null;
      },
      byCategory(categoryId) { return db.items.filter(i => i.categoryId === categoryId); },
    });
  })();

  /* -------------------------------------------------------------- Paramètres */
  const settings = {
    get() { return db.settings; },
    async update(patch) {
      Object.assign(db.settings, patch, { updatedAt: Core.nowIso() });
      touch("settings");
      return db.settings;
    },
  };

  /* --------------------------------------------------- Sauvegarde / restauration */
  function exportJSON() {
    return JSON.stringify({ exportedAt: Core.nowIso(), app: "BET Chiffrage", data: db }, null, 2);
  }

  async function importJSON(text, { merge = false } = {}) {
    const parsed = JSON.parse(text);
    const incoming = parsed && parsed.data ? parsed.data : parsed;
    if (!incoming || !Array.isArray(incoming.items)) throw new Error("Fichier de sauvegarde non reconnu");
    if (!merge) {
      db = migrate(incoming);
    } else {
      const byLabel = new Set(db.items.map(i => Core.norm(i.label)));
      (incoming.items || []).forEach(i => { if (!byLabel.has(Core.norm(i.label))) db.items.push(i); });
      const projIds = new Set(db.projects.map(p => p.id));
      (incoming.projects || []).forEach(p => { if (!projIds.has(p.id)) db.projects.push(p); });
    }
    touch("import");
    await flush();
    return db;
  }

  async function resetToSeed() {
    db = Seed.build();
    touch("reset");
    await flush();
    return db;
  }

  return {
    init, state, flush, touch, driverName, isDirty, savedAt,
    categories, items, units, vatRates, coefficients, aidRules, feeTemplates, users, projects, settings,
    exportJSON, importJSON, resetToSeed,
  };
})();


/* ===== 05-calc.js ==================================================== */
/* =========================================================================
 * 05 — CALC : moteur de calcul. Fonctions PURES, sans DOM ni stockage.
 *
 * C'est le cœur métier : il est isolé pour être testable et réutilisable
 * tel quel côté serveur (le portage TypeScript du dépôt Next.js reprend
 * ces mêmes signatures).
 *
 * Chaîne de calcul d'une ligne :
 *   prix catalogue → × coefficients → × (1 − remise) → prix projet
 *   prix projet × quantité = total HT → + TVA = total TTC
 * ========================================================================= */
const Calc = (() => {
  "use strict";
  const { round, parseNum } = Core;

  /* ------------------------------------------------------------------ Ligne */

  /** Produit des coefficients du référentiel sélectionnés + coefficient libre. */
  function coefTotal(line, coefficients) {
    const ids = line.coefficientIds || [];
    let k = ids.reduce((acc, id) => {
      const c = (coefficients || []).find(x => x.id === id);
      return acc * (c ? (parseNum(c.value) || 1) : 1);
    }, 1);
    k *= parseNum(line.manualCoef) || 1;
    return round(k, 4);
  }

  /** Détail complet d'une ligne de travaux. */
  function lineTotals(line, coefficients) {
    const k = coefTotal(line, coefficients);
    const discount = Math.min(Math.max(parseNum(line.discountPct), 0), 100);
    const basePrice = parseNum(line.priceHT);
    const priceAfterCoef = basePrice * k;
    const unitPriceHT = priceAfterCoef * (1 - discount / 100);
    const qty = parseNum(line.quantity);
    const totalHT = unitPriceHT * qty;
    const vatRate = parseNum(line.vatRate);
    const vat = totalHT * vatRate / 100;
    return {
      coef: k,
      discount,
      basePrice: round(basePrice, 2),
      priceAfterCoef: round(priceAfterCoef, 2),
      unitPriceHT: round(unitPriceHT, 2),
      unitPriceTTC: round(unitPriceHT * (1 + vatRate / 100), 2),
      quantity: qty,
      totalHT: round(totalHT, 2),
      vat: round(vat, 2),
      totalTTC: round(totalHT + vat, 2),
    };
  }

  /* ------------------------------------------------------------ Frais annexes */

  /**
   * Base de calcul d'un frais exprimé en €/m².
   * `basis` pointe soit une surface projet, soit un métré cumulé des bâtiments.
   */
  function feeAreaBasis(project, basis) {
    const b = basis || "livingArea";
    const fromBuildings = (project.buildings || []).reduce(
      (a, bd) => a + parseNum((bd.metrics || {})[b] && (bd.metrics[b].value !== undefined ? bd.metrics[b].value : bd.metrics[b])), 0);
    if (fromBuildings > 0) return fromBuildings;
    if (b === "livingArea") return parseNum(project.livingArea);
    if (b === "floorArea") return parseNum(project.floorArea);
    return 0;
  }

  function feeAmountHT(fee, project, worksHT) {
    const v = parseNum(fee.value);
    switch (fee.mode) {
      case "forfait": return round(v, 2);
      case "m2": return round(v * feeAreaBasis(project, fee.basis), 2);
      case "logement": return round(v * dwellings(project), 2);
      case "pct": return round(worksHT * v / 100, 2);
      default: return 0;
    }
  }

  const dwellings = project =>
    parseNum(project.nbDwellings) ||
    (project.buildings || []).reduce((a, b) => a + parseNum(b.nbDwellings), 0) || 0;

  /* --------------------------------------------------------------- Aides */

  function aidAmount(aid, ctx) {
    const v = parseNum(aid.value);
    let amount = 0;
    switch (aid.mode) {
      case "forfait": amount = v; break;
      case "pct": amount = (aid.basis === "ttc" ? ctx.totalTTC : ctx.totalHT) * v / 100; break;
      case "logement": amount = v * ctx.dwellings; break;
      case "m2": amount = v * ctx.area; break;
      case "custom": amount = v; break;
      default: amount = 0;
    }
    const cap = parseNum(aid.cap);
    if (cap > 0) amount = Math.min(amount, cap);
    return round(Math.max(amount, 0), 2);
  }

  /* ------------------------------------------------------------- Scénario */

  /**
   * Calcul complet d'un scénario dans le contexte d'un projet.
   * Retourne un objet immuable exploitable par l'UI, l'export et le PDF.
   */
  function scenarioTotals(scenario, project, refs) {
    const coefficients = (refs && refs.coefficients) || [];
    const lines = (scenario.lines || []).map(l => ({ line: l, t: lineTotals(l, coefficients) }));

    const worksHT = round(lines.reduce((a, x) => a + x.t.totalHT, 0), 2);
    const worksVAT = round(lines.reduce((a, x) => a + x.t.vat, 0), 2);
    const worksTTC = round(worksHT + worksVAT, 2);

    const fees = (scenario.fees || []).map(f => {
      const ht = feeAmountHT(f, project, worksHT);
      const vat = round(ht * parseNum(f.vatRate) / 100, 2);
      return { fee: f, ht, vat, ttc: round(ht + vat, 2) };
    });
    const feesHT = round(fees.reduce((a, f) => a + f.ht, 0), 2);
    const feesVAT = round(fees.reduce((a, f) => a + f.vat, 0), 2);
    const feesTTC = round(feesHT + feesVAT, 2);

    const totalHT = round(worksHT + feesHT, 2);
    const totalVAT = round(worksVAT + feesVAT, 2);
    const totalTTC = round(totalHT + totalVAT, 2);

    const nbLog = dwellings(project);
    const area = parseNum(project.livingArea) || feeAreaBasis(project, "livingArea");

    const aidCtx = { totalHT, totalTTC, dwellings: nbLog, area };
    const aids = (scenario.aids || []).map(a => ({ aid: a, amount: aidAmount(a, aidCtx) }));
    const aidsTotalRaw = round(aids.reduce((a, x) => a + x.amount, 0), 2);
    const aidsTotal = Math.min(aidsTotalRaw, totalTTC);
    const remainder = round(totalTTC - aidsTotal, 2);

    // Répartition par bâtiment
    const byBuilding = allocateByBuilding(lines, project, feesTTC, feesHT);

    // Incertitude (§19)
    const u = parseNum(project.uncertainty) / 100;
    const range = {
      pct: parseNum(project.uncertainty),
      htLow: round(totalHT * (1 - u), 2), htHigh: round(totalHT * (1 + u), 2),
      ttcLow: round(totalTTC * (1 - u), 2), ttcHigh: round(totalTTC * (1 + u), 2),
    };

    // Analyse économique
    const eco = economics(scenario, project, { totalTTC, remainder });

    return {
      scenarioId: scenario.id,
      name: scenario.name,
      lines, nbLines: lines.length,
      worksHT, worksVAT, worksTTC,
      fees, feesHT, feesVAT, feesTTC,
      totalHT, totalVAT, totalTTC,
      aids, aidsTotal, aidsCapped: aidsTotalRaw > totalTTC, remainder,
      dwellings: nbLog, area,
      perDwellingTTC: nbLog ? round(totalTTC / nbLog, 2) : 0,
      perDwellingRemainder: nbLog ? round(remainder / nbLog, 2) : 0,
      perM2TTC: area ? round(totalTTC / area, 2) : 0,
      byBuilding, range, eco,
    };
  }

  /**
   * Ventilation par bâtiment.
   * - ligne affectée à n bâtiments → répartie à parts égales entre eux ;
   * - ligne « toute la copropriété » et frais annexes → répartis selon
   *   les tantièmes, à défaut le nombre de logements, à défaut à parts égales.
   */
  function allocateByBuilding(lines, project, feesTTC, feesHT) {
    const buildings = project.buildings || [];
    if (!buildings.length) return [];
    const keys = buildings.map(b => parseNum(b.tantiemes));
    let weights = keys;
    if (!keys.some(k => k > 0)) {
      const d = buildings.map(b => parseNum(b.nbDwellings));
      weights = d.some(x => x > 0) ? d : buildings.map(() => 1);
    }
    const wTotal = weights.reduce((a, b) => a + b, 0) || buildings.length;

    const acc = buildings.map((b, i) => ({
      id: b.id, name: b.name, weight: weights[i], ht: 0, ttc: 0,
      nbDwellings: parseNum(b.nbDwellings),
    }));

    let commonHT = 0, commonTTC = 0;
    lines.forEach(({ line, t }) => {
      const ids = (line.buildingIds || []).filter(id => buildings.some(b => b.id === id));
      if (!ids.length) { commonHT += t.totalHT; commonTTC += t.totalTTC; return; }
      const share = 1 / ids.length;
      ids.forEach(id => {
        const a = acc.find(x => x.id === id);
        if (a) { a.ht += t.totalHT * share; a.ttc += t.totalTTC * share; }
      });
    });
    commonHT += feesHT || 0;
    commonTTC += feesTTC || 0;

    acc.forEach((a, i) => {
      const w = (weights[i] || 0) / wTotal;
      a.ht = round(a.ht + commonHT * w, 2);
      a.ttc = round(a.ttc + commonTTC * w, 2);
      a.perDwellingTTC = a.nbDwellings ? round(a.ttc / a.nbDwellings, 2) : 0;
    });
    return acc;
  }

  /* -------------------------------------------------- Analyse économique (§18) */

  function economics(scenario, project, amounts) {
    const e = project.economics || {};
    const consoBefore = parseNum(e.consoBefore);
    const price = parseNum(e.energyPrice);
    const savingPct = Math.min(Math.max(parseNum(scenario.energySavingPct), 0), 100);
    const consoAfter = round(consoBefore * (1 - savingPct / 100), 0);
    const energySavedKwh = round(consoBefore - consoAfter, 0);
    const energySavedEur = round(energySavedKwh * price, 2);
    const opexDelta = round(parseNum(e.opexBefore) - parseNum(e.opexAfter), 2);
    const annualSaving = round(energySavedEur + opexDelta, 2);

    const capex = amounts.totalTTC;
    const netCapex = amounts.remainder;
    const payback = annualSaving > 0 ? round(netCapex / annualSaving, 1) : null;
    const paybackGross = annualSaving > 0 ? round(capex / annualSaving, 1) : null;

    const horizon = Math.max(1, Math.round(parseNum(e.horizon) || 25));
    const rate = parseNum(e.discountRate) / 100;
    const infl = parseNum(e.energyInflation) / 100;

    // Flux : -reste à charge en année 0, puis économies indexées
    const flows = [-netCapex];
    for (let y = 1; y <= horizon; y++) flows.push(annualSaving * Math.pow(1 + infl, y - 1));

    const npv = round(flows.reduce((acc, f, i) => acc + f / Math.pow(1 + rate, i), 0), 2);
    const irr = computeIRR(flows);
    const globalCost = round(netCapex + (parseNum(e.opexAfter) * horizon), 2);

    return {
      consoBefore, consoAfter, energySavedKwh, energySavedEur, opexDelta,
      annualSaving, capex, netCapex, payback, paybackGross,
      horizon, discountRate: parseNum(e.discountRate), energyInflation: parseNum(e.energyInflation),
      npv, irr, globalCost, savingPct,
    };
  }

  /** TRI par bissection — retourne null si aucun taux plausible. */
  function computeIRR(flows) {
    if (!flows.length || flows[0] >= 0) return null;
    const npvAt = r => flows.reduce((a, f, i) => a + f / Math.pow(1 + r, i), 0);
    let lo = -0.9, hi = 2;
    let fLo = npvAt(lo), fHi = npvAt(hi);
    if (fLo * fHi > 0) return null;
    for (let i = 0; i < 200; i++) {
      const mid = (lo + hi) / 2;
      const fMid = npvAt(mid);
      if (Math.abs(fMid) < 1e-6) return round(mid * 100, 2);
      if (fLo * fMid < 0) { hi = mid; fHi = fMid; } else { lo = mid; fLo = fMid; }
    }
    return round(((lo + hi) / 2) * 100, 2);
  }

  /* ------------------------------------------------------------ Agrégats projet */

  /** Totaux d'un projet = scénario sélectionné, à défaut le premier. */
  function projectTotals(project, refs) {
    const scenarios = project.scenarios || [];
    if (!scenarios.length) return null;
    const sel = scenarios.find(s => s.selected) || scenarios[0];
    return scenarioTotals(sel, project, refs);
  }

  function compare(project, refs) {
    return (project.scenarios || []).map(s => scenarioTotals(s, project, refs));
  }

  /** Répartition par logement / quote-part (§17). */
  function perTantieme(totalTTC, project) {
    const tt = parseNum(project.totalTantiemes) || 0;
    return tt > 0 ? round(totalTTC / tt, 4) : 0;
  }

  return {
    coefTotal, lineTotals, feeAmountHT, feeAreaBasis, aidAmount,
    scenarioTotals, projectTotals, compare, economics, computeIRR,
    dwellings, perTantieme, allocateByBuilding,
  };
})();


/* ===== 05b-dpe.js ==================================================== */
/* =========================================================================
 * 05b — DPE : lecture des exports Excel DPE 3CL (ADEME 2021), synthèse,
 * métrés et préconisations. Fonctions sans DOM (hors chargement de la
 * bibliothèque de repli SheetJS).
 *
 * Reprise du « DPE Infos Extractor » : même lecture des feuilles
 * administratif / logement / logement_sortie, mêmes regroupements de
 * synthèse — mais les données sont maintenant persistées et branchées sur
 * le chiffrage (fiche projet, métrés bâtiment, scénarios, hypothèses).
 * ========================================================================= */
const Dpe = (() => {
  "use strict";
  const { norm } = Core;

  /* ------------------------------------------------------------ Lecture */
  function cellValue(v) {
    if (v === undefined || v === null) return null;
    if (typeof v === "object") {
      if (v instanceof Date) return v.toISOString().slice(0, 10);
      if (v.error) return null;
      if (v.result !== undefined) return v.result;
      if (Array.isArray(v.richText)) return v.richText.map(t => t.text).join("");
      if (v.text !== undefined) return v.text;
      if (v.hyperlink !== undefined) return v.text || v.hyperlink;
    }
    return v;
  }

  /** Feuille ExcelJS → tableau de lignes (équivalent sheet_to_json header:1). */
  function rowsFromExcelJS(ws) {
    const rows = [];
    if (!ws) return rows;
    const count = ws.rowCount || 0;
    for (let i = 1; i <= count; i++) {
      const vals = ws.getRow(i).values || [];
      const arr = [];
      for (let c = 1; c < vals.length; c++) arr.push(cellValue(vals[c]));
      rows.push(arr);
    }
    return rows;
  }

  let sheetJsPromise = null;
  function loadSheetJS() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!sheetJsPromise) {
      sheetJsPromise = new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
        s.onload = () => resolve(window.XLSX);
        s.onerror = () => { sheetJsPromise = null; reject(new Error("bibliothèque de lecture Excel indisponible (réseau ?)")); };
        document.head.appendChild(s);
      });
    }
    return sheetJsPromise;
  }

  const SHEETS = ["administratif", "logement", "logement_sortie"];

  async function readSheets(file) {
    const buf = await file.arrayBuffer();
    const out = {};
    let ok = false;
    if (typeof ExcelJS !== "undefined" && !/\.xls$/i.test(file.name)) {
      try {
        const wb = new ExcelJS.Workbook();
        await wb.xlsx.load(buf);
        SHEETS.forEach(n => { out[n] = rowsFromExcelJS(wb.worksheets.find(w => norm(w.name).trim() === n)); });
        ok = true;
      } catch (e) { console.warn("Lecture ExcelJS impossible, repli SheetJS", e); }
    }
    if (!ok) {
      const X = await loadSheetJS();
      const wb = X.read(buf, { type: "array" });
      SHEETS.forEach(n => {
        const name = wb.SheetNames.find(s => norm(s).trim() === n);
        out[n] = name ? X.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null }) : [];
      });
    }
    return out;
  }

  /* ---------------------------------------------- Analyse des feuilles */
  function getKV(rows) {
    const m = {};
    rows.forEach(r => { if (r && r[0] !== null && r[0] !== undefined && r[0] !== "") m[String(r[0])] = r[1]; });
    return m;
  }
  function extractSection(rows, label) {
    let hi = -1;
    for (let i = 0; i < rows.length; i++) {
      if (rows[i] && rows[i][1] === label + "_0") { hi = i; break; }
    }
    if (hi < 0) return {};
    const obj = {};
    for (let i = hi + 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r || (!r[0] && !r[1])) break;
      if (r[0]) obj[r[0]] = r[1];
    }
    return obj;
  }
  function extractMulti(rows, label) {
    let hi = -1;
    for (let i = 0; i < rows.length; i++) {
      if (rows[i] && typeof rows[i][1] === "string" && rows[i][1].startsWith(label + "_0")) { hi = i; break; }
    }
    if (hi < 0) return [];
    const headers = rows[hi].slice(1).filter(h => typeof h === "string" && h.startsWith(label));
    const els = headers.map(() => ({}));
    for (let i = hi + 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r || (!r[0] && !r[1])) continue;
      if (r[0] === null && typeof r[1] === "string" && !r[1].startsWith(label)) break;
      if (r[0]) headers.forEach((_, j) => { els[j][r[0]] = r[j + 1]; });
    }
    return els;
  }
  function prune(o) {
    const r = {};
    Object.keys(o || {}).forEach(k => {
      const v = o[k];
      if (v !== null && v !== undefined && v !== "") r[k] = v;
    });
    return r;
  }

  function parse(sh) {
    const aR = sh.administratif || [], lR = sh.logement || [], sR = sh.logement_sortie || [];
    if (!lR.length && !sR.length) {
      throw new Error("classeur non reconnu — feuilles « logement » et « logement_sortie » absentes (export DPE 3CL ADEME attendu)");
    }
    return {
      admin: prune(getKV(aR)), logKV: prune(getKV(lR)), sortie: prune(getKV(sR)),
      murs: extractMulti(lR, "mur").map(prune),
      pbas: extractMulti(lR, "plancher_bas").map(prune),
      phauts: extractMulti(lR, "plancher_haut").map(prune),
      baies: extractMulti(lR, "baie_vitree").map(prune),
      portes: extractMulti(lR, "porte").map(prune),
      ponts: extractMulti(lR, "pont_thermique").map(prune),
      vmc: prune(extractSection(lR, "ventilation")),
      genECS: prune(extractSection(lR, "generateur_ecs")),
      installCH: prune(extractSection(lR, "installation_chauffage")),
      genCH: prune(extractSection(lR, "generateur_chauffage")),
      emetteur: prune(extractSection(lR, "emetteur_chauffage")),
    };
  }

  function record(fileName, data) {
    return {
      id: Core.uid("dpe"), fileName, importedAt: Core.nowIso(),
      importedBy: (typeof Auth !== "undefined" ? Auth.name() : ""), buildingId: null, data,
    };
  }

  async function readFile(file) {
    const sh = await readSheets(file);
    return record(file.name, parse(sh));
  }

  /* ------------------------------------------------------- Accès valeurs */
  function numOf(v) {
    if (v === null || v === undefined || v === "") return null;
    if (typeof v === "number") return Number.isFinite(v) ? v : null;
    if (typeof v === "boolean") return v ? 1 : 0;
    const x = parseFloat(String(v).replace(/[\s  ]/g, "").replace(",", "."));
    return Number.isFinite(x) ? x : null;
  }
  function pick(obj, keys) {
    for (const k of keys) {
      const v = obj ? obj[k] : undefined;
      if (v !== null && v !== undefined && v !== "") return v;
    }
    return null;
  }
  function pickNum(obj, keys) {
    for (const k of keys) {
      const v = numOf(obj ? obj[k] : null);
      if (v !== null) return v;
    }
    return null;
  }
  /** Date Excel (numéro de série) ou ISO → jj/mm/aaaa. */
  function fmtDate(v) {
    if (v === null || v === undefined || v === "") return null;
    const n = numOf(v);
    if (n !== null && n > 20000 && n < 80000 && !/[-/]/.test(String(v))) {
      const d = new Date(Math.round((n - 25569) * 86400000));
      return Core.dateFR(d.toISOString());
    }
    const s = String(v);
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return Core.dateFR(s);
    return s;
  }
  const txt = v => norm(v === null || v === undefined ? "" : String(v));

  /* ------------------------------------------------------ Étiquettes DPE */
  const LETTERS = ["A", "B", "C", "D", "E", "F", "G"];
  /** Seuils du DPE 2021 (logement) : énergie primaire kWh/m².an et GES kgCO2/m².an. */
  const EP_T = [70, 110, 180, 250, 330, 420];
  const GES_T = [6, 11, 30, 50, 70, 100];
  const COLORS = {
    A: ["#009C6D", "#FFFFFF"], B: ["#52B153", "#FFFFFF"], C: ["#78BD76", "#0B2A12"], D: ["#F4E70F", "#3A3400"],
    E: ["#F0B40F", "#3A2A00"], F: ["#EB8235", "#FFFFFF"], G: ["#D7221F", "#FFFFFF"],
  };
  const GES_COLORS = {
    A: ["#A4DBF8", "#0E2A3A"], B: ["#8CB4D3", "#0E2A3A"], C: ["#7792B1", "#FFFFFF"], D: ["#606F8F", "#FFFFFF"],
    E: ["#4D5271", "#FFFFFF"], F: ["#393551", "#FFFFFF"], G: ["#281B35", "#FFFFFF"],
  };
  const idxOf = (v, T) => { if (v === null || v === undefined) return -1; for (let i = 0; i < T.length; i++) if (v <= T[i]) return i; return 6; };
  function validClass(c) {
    const s = String(c === null || c === undefined ? "" : c).trim().toUpperCase();
    return LETTERS.includes(s) ? s : null;
  }

  /* --------------------------------------------------- Synthèse d'un DPE */
  function summary(d) {
    d = d || {};
    const a = d.admin || {}, l = d.logKV || {}, s = d.sortie || {};
    const cp = pick(a, ["ban_postcode", "code_postal_brut", "code_postal"]);
    const city = pick(a, ["ban_city", "nom_commune_brut", "commune"]);
    const hasEp = numOf(s.ep_conso_5_usages_m2) !== null || numOf(s.ep_conso_5_usages) !== null;
    const epM2 = pickNum(s, ["ep_conso_5_usages_m2", "conso_5_usages_m2"]);
    const ep = pickNum(s, ["ep_conso_5_usages", "conso_5_usages"]);
    const gesM2 = pickNum(s, ["emission_ges_5_usages_m2"]);
    const iEp = idxOf(epM2, EP_T), iGes = idxOf(gesM2, GES_T);
    const fileCls = validClass(pick(s, ["classe_bilan_dpe", "etiquette_dpe", "classe_dpe"]));
    const fileGes = validClass(pick(s, ["classe_emission_ges", "etiquette_ges"]));
    const calcCls = iEp >= 0 ? LETTERS[Math.max(iEp, iGes)] : null;
    return {
      address: pick(a, ["ban_label", "label_brut", "adresse_brut"]),
      postcode: cp ? String(cp).padStart(5, "0") : null,
      city,
      date: fmtDate(pick(a, ["date_visite_diagnostiqueur", "date_etablissement_dpe"])),
      software: pick(a, ["version_logiciel", "nom_logiciel"]),
      numero: pick(a, ["numero_dpe"]),
      method: pick(l, ["methode_application_dpe_log", "enum_methode_application_dpe_log_id"]),
      year: pick(l, ["annee_construction"]),
      period: pick(l, ["periode_construction"]),
      surface: pickNum(l, ["surface_habitable_logement", "surface_habitable_immeuble", "surface_habitable"]),
      hsp: pickNum(l, ["hsp"]),
      levels: pickNum(l, ["nombre_niveau_immeuble", "nombre_niveau_logement"]),
      nbLog: pickNum(l, ["nombre_appartement", "nombre_logement"]),
      zone: pick(l, ["zone_climatique"]),
      altitude: pick(l, ["altitude"]),
      altClass: pick(l, ["classe_altitude"]),
      inertie: pick(l, ["classe_inertie"]),
      hasEp, epM2, ep,
      efM2: hasEp ? pickNum(s, ["conso_5_usages_m2"]) : null,
      ef: hasEp ? pickNum(s, ["conso_5_usages"]) : null,
      gesM2, ges: pickNum(s, ["emission_ges_5_usages"]),
      cost: pickNum(s, ["cout_5_usages"]),
      cls: fileCls || calcCls, clsSource: fileCls ? "fichier" : (calcCls ? "calcul" : null),
      clsEp: iEp >= 0 ? LETTERS[iEp] : null,
      gesCls: fileGes || (iGes >= 0 ? LETTERS[iGes] : null),
      besoinCh: pickNum(s, ["besoin_ch"]), besoinEcs: pickNum(s, ["besoin_ecs"]),
      deperd: pickNum(s, ["deperdition_enveloppe"]),
      heating: pick(d.genCH || {}, ["type_generateur_ch"]),
      energy: pick(d.genCH || {}, ["type_energie"]),
      ecs: pick(d.genECS || {}, ["type_generateur_ecs"]),
      vmc: pick(d.vmc || {}, ["type_ventilation"]),
    };
  }

  /* ------------------------------------------------- Parois et métrés */
  const isExt = adj => txt(adj).includes("exterieur");
  const isDep = el => { const b = numOf(el.b); return b === null || b > 0; };
  const area = el => numOf(el.surface_paroi_opaque) || 0;
  const nonIso = el => /non isol/.test(txt(el.type_isolation));

  /** Murs donnant sur l'extérieur (repli : murs déperditifs si l'adjacence est absente). */
  function extWalls(d) {
    const murs = d.murs || [];
    const hasAdj = murs.some(m => m.type_adjacence);
    return murs.filter(m => (hasAdj ? isExt(m.type_adjacence) : isDep(m)));
  }
  const roofs = d => (d.phauts || []).filter(isDep);
  const lowFloors = d => (d.pbas || []).filter(p => isDep(p) && !txt(p.type_adjacence).includes("terre-plein"));
  const baieCount = b => numOf(b.nb_baie) || 1;

  /** Nombre de logements couverts par un ensemble de DPE. */
  function dwellings(recs) {
    return (recs || []).reduce((a, r) => a + (summary(r.data).nbLog || 1), 0);
  }

  /** Métrés normalisés (clés Seed.BUILDING_METRICS) déduits d'un ensemble de DPE. */
  function metrics(recs) {
    const out = { livingArea: 0, facadeArea: 0, roofArea: 0, lowFloorArea: 0, glazingArea: 0, nbBaies: 0 };
    (recs || []).forEach(r => {
      const d = r.data || {};
      out.livingArea += summary(d).surface || 0;
      out.facadeArea += Core.sum(extWalls(d), area);
      out.roofArea += Core.sum(roofs(d), area);
      out.lowFloorArea += Core.sum(lowFloors(d), area);
      out.glazingArea += Core.sum(d.baies || [], b => numOf(b.surface_totale_baie) || 0);
      out.nbBaies += Core.sum(d.baies || [], baieCount);
    });
    Object.keys(out).forEach(k => { out[k] = Core.round(out[k], 2); });
    return out;
  }

  /* ------------------------------------------ Systèmes → listes projet */
  function systemsOf(d) {
    const gen = txt([d.genCH && d.genCH.type_generateur_ch, d.genCH && d.genCH.description].join(" "));
    const inst = txt([d.installCH && d.installCH.type_installation, d.installCH && d.installCH.description,
      d.installCH && d.installCH.enum_type_installation_id].join(" "));
    const en = txt(d.genCH && d.genCH.type_energie);
    const ecs = txt([d.genECS && d.genECS.type_generateur_ecs, d.genECS && d.genECS.type_energie, d.genECS && d.genECS.type_installation].join(" "));
    const coll = inst.includes("collecti") || gen.includes("collecti");
    const collEcs = ecs.includes("collecti") || (coll && ecs.includes("mixte"));

    let energy = "";
    if (en.includes("reseau")) energy = "Réseau de chaleur";
    else if (en.includes("gaz naturel") || (en.includes("gaz") && !en.includes("propane") && !en.includes("gpl"))) energy = "Gaz naturel";
    else if (en.includes("electri")) energy = "Électricité";
    else if (en.includes("fioul")) energy = "Fioul";
    else if (en.includes("bois") || en.includes("granul") || en.includes("biomasse")) energy = "Bois / biomasse";
    else if (en.includes("propane") || en.includes("gpl") || en.includes("butane")) energy = "Propane";

    let heatingType = "";
    if (energy === "Réseau de chaleur") heatingType = "Réseau de chaleur urbain";
    else if (gen.includes("pac") || gen.includes("pompe a chaleur")) heatingType = coll ? "PAC collective" : "PAC individuelle";
    else if (energy === "Électricité") heatingType = "Chauffage électrique individuel";
    else if (energy === "Gaz naturel") heatingType = coll ? "Chaudière collective gaz" : "Chauffage individuel gaz";
    else if (energy === "Fioul" && coll) heatingType = "Chaudière collective fioul";
    else if (gen) heatingType = "Autre";

    let dhwType = "";
    if (ecs.includes("thermodynamique")) dhwType = "Chauffe-eau thermodynamique";
    else if (ecs.includes("solaire")) dhwType = "ECS solaire";
    else if (collEcs) dhwType = "ECS collective (production centralisée)";
    else if (ecs.includes("electri") || ecs.includes("ballon")) dhwType = "ECS individuelle électrique";
    else if (ecs.includes("gaz") || ecs.includes("chaudiere")) dhwType = "ECS individuelle gaz";
    else if (ecs) dhwType = "Autre";

    return { energy, heatingType, dhwType, collective: coll };
  }

  function deptFromCp(cp) {
    const s = String(cp || "").trim();
    if (!/^\d{5}$/.test(s)) return "";
    if (s.startsWith("97") || s.startsWith("98")) return s.slice(0, 3);
    if (s.startsWith("20")) return Number(s) < 20200 ? "2A" : "2B";
    return s.slice(0, 2);
  }

  /** Adresse sans le code postal ni la commune (déjà saisis à part). */
  function street(sm) {
    const a = String(sm.address || "").trim();
    if (!a) return "";
    if (sm.postcode && a.includes(sm.postcode)) return a.slice(0, a.indexOf(sm.postcode)).trim().replace(/[,\s]+$/, "");
    return a;
  }

  /** Valeurs proposées pour la fiche projet à partir d'un ensemble de DPE. */
  function projectPrefill(recs) {
    const list = recs || [];
    const sms = list.map(r => summary(r.data));
    const f = sms.find(s => s.address) || sms[0] || {};
    const sys = list.length ? systemsOf(list[0].data) : {};
    const living = Core.round(Core.sum(sms, s => s.surface || 0), 2);
    const years = sms.map(s => s.year).filter(Boolean);
    const levels = sms.map(s => s.levels || 0).reduce((m, x) => Math.max(m, x), 0);
    const st = street(f);
    return {
      name: [st || f.address || "", f.city].filter(Boolean).join(" — ") || "Projet DPE",
      address: st || f.address || "",
      postalCode: f.postcode || "",
      city: f.city || "",
      department: deptFromCp(f.postcode),
      constructionYear: years.length ? String(years[0]) : "",
      livingArea: living || 0,
      nbDwellings: dwellings(list),
      nbLevels: levels || 0,
      heatingType: sys.heatingType || "",
      dhwType: sys.dhwType || "",
      energy: sys.energy || "",
      comment: list.length ? "Projet initialisé à partir de " + list.length + " DPE : " + list.map(r => r.fileName).join(", ") : "",
    };
  }

  /** Consommation et prix implicite de l'énergie (hypothèses économiques). */
  function energyBaseline(recs) {
    const sms = (recs || []).map(r => summary(r.data));
    const allEp = sms.every(s => s.hasEp);
    const conso = Core.round(Core.sum(sms, s => (s.hasEp ? s.ef : s.ep) || 0), 0);
    const cost = Core.round(Core.sum(sms, s => s.cost || 0), 2);
    return {
      conso, cost,
      kind: allEp ? "énergie finale" : "valeur « conso_5_usages » du fichier",
      price: conso > 0 && cost > 0 ? Core.round(cost / conso, 4) : 0,
    };
  }

  /* ------------------------------------------------ Préconisations (§10) */
  /** Recherche d'un poste actif du catalogue dont le libellé contient tous les mots d'un des jeux. */
  function findItem(items, sets) {
    const act = (items || []).filter(i => i.active !== false);
    for (const words of sets) {
      const hit = act.find(i => words.every(w => norm(i.label).includes(norm(w))));
      if (hit) return hit;
    }
    return null;
  }

  function suggestions(recs, items) {
    const list = recs || [];
    const out = [];
    const add = (key, title, detail, sets, qty, files) => {
      const it = findItem(items, sets);
      out.push({ key, title, detail, itemId: it ? it.id : "", qty: Core.round(qty || 0, 2), files, checked: !!it });
    };
    const agg = {};
    let curB = "_";
    const bump = (k, q, f, extra) => {
      agg[k] = agg[k] || { q: 0, files: new Set(), n: 0, extra: [], b: new Set() };
      agg[k].q += q || 0; agg[k].n++; agg[k].files.add(f); agg[k].b.add(curB);
      if (extra) agg[k].extra.push(extra);
    };

    list.forEach(r => {
      const d = r.data || {};
      const f = r.fileName;
      curB = r.buildingId || "_";
      const nLog = summary(d).nbLog || 1;
      const sys = systemsOf(d);

      // Murs extérieurs non isolés ou peu isolés
      extWalls(d).filter(m => nonIso(m) || (numOf(m.umur) || 0) >= 1).forEach(m => bump("ite", area(m), f, numOf(m.umur)));
      // Planchers hauts
      roofs(d).filter(p => nonIso(p) || (numOf(p.uph) || 0) > 0.5).forEach(p => {
        const t = txt([p.type_adjacence, p.type_plancher_haut].join(" "));
        if (t.includes("terrasse")) bump("terrasse", area(p), f, numOf(p.uph));
        else if (t.includes("rampant") || t.includes("amenage")) bump("rampants", area(p), f, numOf(p.uph));
        else bump("combles", area(p), f, numOf(p.uph));
      });
      // Planchers bas (hors terre-plein)
      lowFloors(d).filter(p => nonIso(p) || (numOf(p.upb_final) || numOf(p.upb) || 0) > 0.6)
        .forEach(p => bump("pbas", area(p), f, numOf(p.upb_final) || numOf(p.upb)));
      // Menuiseries peu performantes
      (d.baies || []).filter(b => txt(b.type_vitrage).includes("simple") || (numOf(b.uw) || 0) >= 3)
        .forEach(b => bump("menuiseries", baieCount(b), f, numOf(b.uw)));
      // Ventilation
      const v = txt(d.vmc && d.vmc.type_ventilation);
      if (v && (v.includes("naturel") || v.includes("ouverture des fenetres") || v.includes("entrees d'air") || v.includes("autoreglable")))
        bump("vmc", nLog, f);
      // Génération de chauffage
      const gen = txt(d.genCH && d.genCH.type_generateur_ch);
      if (gen.includes("chaudiere") && sys.energy === "Gaz naturel" && !gen.includes("condensation"))
        bump(sys.collective ? "chaudColl" : "chaudIndiv", sys.collective ? 1 : nLog, f);
      if (gen.includes("chaudiere") && sys.energy === "Fioul")
        bump(sys.collective ? "pacColl" : "pacIndiv", sys.collective ? 1 : nLog, f);
      // Émission / régulation
      const em = txt(d.emetteur && d.emetteur.type_emission_distribution);
      if (em.includes("sans robinet thermostatique")) bump("rt", 0, f);
      // ECS électrique à effet Joule
      const ecs = txt(d.genECS && d.genECS.type_generateur_ecs);
      if (ecs && !ecs.includes("thermodynamique") && !ecs.includes("solaire") && (ecs.includes("ballon") || ecs.includes("electrique")) && !sys.collective)
        bump("cet", nLog, f);
    });

    // Équipements collectifs : un générateur par bâtiment, même si plusieurs DPE de logements le décrivent.
    ["chaudColl", "pacColl"].forEach(k => { if (agg[k]) agg[k].q = agg[k].b.size; });
    const files = k => [...agg[k].files];
    const uAvg = k => { const u = agg[k].extra.filter(x => x !== null && x !== undefined); return u.length ? Core.num(Core.sum(u) / u.length, 2) : null; };
    const m2 = k => Core.num(agg[k].q, 0) + " m²";
    if (agg.ite) add("ite", "Isolation des murs par l'extérieur",
      agg.ite.n + " paroi(s) extérieure(s) non ou peu isolée(s) — " + m2("ite") + (uAvg("ite") ? " · U moyen " + uAvg("ite") + " W/m².K" : ""),
      [["ite complete"], ["isolation thermique par l'exterieur"], ["ite bardage"]], agg.ite.q, files("ite"));
    if (agg.combles) add("combles", "Isolation des combles",
      agg.combles.n + " plancher(s) haut(s) sous combles — " + m2("combles") + (uAvg("combles") ? " · U moyen " + uAvg("combles") + " W/m².K" : ""),
      [["combles perdus"], ["combles"]], agg.combles.q, files("combles"));
    if (agg.rampants) add("rampants", "Isolation des rampants",
      agg.rampants.n + " plancher(s) haut(s) en rampant — " + m2("rampants"), [["rampants"], ["combles amenages"]], agg.rampants.q, files("rampants"));
    if (agg.terrasse) add("terrasse", "Isolation et étanchéité de la toiture-terrasse",
      agg.terrasse.n + " toiture(s) terrasse — " + m2("terrasse"), [["toit-terrasse"], ["toiture terrasse"], ["etancheite"]], agg.terrasse.q, files("terrasse"));
    if (agg.pbas) add("pbas", "Isolation du plancher bas",
      agg.pbas.n + " plancher(s) bas sur local non chauffé / vide sanitaire — " + m2("pbas"), [["isolation plancher bas"], ["plancher bas"]], agg.pbas.q, files("pbas"));
    if (agg.menuiseries) add("menuiseries", "Remplacement des menuiseries",
      Core.num(agg.menuiseries.q, 0) + " baie(s) en simple vitrage ou Uw ≥ 3", [["menuiserie pvc"], ["menuiserie"]], agg.menuiseries.q, files("menuiseries"));
    if (agg.vmc) add("vmc", "Mise en place d'une VMC hygroréglable",
      "Ventilation naturelle ou autoréglable — " + Core.num(agg.vmc.q, 0) + " logement(s)", [["vmc simple flux hygro"], ["vmc simple flux"], ["vmc"]], agg.vmc.q, files("vmc"));
    if (agg.chaudColl) add("chaudColl", "Chaudière collective gaz à condensation",
      "Générateur gaz collectif sans condensation — " + agg.chaudColl.q + " bâtiment(s)", [["chaudiere collective", "condensation"]], agg.chaudColl.q, files("chaudColl"));
    if (agg.chaudIndiv) add("chaudIndiv", "Chaudières individuelles gaz à condensation",
      Core.num(agg.chaudIndiv.q, 0) + " chaudière(s) gaz sans condensation", [["chaudiere individuelle", "condensation"]], agg.chaudIndiv.q, files("chaudIndiv"));
    if (agg.pacColl) add("pacColl", "Substitution du fioul — PAC collective",
      "Chaudière fioul collective", [["pac air/eau collective"], ["pac", "collective"]], agg.pacColl.q, files("pacColl"));
    if (agg.pacIndiv) add("pacIndiv", "Substitution du fioul — PAC individuelles",
      Core.num(agg.pacIndiv.q, 0) + " chaudière(s) fioul", [["pac air/eau individuelle"], ["pac", "individuelle"]], agg.pacIndiv.q, files("pacIndiv"));
    if (agg.rt) add("rt", "Robinets thermostatiques",
      "Radiateurs à eau sans robinet thermostatique — quantité à relever sur site", [["robinets thermostatiques"], ["thermostatique"]], 0, files("rt"));
    if (agg.cet) add("cet", "Chauffe-eau thermodynamiques",
      "ECS par ballon électrique — " + Core.num(agg.cet.q, 0) + " logement(s)", [["chauffe-eau thermodynamique"], ["thermodynamique"]], agg.cet.q, files("cet"));
    return out;
  }

  /* ----------------------------------------------- Synthèse multi-DPE */
  function shorten(str, max) {
    if (str === null || str === undefined || str === "") return null;
    str = String(str).trim();
    return str.length > max ? str.slice(0, max) + "…" : str;
  }
  function simplify(t, map) {
    if (!t) return null;
    const tl = txt(t);
    for (const [key, label] of map) { if (tl.includes(norm(key))) return label; }
    return shorten(t, 45);
  }
  function countValues(recs, getter) {
    const counts = {};
    let total = 0;
    recs.forEach(r => {
      const vals = getter(r.data || {});
      (Array.isArray(vals) ? vals : [vals]).forEach(v => {
        if (v === null || v === undefined || v === "") return;
        const key = String(v).trim().slice(0, 50);
        if (!key) return;
        counts[key] = (counts[key] || 0) + 1;
        total++;
      });
    });
    return { sorted: Object.entries(counts).sort((a, b) => b[1] - a[1]), total };
  }

  function synthGroups(recs) {
    const G = (title, color, getter) => Object.assign({ title, color }, countValues(recs, getter));
    return [
      G("Matériaux des murs", "#178DD1", d => (d.murs || []).map(m => shorten(m.materiaux_structure_mur, 45))),
      G("Isolation des murs", "#7F77DD", d => (d.murs || []).map(m => m.type_isolation)),
      G("Type de plancher bas", "#0F6E56", d => (d.pbas || []).map(p => p.type_plancher_bas)),
      G("Isolation plancher bas", "#1D9E75", d => (d.pbas || []).map(p => p.type_isolation)),
      G("Plancher haut / toiture", "#D4537E", d => (d.phauts || []).map(p => simplify(p.type_adjacence, [
        ["mitoyen", "Plancher mitoyen"], ["terrasse", "Terrasse"], ["combles", "Combles"],
        ["toit", "Toiture"], ["non déperditif", "Non déperditif"], ["chauffé", "Local chauffé"]]))),
      G("Type de vitrage", "#178DD1", d => (d.baies || []).map(b => b.type_vitrage)),
      G("Menuiseries", "#EF9F27", d => (d.baies || []).map(b => b.type_materiaux_menuiserie)),
      G("Fermetures", "#D85A30", d => (d.baies || []).map(b => simplify(b.type_fermeture, [
        ["volet roul", "Volets roulants"], ["volets battants", "Volets battants"],
        ["persiennes", "Persiennes / jalousies"], ["jalousie", "Persiennes / jalousies"],
        ["sans fermeture", "Sans fermeture"], ["absence", "Sans fermeture"]]))),
      G("Ventilation", "#5DCAA5", d => simplify((d.vmc || {}).type_ventilation, [
        ["vmc sf", "VMC SF (simple flux)"], ["vmc df", "VMC DF (double flux)"],
        ["hygro b", "VMC hygroréglable B"], ["hygro a", "VMC hygroréglable A"],
        ["hygro", "VMC hygroréglable"], ["naturelle", "Ventilation naturelle"],
        ["autoréglable", "VMC SF autoréglable"]])),
      G("Générateur de chauffage", "#D85A30", d => simplify((d.genCH || {}).type_generateur_ch, [
        ["condensation", "Chaudière condensation"], ["basse température", "Chaudière basse température"],
        ["chaudière", "Chaudière autre"], ["pac air/eau", "PAC air/eau"],
        ["pac air/air", "PAC air/air"], ["pompe à chaleur", "Pompe à chaleur"],
        ["électrique", "Chauffage électrique"], ["poêle", "Poêle"], ["insert", "Insert"]])),
      G("Énergie de chauffage", "#EF9F27", d => (d.genCH || {}).type_energie),
      G("Système ECS", "#178DD1", d => simplify((d.genECS || {}).type_generateur_ecs, [
        ["thermodynamique", "Chauffe-eau thermodynamique"], ["solaire", "Solaire"],
        ["électrique", "Chauffe-eau électrique"], ["mixte", "Générateur mixte (ch + ECS)"],
        ["chaudière", "Chaudière ECS"]])),
    ];
  }

  function classDistribution(recs) {
    const dist = {};
    recs.forEach(r => { const c = summary(r.data).cls; if (c) dist[c] = (dist[c] || 0) + 1; });
    return dist;
  }

  function avg(recs, fn) {
    const vals = recs.map(r => fn(summary(r.data), r.data)).filter(v => v !== null && v !== undefined && !isNaN(v) && v > 0);
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  }

  /** Postes de déperdition (W/K) — la part est calculée sur leur somme. */
  const LOSS_ITEMS = [
    ["Murs", "deperdition_mur", "#178DD1"],
    ["Plancher bas", "deperdition_plancher_bas", "#1D9E75"],
    ["Plancher haut", "deperdition_plancher_haut", "#7F77DD"],
    ["Baies vitrées", "deperdition_baie_vitree", "#EF9F27"],
    ["Portes", "deperdition_porte", "#D85A30"],
    ["Ponts thermiques", "deperdition_pont_thermique", "#D4537E"],
    ["Renouvellement d'air", "deperdition_renouvellement_air", "#5A7A8C"],
  ];
  function losses(recs) {
    const rows = LOSS_ITEMS.map(([label, key, color]) => ({
      label, key, color, value: Core.sum(recs, r => numOf((r.data.sortie || {})[key]) || 0),
    }));
    const total = Core.sum(rows, r => r.value);
    rows.forEach(r => { r.pct = total > 0 ? r.value / total * 100 : 0; });
    return { rows, total };
  }

  return {
    readFile, parse, record, summary, metrics, dwellings, projectPrefill, energyBaseline,
    suggestions, synthGroups, classDistribution, avg, losses, systemsOf, deptFromCp,
    extWalls, roofs, lowFloors, numOf, pick, pickNum, fmtDate,
    LETTERS, EP_T, GES_T, COLORS, GES_COLORS, LOSS_ITEMS,
  };
})();

/* =========================================================================
 * 06 — AUTH : session locale et rôles (§24).
 *
 * ⚠️ Honnêteté technique : en mode local (données dans le navigateur), il
 * n'existe pas de secret côté serveur. Les rôles pilotent l'interface et
 * les garde-fous métier, PAS une frontière de sécurité. L'authentification
 * réelle (mot de passe, RLS par rôle) est fournie par Supabase Auth dans
 * le dépôt Next.js livré à côté. C'est indiqué à l'utilisateur dans
 * l'écran Paramètres → Utilisateurs.
 * ========================================================================= */
const Auth = (() => {
  "use strict";
  const SESSION_KEY = "bet_chiffrage_session";

  const ROLES = {
    admin: {
      label: "Administrateur",
      desc: "Catalogue, référentiels, utilisateurs et projets",
      can: { catalogWrite: true, projectWrite: true, settingsWrite: true, usersWrite: true, export: true },
    },
    ingenieur: {
      label: "Ingénieur / Chargé d'études",
      desc: "Crée et modifie les projets, consulte le catalogue",
      can: { catalogWrite: false, projectWrite: true, settingsWrite: false, usersWrite: false, export: true },
    },
    consultation: {
      label: "Consultation",
      desc: "Lecture seule et exports",
      can: { catalogWrite: false, projectWrite: false, settingsWrite: false, usersWrite: false, export: true },
    },
  };

  let current = null;

  function restore() {
    // Compte connecté (Supabase) : il fait foi pour le nom et le rôle.
    const cp = typeof Cloud !== "undefined" ? Cloud.profile() : null;
    if (cp) {
      current = { id: cp.id, name: cp.full_name || cp.email, email: cp.email, role: cp.role, active: true };
      return current;
    }
    let id = null;
    try { id = localStorage.getItem(SESSION_KEY); } catch (e) { /* stockage refusé */ }
    const users = Repo.users.all();
    current = (id && users.find(u => u.id === id)) || users.find(u => u.role === "admin") || users[0] || null;
    return current;
  }

  function signIn(userId) {
    const u = Repo.users.get(userId);
    if (!u) throw new Error("Utilisateur inconnu");
    if (!u.active) throw new Error("Compte désactivé");
    current = u;
    try { localStorage.setItem(SESSION_KEY, u.id); } catch (e) { /* ignore */ }
    Core.Bus.emit("auth:changed", u);
    return u;
  }

  const user = () => current;
  const name = () => (current ? current.name : "—");
  const role = () => (current ? current.role : "consultation");
  const roleLabel = () => (ROLES[role()] || ROLES.consultation).label;

  /** Autorisation métier. `can("catalogWrite")` */
  function can(action) {
    const r = ROLES[role()] || ROLES.consultation;
    return !!r.can[action];
  }

  /** Garde d'action : affiche un message si le rôle ne permet pas l'opération. */
  function require(action, message) {
    if (can(action)) return true;
    UI.toast(message || "Votre rôle (" + roleLabel() + ") ne permet pas cette action.", "warn");
    return false;
  }

  return { ROLES, restore, signIn, user, name, role, roleLabel, can, require };
})();

    file: "M6 3h8l5 5v13H6V3Zm8 0v5h5",
    star: "m12 4 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8L12 4Z",
    lock: "M6 11h12v9H6v-9Zm3 0V7a3 3 0 0 1 6 0v4",
    refresh: "M4 12a8 8 0 0 1 13.7-5.7L20 8M20 4v4h-4m4 4a8 8 0 0 1-13.7 5.7L4 16m0 4v-4h4",
    external: "M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5",
    gauge: "M3.5 17a9 9 0 1 1 17 0M12 17l4.5-6M8 20h8",
    wand: "M4 20 15 9m2-5v3m-1.5-1.5h3M20 10v2m-1-1h2M9 3v2M8 4h2",
  };

  function icon(name, size = 16, cls = "") {
    const d = PATHS[name] || PATHS.info;
    return `<svg class="ic ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
      aria-hidden="true">${d.split("|").map(p => `<path d="${p}"/>`).join("")}</svg>`;
  }

  /* -------------------------------------------------------------- Notifications */
  function toast(message, type = "ok", ms = 3200) {
    let host = document.querySelector(".toasts");
    if (!host) { host = document.createElement("div"); host.className = "toasts"; document.body.appendChild(host); }
    const el = document.createElement("div");
    el.className = "toast " + type;
    el.setAttribute("role", "status");
    el.innerHTML = Core.esc(message);
    host.appendChild(el);
    setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 200); }, ms);
  }

  /* ------------------------------------------------------------------ Modales */
  let modalStack = [];

  function modal({ title, sub, body, footer, size = "", onMount, onClose }) {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `
      <div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${Core.esc(title || "")}">
        <div class="modal-head">
          <div>
            <h3>${Core.esc(title || "")}</h3>
            ${sub ? `<div class="sub">${Core.esc(sub)}</div>` : ""}
          </div>
          <button class="btn btn-ghost btn-icon spacer" data-modal-close aria-label="Fermer">${icon("x", 18)}</button>
        </div>
        <div class="modal-body">${body || ""}</div>
        ${footer === null ? "" : `<div class="modal-foot">${footer || `<button class="btn" data-modal-close>Fermer</button>`}</div>`}
      </div>`;
    document.body.appendChild(overlay);
    document.body.style.overflow = "hidden";

    const close = (result) => {
      overlay.remove();
      modalStack = modalStack.filter(m => m.overlay !== overlay);
      if (!modalStack.length) document.body.style.overflow = "";
      if (onClose) onClose(result);
    };
    overlay.addEventListener("click", e => {
      if (e.target === overlay) close(null);
      if (e.target.closest("[data-modal-close]")) close(null);
    });
    modalStack.push({ overlay, close });
    const first = overlay.querySelector("input, select, textarea, button:not([data-modal-close])");
    if (first) setTimeout(() => first.focus(), 30);
    if (onMount) onMount(overlay, close);
    return { el: overlay, close };
  }

  function closeTopModal() {
    const m = modalStack[modalStack.length - 1];
    if (m) m.close(null);
  }

  /** Confirmation obligatoire avant toute suppression (§26). */
  function confirm({ title, message, confirmLabel = "Confirmer", danger = false, detail = "" }) {
    return new Promise(resolve => {
      let settled = false;
      const m = modal({
        title, size: "narrow",
        body: `<p class="small">${Core.esc(message)}</p>${detail ? `<div class="notice warn">${icon("alert", 16)}<div>${Core.esc(detail)}</div></div>` : ""}`,
        footer: `<button class="btn" data-modal-close>Annuler</button>
                 <button class="btn ${danger ? "btn-danger" : "btn-primary"}" data-confirm-yes>${Core.esc(confirmLabel)}</button>`,
        onClose: () => { if (!settled) { settled = true; resolve(false); } },
      });
      m.el.querySelector("[data-confirm-yes]").addEventListener("click", () => {
        settled = true; m.close(); resolve(true);
      });
    });
  }

  /* ------------------------------------------- Délégation d'événements globale */
  const Actions = {};   // clic
  const Inputs = {};    // saisie (input)
  const Changes = {};   // changement (change)

  function register(map, into) { Object.assign(into, map); }

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const fn = Actions[el.dataset.act];
    if (!fn) return;
    e.preventDefault();
    try { fn(el.dataset, el, e); } catch (err) { console.error(err); toast("Erreur : " + err.message, "err", 5000); }
  });
  document.addEventListener("input", e => {
    const el = e.target.closest("[data-inp]");
    if (!el) return;
    const fn = Inputs[el.dataset.inp];
    if (fn) { try { fn(el.dataset, el, e); } catch (err) { console.error(err); } }
  });
  document.addEventListener("change", e => {
    const el = e.target.closest("[data-chg]");
    if (!el) return;
    const fn = Changes[el.dataset.chg];
    if (fn) { try { fn(el.dataset, el, e); } catch (err) { console.error(err); toast("Erreur : " + err.message, "err", 5000); } }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && modalStack.length) { e.preventDefault(); closeTopModal(); }
  });

  /* ---------------------------------------------------- Aides de rendu de champs */
  const opt = (v, label, sel) => `<option value="${Core.esc(v)}"${String(sel) === String(v) ? " selected" : ""}>${Core.esc(label)}</option>`;

  function field(label, inputHtml, hint) {
    return `<div class="field"><label>${Core.esc(label)}</label>${inputHtml}${hint ? `<span class="hint">${Core.esc(hint)}</span>` : ""}</div>`;
  }
  function textInput(name, value, attrs = "") {
    return `<input class="inp" name="${name}" value="${Core.esc(value ?? "")}" ${attrs}>`;
  }
  function numInput(name, value, attrs = "") {
    return `<input class="inp num" name="${name}" type="number" step="any" value="${value === "" || value === null || value === undefined ? "" : value}" ${attrs}>`;
  }
  function selectInput(name, options, value, attrs = "") {
    return `<select class="inp" name="${name}" ${attrs}>${options.map(o =>
      Array.isArray(o) ? opt(o[0], o[1], value) : opt(o, o, value)).join("")}</select>`;
  }
  function textArea(name, value, attrs = "") {
    return `<textarea class="inp" name="${name}" ${attrs}>${Core.esc(value ?? "")}</textarea>`;
  }

  /** Lit un formulaire en objet {name: value}. */
  function readForm(root) {
    const out = {};
    root.querySelectorAll("input[name], select[name], textarea[name]").forEach(el => {
      if (el.type === "checkbox") out[el.name] = el.checked;
      else if (el.type === "radio") { if (el.checked) out[el.name] = el.value; }
      else if (el.multiple) out[el.name] = Array.from(el.selectedOptions).map(o => o.value);
      else out[el.name] = el.value;
    });
    return out;
  }

  /** Petit tableau de tri réutilisable. */
  function sortState(initialKey, dir = "asc") {
    return { key: initialKey, dir };
  }
  function applySort(rows, st, accessors) {
    if (!st.key) return rows;
    const acc = accessors[st.key] || (r => r[st.key]);
    const s = rows.slice().sort((a, b) => Core.cmp(acc(a), acc(b)));
    return st.dir === "desc" ? s.reverse() : s;
  }
  function sortTh(label, key, st, cls = "") {
    const arrow = st.key === key ? (st.dir === "asc" ? " ↑" : " ↓") : "";
    return `<th class="sortable ${cls}" data-act="sort" data-key="${key}">${Core.esc(label)}${arrow}</th>`;
  }

  return {
    icon, toast, modal, confirm, closeTopModal,
    Actions, Inputs, Changes, register,
    field, textInput, numInput, selectInput, textArea, opt, readForm,
    sortState, applySort, sortTh,
  };
})();

 *   « admin-users », qui seule détient la clé de service).

 *   à sa première connexion.
 * · Chacun peut ensuite changer son mot de passe depuis « Mon compte ».
 * La clé ci-dessous est la clé publique (anon) du projet : elle est faite
 * pour être dans le navigateur, les droits sont portés par les politiques RLS.
 * ========================================================================= */
const Cloud = (() => {
  "use strict";
  const SUPABASE_URL = "https://wibcbxhgkpiylphdycez.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpYmNieGhna3BpeWxwaGR5Y2V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4OTA2NTksImV4cCI6MjEwNDQ2NjY1OX0.700NEbRM3e9YG23ph4b1to7E3pOT_N20iSdOEh3hSuw";
  const MIN_PWD = 8;

  let sb = null, session = null, profile = null;

  function client() {
    if (sb) return sb;
    if (!window.supabase || !window.supabase.createClient) {
      throw new Error("Le service de connexion n'a pas pu être chargé. Vérifiez votre connexion internet puis rechargez la page.");
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: "bet_chiffrage_auth" },
    });
    return sb;
  }

  /** Messages d'erreur Supabase → français. */
  function frMsg(e) {
    const m = String((e && e.message) || e || "");
    if (/invalid login credentials/i.test(m)) return "E-mail ou mot de passe incorrect.";
    if (/banned/i.test(m)) return "Ce compte a été désactivé. Contactez l'administrateur.";
    if (/email not confirmed/i.test(m)) return "Adresse e-mail non confirmée.";
    if (/should be different/i.test(m)) return "Le nouveau mot de passe doit être différent de l'ancien.";
    if (/weak|at least|characters/i.test(m)) return "Mot de passe trop faible : " + MIN_PWD + " caractères minimum.";
    if (/failed to fetch|network/i.test(m)) return "Serveur injoignable. Vérifiez votre connexion internet.";
    if (/rate limit|too many/i.test(m)) return "Trop de tentatives. Patientez une minute puis réessayez.";
    return m || "Erreur inconnue.";
  }

  async function loadProfile() {
    if (!session) { profile = null; return null; }
    const { data, error } = await client().from("profiles")
      .select("id, email, full_name, role, status, must_change_password")
      .eq("id", session.user.id).maybeSingle();
    if (error) throw new Error(frMsg(error));
    profile = data;
    return data;
  }

  async function restore() {
    const { data } = await client().auth.getSession();
    session = data.session;
    if (session) {
      try { await loadProfile(); } catch (e) { profile = null; }
      if (!profile || profile.status !== "active") { await signOut(); }
    }
    return session;
  }

  async function signIn(email, password) {
    const { data, error } = await client().auth.signInWithPassword({ email: String(email).trim(), password });
    if (error) throw new Error(frMsg(error));
    session = data.session;
    await loadProfile();
    if (!profile) { await signOut(); throw new Error("Aucun profil associé à ce compte."); }
    if (profile.status !== "active") {
      const st = profile.status;
      await signOut();
      throw new Error(st === "pending" ? "Ce compte attend la validation d'un administrateur." : "Ce compte a été désactivé.");
    }
    return profile;
  }

  function checkNew(pwd, confirm) {
    if (!pwd || pwd.length < MIN_PWD) return "Le mot de passe doit contenir au moins " + MIN_PWD + " caractères.";
    if (!/[A-Za-zÀ-ÿ]/.test(pwd) || !/\d/.test(pwd)) return "Utilisez au moins une lettre et un chiffre.";
    if (confirm !== undefined && pwd !== confirm) return "Les deux mots de passe ne correspondent pas.";
    return null;
  }

  /** Changement de mot de passe. `current` est vérifié s'il est fourni. */
  async function changePassword(current, next) {
    if (!session) throw new Error("Session expirée : reconnectez-vous.");
    if (current !== null && current !== undefined) {
      const { error } = await client().auth.signInWithPassword({ email: session.user.email, password: current });
      if (error) throw new Error(/invalid login/i.test(error.message) ? "Mot de passe actuel incorrect." : frMsg(error));
    }
    const { error } = await client().auth.updateUser({ password: next });
    if (error) throw new Error(frMsg(error));
    const { error: e2 } = await client().rpc("mark_password_changed");
    if (e2) console.warn(e2);
    if (profile) profile.must_change_password = false;
  }

  async function signOut() {
    try { await client().auth.signOut(); } catch (e) { /* ignore */ }
    session = null; profile = null;
  }

  /** Appel de la fonction serveur d'administration des comptes. */
  async function admin(action, payload = {}) {
    const { data, error } = await client().functions.invoke("admin-users", { body: Object.assign({ action }, payload) });
    if (error) {
      let m = error.message;
      try { const b = await error.context.json(); if (b && b.error) m = b.error; } catch (e) { /* corps non JSON */ }
      throw new Error(frMsg(m));
    }
    if (data && data.error) throw new Error(data.error);
    return data;
  }

  /** Mot de passe provisoire lisible (sans caractères ambigus). */
  function tempPassword() {
    const L = "abcdefghjkmnpqrstuvwxyz", U = "ABCDEFGHJKLMNPQRSTUVWXYZ", D = "23456789";
    const all = L + U + D;
    const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
    let s = U[rnd(U.length)] + L[rnd(L.length)] + D[rnd(D.length)];
    while (s.length < 12) s += all[rnd(all.length)];
    return s.split("").sort(() => rnd(3) - 1).join("");
  }

  /* ------------------------------------------------------------ Support */
  const SUPPORT_EMAIL = "oufaaiz.saad@gmail.com";
  const KINDS = {
    creation_compte: "Demande de création de compte",
    mot_de_passe: "Mot de passe oublié",
    question: "Question sur l'outil",
    probleme: "Signaler un problème",
    autre: "Autre demande",
  };

  /**
   * Dépose une demande de support : enregistrée dans la base (visible par les
   * administrateurs dans l'application) ET envoyée par e-mail à l'administrateur.
   * Retourne { saved, mailed }.
   */
  async function support(req) {
    const payload = {
      kind: KINDS[req.kind] ? req.kind : "autre",
      full_name: String(req.full_name || "").trim().slice(0, 120),
      email: String(req.email || "").trim().toLowerCase().slice(0, 200),
      company: String(req.company || "").trim().slice(0, 160),
      message: String(req.message || "").trim().slice(0, 4000),
    };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(payload.email)) throw new Error("Adresse e-mail invalide.");
    let saved = false, mailed = false;
    try {
      const { error } = await client().from("support_requests").insert(payload);
      if (error) throw error;
      saved = true;
    } catch (e) { console.warn("Enregistrement de la demande impossible", e); }
    try {
      const r = await fetch("https://formsubmit.co/ajax/" + SUPPORT_EMAIL, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({
          _subject: "[BET Chiffrage] " + KINDS[payload.kind] + " — " + (payload.full_name || payload.email),
          _template: "table", _replyto: payload.email,
          "Objet": KINDS[payload.kind], "Nom": payload.full_name || "—", "E-mail": payload.email,
          "Société": payload.company || "—", "Message": payload.message || "—",
          "Envoyé le": new Date().toLocaleString("fr-FR"),
        }),
      });
      const j = await r.json().catch(() => ({}));
      mailed = r.ok && String(j.success) !== "false";
    } catch (e) { console.warn("Envoi e-mail impossible", e); }
    if (!saved && !mailed) throw new Error("Envoi impossible (connexion internet ?). Écrivez directement à " + SUPPORT_EMAIL + ".");
    return { saved, mailed };
  }

  function mailtoFor(req) {
    const subject = "[BET Chiffrage] " + (KINDS[req.kind] || "Demande");
    const body = `Nom : ${req.full_name || ""}\nE-mail : ${req.email || ""}\nSociété : ${req.company || ""}\n\n${req.message || ""}`;
    return "mailto:" + SUPPORT_EMAIL + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
  }

  return {
    support, mailtoFor, KINDS, SUPPORT_EMAIL,
    client, restore, signIn, signOut, changePassword, checkNew, admin, tempPassword, loadProfile, frMsg,
    profile: () => profile, session: () => session, MIN_PWD,
  };
})();

/* ------------------------------------------------------------------------
 * Visuel de la page d'accueil : photo choisie par l'administrateur
 * (stockée dans Supabase), ou à défaut une illustration « thermographie »
 * d'immeuble dessinée en SVG.
 * ---------------------------------------------------------------------- */
const Hero = (() => {
  "use strict";
  const CACHE = "bet_hero_v1";

  function cached() { try { return JSON.parse(localStorage.getItem(CACHE) || "null"); } catch (e) { return null; } }
  function remember(v) { try { v ? localStorage.setItem(CACHE, JSON.stringify(v)) : localStorage.removeItem(CACHE); } catch (e) { /* ignore */ } }

  /** Réglage public « hero » : { url, position, credit }. */
  async function fetchSetting() {
    try {
      const { data, error } = await Cloud.client().from("site_settings").select("value").eq("key", "hero").maybeSingle();
      if (error) throw error;
      const v = data && data.value && data.value.url ? data.value : null;
      remember(v);
      return v;
    } catch (e) { return cached(); }
  }

  /** Réduit la photo (2400 px max, JPEG) avant l'envoi. */
  function compress(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const max = 2400, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => (b ? resolve(b) : reject(new Error("Image illisible"))), "image/jpeg", 0.86);
        URL.revokeObjectURL(img.src);
      };
      img.onerror = () => reject(new Error("Format d'image non reconnu"));
      img.src = URL.createObjectURL(file);
    });
  }

  async function upload(file, position, credit) {
    const blob = await compress(file);
    const path = "hero/accueil-" + Date.now() + ".jpg";
    const sb = Cloud.client();
    const { error } = await sb.storage.from("site").upload(path, blob, { contentType: "image/jpeg", upsert: true, cacheControl: "31536000" });
    if (error) throw new Error(Cloud.frMsg(error));
    const url = sb.storage.from("site").getPublicUrl(path).data.publicUrl;
    return save({ url, position: position || "center", credit: credit || "", path });
  }

  async function save(v) {
    const { error } = await Cloud.client().from("site_settings")
      .upsert({ key: "hero", value: v || {}, updated_at: new Date().toISOString(), updated_by: (Cloud.profile() || {}).id });
    if (error) throw new Error(Cloud.frMsg(error));
    remember(v && v.url ? v : null);
    return v;
  }

  async function reset() {
    const cur = cached();
    await save({});
    if (cur && cur.path) { try { await Cloud.client().storage.from("site").remove([cur.path]); } catch (e) { /* ignore */ } }
  }

  /* --------------------------------------------- Illustration par défaut */
  function illustration() {
    // Immeuble de 7 niveaux, moitié gauche « visible », moitié droite en thermographie.
    const X = 150, Y = 250, W = 520, FL = 7, FH = 88, COLS = 6;
    const H = FL * FH;
    const colW = W / COLS;
    let winV = "", winT = "", slabs = "", balc = "";
    const heat = (f, c) => {
      // Pertes plus fortes en haut (toiture) et sur certaines baies (simple vitrage).
      const base = 0.35 + (FL - f) * 0.06 + ((c * 7 + f * 3) % 5 === 0 ? 0.35 : 0);
      return Math.min(1, base);
    };
    const thermal = t => (t > 0.85 ? "#FFF2B3" : t > 0.7 ? "#FFC54A" : t > 0.55 ? "#FF8A3D" : t > 0.45 ? "#E8483B" : "#B2306B");
    for (let f = 0; f < FL; f++) {
      const y = Y + f * FH + 20;
      for (let c = 0; c < COLS; c++) {
        const x = X + c * colW + colW * 0.24, w = colW * 0.52, h = FH * 0.58;
        const lit = (c * 3 + f * 5) % 7 < 2;
        winV += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${lit ? "url(#lit)" : "#1C3342"}"/>`
          + `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="none" stroke="#EDE3D2" stroke-opacity=".55" stroke-width="2"/>`
          + `<line x1="${x + w / 2}" y1="${y}" x2="${x + w / 2}" y2="${y + h}" stroke="#EDE3D2" stroke-opacity=".45" stroke-width="1.5"/>`;
        const t = heat(f, c);
        winT += `<rect x="${x - 6}" y="${y - 6}" width="${w + 12}" height="${h + 12}" rx="6" fill="${thermal(t)}" filter="url(#glow)" opacity=".7"/>`
          + `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${thermal(Math.min(1, t + 0.12))}"/>`
          + `<line x1="${x + w / 2}" y1="${y}" x2="${x + w / 2}" y2="${y + h}" stroke="#7A1F55" stroke-opacity=".5" stroke-width="1.5"/>`;
        if (f > 0 && f < FL - 1 && (f === 1 || f === 4)) {
          balc += `<rect x="${x - 6}" y="${y + h + 4}" width="${w + 12}" height="5" fill="#2A3B45" opacity=".75"/>`;
        }
      }
      if (f > 0) slabs += `<rect x="${X}" y="${Y + f * FH - 3}" width="${W}" height="6" fill="#FF9A45" opacity=".75" filter="url(#glow)"/>`;
    }
    return `<svg class="hero-svg" viewBox="0 0 820 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0E2230"/><stop offset=".55" stop-color="#1B4E63"/><stop offset=".86" stop-color="#C9825A"/><stop offset="1" stop-color="#F0B679"/>
        </linearGradient>
        <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E6DAC6"/><stop offset="1" stop-color="#B9A88F"/>
        </linearGradient>

const Gate = (() => {
  "use strict";
  const esc = s => Core.esc(s);
  const root = () => document.getElementById("app");

  const brand = `<div class="row" style="gap:10px;margin-bottom:18px">

  function frame(inner) {
