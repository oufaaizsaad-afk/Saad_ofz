  /* ========================================================== Import */
  async function importFiles(scope, files) {
    if (!Auth.require("projectWrite")) return;
    files = (files || []).filter(f => /\.xlsx?$/i.test(f.name));
    if (!files.length) return UI.toast("Sélectionnez des fichiers Excel DPE (.xlsx).", "warn");
    const list = listFor(scope);
    let ok = 0, last = null;
    const errs = [];
    if (files.length > 1) UI.toast("Lecture de " + files.length + " fichiers…", "ok", 1400);
    for (const f of files) {
      if (list.some(r => r.fileName === f.name)) { errs.push(f.name + " : déjà importé, ignoré."); continue; }
      try {
        const rec = await Dpe.readFile(f);
        list.push(rec); ok++; last = rec;
      } catch (e) {
        console.error(e);
        errs.push(f.name + " : " + e.message);
      }
    }
    if (ok) {
      const p = projectOf(scope);
      if (p && (p.buildings || []).length === 1) list.forEach(r => { if (!r.buildingId) r.buildingId = p.buildings[0].id; });
      await persist(scope);
      st(scope).sel = ok > 1 ? "synth" : last.id;
      st(scope).sub = "gen";
      UI.toast(ok + " DPE importé" + (ok > 1 ? "s" : "") + ".", "ok");
    }
    errs.forEach(e => UI.toast(e, "warn", 7000));
    App.render();
  }

  /** Glisser-déposer sur les zones d'import (appelé après chaque rendu). */
  function bindDrops(root) {
    (root || document).querySelectorAll("[data-dpe-drop]").forEach(el => {
      const scope = el.dataset.dpeDrop;
      el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("drag"); });
      el.addEventListener("dragleave", () => el.classList.remove("drag"));
      el.addEventListener("drop", e => {
        e.preventDefault(); el.classList.remove("drag");
        importFiles(scope, Array.from((e.dataTransfer && e.dataTransfer.files) || []));
      });
      el.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); }
      });
    });
  }

  /* ================================================ Passerelles chiffrage */
  function measurement(value, recs) {
    return Schema.measurement({
      value, origin: "import", by: Auth.name(),
      sourceFile: "DPE : " + recs.map(r => r.fileName.replace(/\.xlsx?$/i, "")).join(", ").slice(0, 160),
    });
  }

  /** Écrit les métrés DPE dans un bâtiment. `keys` = métrés à écrire. */
  function applyMetrics(b, recs, keys) {
    const m = Dpe.metrics(recs);
    let n = 0;
    keys.forEach(k => {
      if (!(m[k] > 0)) return;
      if (k === "nbBaies") {
        b.customMetrics = b.customMetrics || [];
        let cm = b.customMetrics.find(x => x.label === BAIES_LABEL);
        if (!cm) { cm = { label: BAIES_LABEL, unit: "unité" }; b.customMetrics.push(cm); }
        cm.measure = measurement(m[k], recs);
      } else {
        b.metrics = b.metrics || {};
        b.metrics[k] = measurement(m[k], recs);
      }
      n++;
    });
    return n;
  }

  /* ------------------------------------------------- Fiche projet */
  function ficheDialog(p) {
    const pre = Dpe.projectPrefill(p.dpes);
    const fields = [
      ["address", "Adresse", "text"], ["postalCode", "Code postal", "text"], ["city", "Ville", "text"],
      ["department", "Département", "text"], ["constructionYear", "Année de construction", "text"],
      ["livingArea", "Surface habitable (m²)", "num"], ["nbDwellings", "Nombre de logements", "num"],
      ["nbLevels", "Nombre de niveaux", "num"], ["heatingType", "Type de chauffage", "text"],
      ["dhwType", "Type d'ECS", "text"], ["energy", "Énergie utilisée", "text"],
    ];
    const rows = fields.map(([k, label, type]) => {
      const cur = p[k], nv = pre[k];
      const empty = v => v === null || v === undefined || v === "" || (type === "num" && !Core.parseNum(v));
      if (empty(nv)) return null;
      const same = type === "num" ? Core.round(Core.parseNum(cur), 2) === Core.round(Core.parseNum(nv), 2) : String(cur || "").trim() === String(nv).trim();
      return { k, label, type, cur, nv, same, checked: !same && empty(cur) };
    }).filter(Boolean);
    const fmt = (v, type) => (v === null || v === undefined || v === "" || (type === "num" && !Core.parseNum(v)))
      ? `<span class="muted-3">—</span>` : esc(type === "num" ? num(v, 2) : v);
    const m = UI.modal({
      title: "Pré-remplir la fiche projet", sub: "Valeurs issues de " + p.dpes.length + " DPE", size: "wide",
      body: rows.length ? `
        <p class="small muted">Cochez les champs à reprendre. Par défaut, seuls les champs vides de la fiche sont cochés :
          aucune saisie existante n'est écrasée sans votre accord.</p>
        <div class="table-wrap" style="border:1px solid var(--c-line)"><table class="tbl">
          <thead><tr><th style="width:34px"></th><th>Champ</th><th>Fiche actuelle</th><th>Valeur DPE</th></tr></thead>
          <tbody>${rows.map(r => `<tr class="${r.same ? "inactive" : ""}">
            <td class="c">${r.same ? `<span class="tag ok">=</span>` : `<input type="checkbox" data-fk="${r.k}"${r.checked ? " checked" : ""} aria-label="Reprendre ${esc(r.label)}">`}</td>
            <td class="strong small">${esc(r.label)}</td>
            <td class="small">${fmt(r.cur, r.type)}</td>
            <td class="small">${fmt(r.nv, r.type)}</td></tr>`).join("")}</tbody>
        </table></div>
        <p class="hint">Le nombre de logements vient du champ « nombre d'appartements » des DPE d'immeuble, sinon 1 par DPE.
          Chauffage, ECS et énergie sont déduits du premier DPE.</p>`
        : `<p class="small muted">Les DPE ne contiennent pas d'information exploitable pour la fiche.</p>`,
      footer: `<button class="btn" data-modal-close>Annuler</button>
               ${rows.length ? `<button class="btn btn-primary" data-save>${icon("check", 15)} Appliquer à la fiche</button>` : ""}`,
    });
    const btn = m.el.querySelector("[data-save]");
    if (btn) btn.addEventListener("click", async () => {
      const patch = {};
      m.el.querySelectorAll("[data-fk]").forEach(cb => {
        if (!cb.checked) return;
        const r = rows.find(x => x.k === cb.dataset.fk);
        patch[r.k] = r.type === "num" ? Core.parseNum(r.nv) : r.nv;
      });
      if (!Object.keys(patch).length) return UI.toast("Aucun champ coché.", "warn");
      await Repo.projects.update(p.id, Object.assign(patch, { updatedBy: Auth.name() }));
      await Repo.flush();
      m.close();
      UI.toast(Object.keys(patch).length + " champ(s) de la fiche mis à jour.", "ok");
      App.render();
    });
  }

  /* ------------------------------------------------- Métrés */
  function metricsDialog(p) {
    if (!(p.buildings || []).length) p.buildings.push(Schema.building({ name: "Bâtiment A" }));
    const recs = p.dpes;
    const linked = b => recs.filter(r => r.buildingId === b.id);
    const hasLinks = p.buildings.some(b => linked(b).length);
    let mode = hasLinks ? "per" : "all";
    const curVal = (b, k) => {
      if (k === "nbBaies") { const cm = (b.customMetrics || []).find(x => x.label === BAIES_LABEL); return cm && cm.measure ? cm.measure.value : 0; }
      const mm = (b.metrics || {})[k]; return mm ? Core.parseNum(mm.value) : 0;
    };
    const targets = () => {
      if (mode === "per") return p.buildings.filter(b => linked(b).length).map(b => ({ b, recs: linked(b) }));
      const id = m.el.querySelector('[name="target"]').value;
      const b = p.buildings.find(x => x.id === id) || p.buildings[0];
      return [{ b, recs }];
    };
    const keysOn = () => Array.from(m.el.querySelectorAll("[data-mk]")).filter(c => c.checked).map(c => c.dataset.mk);

    const m = UI.modal({
      title: "Générer les métrés à partir des DPE", sub: p.name, size: "wide",
      body: `
        <div class="stack-sm">
          <label class="row small" style="gap:7px;cursor:pointer"><input type="radio" name="mode" value="per"${mode === "per" ? " checked" : ""}${hasLinks ? "" : " disabled"}>
            <span><strong>Par bâtiment</strong> — chaque bâtiment reçoit les métrés des DPE qui lui sont rattachés
            ${hasLinks ? "" : `<span class="muted-3">(aucun DPE rattaché : choisissez le bâtiment dans l'en-tête de chaque DPE)</span>`}</span></label>
          <label class="row small" style="gap:7px;cursor:pointer"><input type="radio" name="mode" value="all"${mode === "all" ? " checked" : ""}>
            <span><strong>Tous les DPE</strong> vers le bâtiment</span>
            <select class="inp" name="target" style="width:auto">${p.buildings.map(b => `<option value="${esc(b.id)}">${esc(b.name)}</option>`).join("")}</select></label>
        </div>
        <div class="chip-row">${METRIC_KEYS.map(([k, l]) => `<label class="chip" style="display:inline-flex;gap:6px;align-items:center">
          <input type="checkbox" data-mk="${k}" checked> ${esc(l)}</label>`).join("")}</div>
        <div id="mt-prev"></div>
        <div class="notice">${icon("info", 15)}<div>
          ${METRIC_KEYS.map(([, l, , rule]) => `<strong>${esc(l)}</strong> : ${esc(rule)}`).join(" · ")}.
          Les métrés sont marqués « import » avec le nom des DPE sources. Des DPE de logements individuels ne couvrent
          que les logements diagnostiqués : complétez ou ajustez ensuite dans « Bâtiments & métrés ».</div></div>`,
      footer: `<button class="btn" data-modal-close>Annuler</button>
               <button class="btn btn-primary" data-save>${icon("check", 15)} Écrire les métrés</button>`,
    });

    const preview = () => {
      const on = new Set(keysOn());
      m.el.querySelector("#mt-prev").innerHTML = targets().map(({ b, recs: rr }) => {
        const mv = Dpe.metrics(rr);
        return `<div class="card"><div class="card-head"><h3>${esc(b.name)}</h3><span class="spacer xsmall muted-3">${rr.length} DPE</span></div>
          <table class="tbl"><thead><tr><th>Métré</th><th class="r">Valeur actuelle</th><th class="r">Valeur DPE</th><th></th></tr></thead>
          <tbody>${METRIC_KEYS.map(([k, l, u]) => {
            const cv = curVal(b, k), nv = mv[k];
            return `<tr class="${on.has(k) && nv > 0 ? "" : "inactive"}"><td class="small">${esc(l)}</td>
              <td class="num r small muted">${cv ? num(cv, 2) + " " + esc(u) : "—"}</td>
              <td class="num r small strong">${nv > 0 ? num(nv, 2) + " " + esc(u) : "—"}</td>
              <td class="small">${on.has(k) && nv > 0 ? (cv && Core.round(cv, 2) !== Core.round(nv, 2) ? `<span class="tag warn">remplacé</span>` : cv ? `<span class="tag ok">identique</span>` : `<span class="tag accent">nouveau</span>`) : ""}</td></tr>`;
          }).join("")}</tbody></table></div>`;
      }).join("") || `<p class="hint">Aucun bâtiment cible.</p>`;
    };
    m.el.addEventListener("change", e => {
      if (e.target.name === "mode") mode = e.target.value;
      preview();
    });
    preview();

    m.el.querySelector("[data-save]").addEventListener("click", async () => {
      const keys = keysOn();
      if (!keys.length) return UI.toast("Cochez au moins un métré.", "warn");
      let n = 0;
      targets().forEach(({ b, recs: rr }) => { n += applyMetrics(b, rr, keys); });
      if (!n) return UI.toast("Aucune valeur exploitable dans les DPE.", "warn");
      p.updatedAt = Core.nowIso();
      Repo.touch("projects"); await Repo.flush();
      m.close();
      UI.toast(n + " métré(s) écrit(s).", "ok");
      App.go("project", { projectId: p.id, tab: "batiments" });
    });
  }

  /* ------------------------------------------------- Préconisations */
  function suggestDialog(p) {
    const items = Repo.items.list(i => i.active !== false).sort((a, b) => Core.cmp(a.label, b.label));
    const sugg = Dpe.suggestions(p.dpes, items);
    const scns = p.scenarios || [];
    const itemOpts = sel => `<option value="">— choisir un poste —</option>` + items.map(i =>
      `<option value="${esc(i.id)}"${i.id === sel ? " selected" : ""}>${esc(i.label)} · ${esc(eur2(i.priceHT))}/${esc(i.unit)}</option>`).join("");
    const m = UI.modal({
      title: "Préconisations de travaux issues des DPE", sub: p.name + " — " + p.dpes.length + " DPE analysé(s)", size: "wide",
      body: sugg.length ? `
        <p class="small muted">Chaque préconisation est rapprochée d'un poste du catalogue ; les quantités sont tirées des métrés
          des DPE. Vérifiez, ajustez, puis ajoutez au scénario de votre choix.</p>
        <div class="table-wrap" style="border:1px solid var(--c-line);max-height:46vh;overflow-y:auto"><table class="tbl">
          <thead><tr><th style="width:30px"></th><th>Constat / préconisation</th><th style="min-width:260px">Poste du catalogue</th>
            <th class="c" style="width:110px">Quantité</th><th class="r">Total HT</th></tr></thead>
          <tbody>${sugg.map((s, i) => `<tr data-row="${i}">
            <td class="c"><input type="checkbox" data-sg="${i}"${s.checked ? " checked" : ""} aria-label="Retenir ${esc(s.title)}"></td>
            <td><div class="strong small">${esc(s.title)}</div><div class="xsmall muted-3">${esc(s.detail)}</div>
              ${s.itemId ? "" : `<span class="tag warn">aucun poste correspondant trouvé — choisissez-en un</span>`}</td>
            <td><select class="inp" data-sgi="${i}">${itemOpts(s.itemId)}</select></td>
            <td class="c"><input class="inp num" type="number" step="any" min="0" data-sgq="${i}" value="${s.qty || ""}" placeholder="à quantifier" style="width:96px"></td>
            <td class="num r" data-sgt="${i}">—</td></tr>`).join("")}</tbody>
        </table></div>
        <div class="grid-2">
          ${UI.field("Scénario de destination", `<select class="inp" name="scn">
            <option value="__new">+ Nouveau scénario « Préconisations DPE »</option>
            ${scns.map(s => `<option value="${esc(s.id)}"${s.selected ? " selected" : ""}>${esc(s.name)}</option>`).join("")}</select>`)}
          <div class="field"><label>Total des postes retenus</label><div class="stat-v accent" id="sg-tot" style="font-size:18px">—</div></div>
        </div>`
        : `<div class="notice ok">${icon("check", 15)}<div>Aucune pathologie évidente détectée dans les DPE (enveloppe isolée, ventilation mécanique,
            générateurs performants). Ajoutez librement des postes depuis l'onglet Travaux.</div></div>`,
      footer: `<button class="btn" data-modal-close>Fermer</button>
               ${sugg.length ? `<button class="btn btn-primary" data-save>${icon("plus", 15)} Ajouter au scénario</button>` : ""}`,
    });
    if (!sugg.length) return;
    const recalc = () => {
      let tot = 0;
      sugg.forEach((s, i) => {
        const it = Repo.items.get(m.el.querySelector(`[data-sgi="${i}"]`).value);
        const q = Core.parseNum(m.el.querySelector(`[data-sgq="${i}"]`).value);
        const on = m.el.querySelector(`[data-sg="${i}"]`).checked;
        const v = it ? it.priceHT * q : 0;
        m.el.querySelector(`[data-sgt="${i}"]`).textContent = it && q ? eur(v) : "—";
        m.el.querySelector(`[data-row="${i}"]`).classList.toggle("inactive", !on);
        if (on) tot += v;
      });
      m.el.querySelector("#sg-tot").textContent = eur(tot) + " HT";
    };
    m.el.addEventListener("input", recalc);
    m.el.addEventListener("change", e => {
      const sel = e.target.closest("[data-sgi]");
      if (sel && sel.value) m.el.querySelector(`[data-sg="${sel.dataset.sgi}"]`).checked = true;
      recalc();
    });
    recalc();
    m.el.querySelector("[data-save]").addEventListener("click", async () => {
      const picked = sugg.map((s, i) => ({
        s, on: m.el.querySelector(`[data-sg="${i}"]`).checked,
        it: Repo.items.get(m.el.querySelector(`[data-sgi="${i}"]`).value),
        q: Core.parseNum(m.el.querySelector(`[data-sgq="${i}"]`).value),
      })).filter(x => x.on);
      if (!picked.length) return UI.toast("Cochez au moins une préconisation.", "warn");
      if (picked.some(x => !x.it)) return UI.toast("Choisissez un poste du catalogue pour chaque préconisation cochée.", "warn");
      const target = m.el.querySelector('[name="scn"]').value;
      let sc = scns.find(s => s.id === target);
      if (!sc) {
        sc = Schema.scenario({
          name: "Préconisations DPE", selected: !scns.length,
          description: "Bouquet de travaux proposé à partir de l'analyse de " + p.dpes.length + " DPE.",
        });
        const src = scns.find(s => s.selected) || scns[0];
        if (src) {
          sc.fees = (src.fees || []).map(x => Object.assign({}, x, { id: Core.uid("fee") }));
          sc.aids = (src.aids || []).map(x => Object.assign({}, x, { id: Core.uid("aid") }));
        }
        p.scenarios.push(sc);
      }
      picked.forEach(({ s, it, q }) => {
        sc.lines.push(Schema.line({
          catalogItemId: it.id, label: it.label, categoryId: it.categoryId, unit: it.unit,
          priceHT: it.priceHT, catalogPriceHT: it.priceHT, vatRate: it.vatRate, quantity: q,
          quantityOrigin: q ? "import" : "saisie", quantityFormula: q ? "DPE — " + s.title : "",
          comment: "Préconisation DPE : " + s.detail,
        }));
      });
      p.scenarios.forEach(x => { x.selected = x.id === sc.id; });
      p.updatedAt = Core.nowIso();
      Repo.touch("projects"); await Repo.flush();
      m.close();
      UI.toast(picked.length + " poste(s) ajouté(s) à « " + sc.name + " ».", "ok");
      App.go("project", { projectId: p.id, tab: "travaux" });
    });
  }

  /* ------------------------------------------------- Hypothèses énergie */
  function ecoDialog(p) {
    const b = Dpe.energyBaseline(p.dpes);
    const e = p.economics || Schema.economics();
    const m = UI.modal({
      title: "Hypothèses énergétiques depuis les DPE", sub: p.name,
      body: `
        <table class="tbl"><thead><tr><th style="width:30px"></th><th>Hypothèse</th><th class="r">Actuelle</th><th class="r">DPE</th></tr></thead><tbody>
          <tr><td class="c"><input type="checkbox" data-ek="consoBefore"${b.conso ? " checked" : " disabled"}></td>
            <td class="small"><strong>Consommation avant travaux</strong><div class="xsmall muted-3">Somme 5 usages — ${esc(b.kind)}</div></td>
            <td class="num r small muted">${e.consoBefore ? num(e.consoBefore, 0) + " kWh/an" : "—"}</td>
            <td class="num r small strong">${b.conso ? num(b.conso, 0) + " kWh/an" : "—"}</td></tr>
          <tr><td class="c"><input type="checkbox" data-ek="energyPrice"${b.price ? " checked" : " disabled"}></td>
            <td class="small"><strong>Prix moyen de l'énergie</strong><div class="xsmall muted-3">Coût annuel DPE ÷ consommation${b.cost ? " (" + esc(eur(b.cost)) + "/an)" : ""}</div></td>
            <td class="num r small muted">${e.energyPrice ? eur2(e.energyPrice) + "/kWh" : "—"}</td>
            <td class="num r small strong">${b.price ? Core.num(b.price, 3) + " €/kWh" : "—"}</td></tr>
        </tbody></table>
        <p class="hint">Les coûts du DPE reposent sur des prix conventionnels : ajustez le prix de l'énergie si vous disposez des factures réelles.
          Le pourcentage d'économie reste propre à chaque scénario.</p>`,
      footer: `<button class="btn" data-modal-close>Annuler</button>
               <button class="btn btn-primary" data-save>${icon("check", 15)} Appliquer</button>`,
    });
    m.el.querySelector("[data-save]").addEventListener("click", async () => {
      const patch = {};
      m.el.querySelectorAll("[data-ek]").forEach(cb => {
        if (!cb.checked) return;
        patch[cb.dataset.ek] = cb.dataset.ek === "consoBefore" ? b.conso : b.price;
      });
      if (!Object.keys(patch).length) return UI.toast("Rien à appliquer.", "warn");
      p.economics = Schema.economics(Object.assign({}, e, patch));
      p.updatedAt = Core.nowIso();
      Repo.touch("projects"); await Repo.flush();
      m.close();
      UI.toast("Hypothèses énergétiques mises à jour.", "ok");
      App.go("project", { projectId: p.id, tab: "economie" });
    });
  }

  /* ------------------------------------------------- Espace → projet */
  function attachDialog() {
    const list = listFor("inbox");
    const projects = Repo.projects.list(x => x.status !== "archivé").sort((a, b) => Core.cmp(b.updatedAt, a.updatedAt));
    const m = UI.modal({
      title: "Rattacher les DPE à un projet", sub: list.length + " DPE de l'espace d'analyse",
      body: `${UI.field("Projet de destination", `<select class="inp" name="prj">${projects.map(p =>
          `<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.version)}${p.city ? " · " + esc(p.city) : ""}</option>`).join("")}</select>`)}
        <p class="hint">Les DPE sont déplacés dans l'onglet « Diagnostic DPE » du projet ; l'espace d'analyse est vidé.</p>`,
      footer: `<button class="btn" data-modal-close>Annuler</button>
               <button class="btn btn-primary" data-save>${icon("link", 15)} Rattacher</button>`,
    });
    m.el.querySelector("[data-save]").addEventListener("click", async () => {
      const p = Repo.projects.get(m.el.querySelector('[name="prj"]').value);
      if (!p) return;
      moveInboxTo(p);
      p.updatedAt = Core.nowIso();
      Repo.touch("projects"); await Repo.flush();
      m.close();
      UI.toast("DPE rattachés à « " + p.name + " ».", "ok");
      App.go("project", { projectId: p.id, tab: "dpe" });
    });
  }

  function moveInboxTo(p) {
    const inbox = listFor("inbox");
    if (!Array.isArray(p.dpes)) p.dpes = [];
    const names = new Set(p.dpes.map(r => r.fileName));
    const moved = inbox.splice(0, inbox.length).filter(r => !names.has(r.fileName));
    if ((p.buildings || []).length === 1) moved.forEach(r => { r.buildingId = p.buildings[0].id; });
    p.dpes.push(...moved);
    st(p.id).sel = moved.length > 1 ? "synth" : (moved[0] ? moved[0].id : null);
    return moved;
  }

  function toProject() {
    const list = listFor("inbox");
    if (!list.length) return;
    Views.Projects.createDialog(Dpe.projectPrefill(list), async p => {
      const moved = moveInboxTo(p);
      if ((p.buildings || []).length === 1 && moved.length) applyMetrics(p.buildings[0], moved, METRIC_KEYS.map(x => x[0]));
      return { tab: "dpe", toast: "Projet créé à partir de " + moved.length + " DPE : fiche et métrés pré-remplis." };
    });
  }

  /* ------------------------------------------------- Carte fiche projet */
  function ficheCard(p) {
    const list = p.dpes || [];
    if (!list.length) {
      return `<div class="notice">${icon("gauge", 15)}<div>Aucun DPE rattaché. Importez les exports DPE 3CL dans l'onglet
        <button class="btn btn-sm" data-act="pTab" data-tab="dpe">${icon("gauge", 13)} Diagnostic DPE</button>
        pour pré-remplir la fiche, générer les métrés et proposer des travaux.</div></div>`;
    }
    const dist = Dpe.classDistribution(list);
    const a = Dpe.avg(list, s => s.epM2);
    return `<div class="card">
      <div class="card-head"><h3>État initial — DPE</h3>
        <button class="btn btn-sm spacer" data-act="pTab" data-tab="dpe">${icon("gauge", 14)} Ouvrir le diagnostic</button></div>
      <div class="card-body row" style="gap:18px">
        <div class="row" style="gap:4px">${Dpe.LETTERS.filter(L => dist[L]).map(L => `${badge(L, "ep", "md")}<span class="mono small muted" style="margin-right:6px">×${dist[L]}</span>`).join("")}</div>
        <div><div class="lbl">DPE rattachés</div><div class="mono">${list.length}</div></div>
        <div><div class="lbl">Énergie primaire moyenne</div><div class="mono">${a ? num(a, 0) + " kWh EP/m².an" : "—"}</div></div>
        <div><div class="lbl">Surface couverte</div><div class="mono">${num(Dpe.metrics(list).livingArea, 0)} m²</div></div>
      </div></div>`;
  }

  /* ============================================================ Écran */
  function render() { return panel("inbox"); }
  function actions() {
    return `<button class="btn btn-primary" data-act="dpeImport" data-scope="inbox">${icon("upload", 15)} Importer des DPE</button>`;
  }
  function mount(page) { bindDrops(page); }

  UI.register({
    dpeSel: d => { st(d.scope).sel = d.id; App.render(); },
    dpeSub: d => { st(d.scope).sub = d.sub; App.render(); },
    dpeImport: d => {
      if (!Auth.require("projectWrite")) return;
      const inp = document.getElementById("dpe-file-" + d.scope);
      if (inp) inp.click();
    },
    dpeDel: async d => {
      if (!Auth.require("projectWrite")) return;
      const list = listFor(d.scope);
      const r = findRec(d.scope, d.id);
      if (!r) return;
      const ok = await UI.confirm({
        title: "Retirer ce DPE ?", message: r.fileName,
        detail: "Les métrés et postes déjà créés à partir de ce DPE sont conservés.", confirmLabel: "Retirer", danger: true,
      });
      if (!ok) return;
      list.splice(list.indexOf(r), 1);
      if (st(d.scope).sel === r.id) st(d.scope).sel = null;
      await persist(d.scope);
      UI.toast("DPE retiré.", "ok");
      App.render();
    },
    dpePdf: d => {
      const r = findRec(d.scope, d.id);
      const p = projectOf(d.scope);
      if (r) Reporting.dpePdf(r, p ? p.name : "Analyse DPE");
    },
    dpeSynthPdf: d => {
      const p = projectOf(d.scope);
      Reporting.dpeSynthPdf(listFor(d.scope), p ? p.name : "Analyse DPE");
    },
    dpeToProject: () => { if (Auth.require("projectWrite")) toProject(); },
    dpeAttach: () => { if (Auth.require("projectWrite")) attachDialog(); },
    dpeFiche: () => { if (Auth.require("projectWrite")) ficheDialog(App.currentProject()); },
    dpeMetrics: () => { if (Auth.require("projectWrite")) metricsDialog(App.currentProject()); },
    dpeSuggest: () => { if (Auth.require("projectWrite")) suggestDialog(App.currentProject()); },
    dpeEco: () => { if (Auth.require("projectWrite")) ecoDialog(App.currentProject()); },
  }, UI.Actions);

  UI.register({
    dpeFiles: (d, el) => { const files = Array.from(el.files || []); el.value = ""; importFiles(d.scope, files); },
    dpeBuilding: async (d, el) => {
      if (!Auth.require("projectWrite")) { App.render(); return; }
      const r = findRec(d.scope, d.id);
      if (!r) return;
      r.buildingId = el.value || null;
      await persist(d.scope);
      UI.toast(el.value ? "DPE rattaché au bâtiment." : "DPE détaché du bâtiment.", "ok", 1600);
      App.render();
    },
  }, UI.Changes);

  return { render, actions, mount, panel, bindDrops, ficheCard, badge, listFor };
})();


/* ===== 13c-view-users.js ============================================= */
/* =========================================================================
 * 13c — COMPTES UTILISATEURS (administrateurs) + « Mon compte ».
 * ========================================================================= */
Views.Users = (() => {
  "use strict";
  const { esc, dateTimeFR } = Core;
  const icon = UI.icon;
  const ROLE_LABEL = r => (Auth.ROLES[r] || {}).label || r;
  const state = { users: null, me: null, loading: false, error: "", q: "" };

  async function load() {
    state.loading = true; state.error = "";
    try { const r = await Cloud.admin("list"); state.users = r.users || []; state.me = r.me; }
    catch (e) { state.error = e.message; }
    state.loading = false;
    if (App.state.route === "users") App.render();
  }

  function actions() {
    return Auth.role() === "admin"
      ? `<button class="btn" data-act="usrReload">${icon("refresh", 15)} Actualiser</button>
         <button class="btn btn-primary" data-act="usrNew">${icon("plus", 15)} Inscrire une personne</button>` : "";
  }

  function statusTag(u) {
    if (u.status === "pending") return `<span class="tag warn">en attente</span>`;
    if (u.status === "disabled") return `<span class="tag danger">désactivé</span>`;
    return `<span class="tag ok">actif</span>`;
  }

  function render() {
    if (Auth.role() !== "admin") return Frag.empty("Accès réservé", "Seuls les administrateurs gèrent les comptes.");
    if (!state.users && !state.loading && !state.error) { load(); }
    if (state.error) return `<div class="notice danger">${icon("alert", 15)}<div>${esc(state.error)}
      <div style="margin-top:8px"><button class="btn btn-sm" data-act="usrReload">${icon("refresh", 14)} Réessayer</button></div></div></div>`;
    if (!state.users) return `<div class="empty">${icon("refresh", 18, "spin")}<br>Chargement des comptes…</div>`;
    let rows = state.users;
    if (state.q) rows = rows.filter(u => Core.matches([u.full_name, u.email, ROLE_LABEL(u.role)].join(" "), state.q));
    const n = s => state.users.filter(u => u.status === s).length;
    return `<div class="stack">
      <div class="stat-grid">
        ${Frag.stat("Comptes actifs", String(n("active")), "peuvent se connecter")}
        ${Frag.stat("Mots de passe provisoires", String(state.users.filter(u => u.status === "active" && u.must_change_password).length), "à changer à la 1re connexion")}
        ${Frag.stat("En attente / désactivés", String(n("pending") + n("disabled")), "sans accès")}
      </div>
      <div class="card">
        <div class="card-head">${Frag.searchBox("usrSearch", state.q, "Rechercher un nom, un e-mail…")}</div>
        <div class="table-wrap"><table class="tbl">
          <thead><tr><th>Personne</th><th>Rôle</th><th>Statut</th><th>Mot de passe</th><th>Dernière connexion</th><th class="r">Actions</th></tr></thead>
          <tbody>${rows.length ? rows.map(u => `<tr class="${u.status === "active" ? "" : "inactive"}">
            <td><div class="strong">${esc(u.full_name || "—")}${u.id === state.me ? ` <span class="tag accent">vous</span>` : ""}</div>
              <div class="xsmall muted-3">${esc(u.email)}</div></td>
            <td><span class="tag">${esc(ROLE_LABEL(u.role))}</span></td>
            <td>${statusTag(u)}</td>
            <td class="small">${u.must_change_password ? `<span class="tag warn">provisoire</span>` : `<span class="muted">personnel</span>${u.password_changed_at ? `<div class="xsmall muted-3">changé le ${esc(Core.dateFR(u.password_changed_at))}</div>` : ""}`}</td>
            <td class="small muted">${u.last_sign_in_at ? esc(dateTimeFR(u.last_sign_in_at)) : "jamais"}</td>
            <td class="r nowrap">
              ${u.status === "pending" ? `<button class="btn btn-sm btn-primary" data-act="usrEdit" data-id="${esc(u.id)}">Activer</button>` : ""}
              <button class="btn btn-ghost btn-icon" data-act="usrEdit" data-id="${esc(u.id)}" title="Modifier le rôle ou le statut">${icon("edit", 14)}</button>
              <button class="btn btn-ghost btn-icon" data-act="usrReset" data-id="${esc(u.id)}" title="Réinitialiser le mot de passe">${icon("lock", 14)}</button>
              ${u.id === state.me ? "" : `<button class="btn btn-ghost btn-icon" data-act="usrDel" data-id="${esc(u.id)}" title="Supprimer le compte">${icon("trash", 14)}</button>`}
            </td></tr>`).join("") : `<tr><td colspan="6">${Frag.empty("Aucun compte", "Modifiez la recherche.")}</td></tr>`}
          </tbody>
        </table></div>
      </div>
      <div class="notice">${icon("info", 15)}<div>
        <strong>Fonctionnement :</strong> vous inscrivez une personne avec son e-mail et un mot de passe provisoire, que vous lui
        transmettez. À sa première connexion, l'application l'oblige à choisir son propre mot de passe ; elle pourra ensuite le
        changer à tout moment depuis « Mon compte » (bas de la barre latérale). Si elle l'oublie, réinitialisez-le ici
        (${icon("lock", 13)}) : un nouveau mot de passe provisoire lui sera demandé de changer.</div></div>
    </div>`;
  }

  /* --------------------------------------------------------- Dialogues */
  function pwdField(value) {
    return UI.field("Mot de passe provisoire", `<div class="row" style="gap:6px;flex-wrap:nowrap">
      <input class="inp mono" name="password" value="${esc(value)}" autocomplete="off" spellcheck="false">
      <button class="btn" type="button" data-gen title="Générer">${icon("refresh", 14)}</button></div>`,
      Cloud.MIN_PWD + " caractères minimum. La personne devra le changer à sa première connexion.");
  }
  function bindGen(m) {
    m.el.querySelector("[data-gen]").addEventListener("click", () => { m.el.querySelector('[name="password"]').value = Cloud.tempPassword(); });
  }

  function credentialsDialog(title, email, password) {
    const text = `Bonjour,\n\nVotre accès à BET Chiffrage est prêt.\nIdentifiant : ${email}\nMot de passe provisoire : ${password}\n\n`
      + `À votre première connexion, vous devrez choisir votre propre mot de passe.\n`;
    const m = UI.modal({
      title, sub: "À transmettre à la personne par un canal sûr",
      body: `<div class="grid-2">
          <div><div class="lbl">Identifiant</div><div class="mono strong">${esc(email)}</div></div>
          <div><div class="lbl">Mot de passe provisoire</div><div class="mono strong">${esc(password)}</div></div>
        </div>
        ${UI.field("Message prêt à envoyer", `<textarea class="inp" rows="7" readonly id="cred-txt">${esc(text)}</textarea>`)}
        <div class="notice warn">${icon("alert", 15)}<div>Ce mot de passe n'est plus affiché une fois cette fenêtre fermée.</div></div>`,
      footer: `<a class="btn" href="mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent("Votre accès BET Chiffrage")}&body=${encodeURIComponent(text)}">${icon("external", 15)} Ouvrir dans ma messagerie</a>
               <button class="btn btn-primary" data-copy>${icon("copy", 15)} Copier le message</button>`,
    });
    m.el.querySelector("[data-copy]").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(text); UI.toast("Message copié.", "ok", 1600); }
      catch (e) { const t = m.el.querySelector("#cred-txt"); t.select(); UI.toast("Sélectionné : copiez avec Ctrl+C.", "warn"); }
    });
  }

  function createDialog(pre = {}) {
    const m = UI.modal({
      title: "Inscrire une personne", sub: "Création manuelle d'un compte",
      body: `<div class="grid-2">
          ${UI.field("Adresse e-mail *", `<input class="inp" name="email" type="email" autocomplete="off" placeholder="prenom.nom@exemple.fr" value="${esc(pre.email || "")}">`)}
          ${UI.field("Nom complet", UI.textInput("full_name", pre.full_name || "", 'placeholder="Prénom Nom"'))}
        </div>
        ${UI.field("Rôle", UI.selectInput("role", Object.entries(Auth.ROLES).map(([k, r]) => [k, r.label + " — " + r.desc]), "ingenieur"))}
        ${pwdField(Cloud.tempPassword())}`,
      footer: `<button class="btn" data-modal-close>Annuler</button>
               <button class="btn btn-primary" data-save>${icon("check", 15)} Créer le compte</button>`,
    });
    bindGen(m);
    const btn = m.el.querySelector("[data-save]");
    btn.addEventListener("click", async () => {
      const f = UI.readForm(m.el);
      const email = f.email.trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return UI.toast("Adresse e-mail invalide.", "warn");
      if (f.password.length < Cloud.MIN_PWD) return UI.toast("Mot de passe trop court (" + Cloud.MIN_PWD + " caractères minimum).", "warn");
      btn.disabled = true;
      try {
        await Cloud.admin("create", { email, full_name: f.full_name.trim(), role: f.role, password: f.password });
        m.close();
        credentialsDialog("Compte créé", email, f.password);
        if (typeof pre.onDone === "function") pre.onDone();
        load();
      } catch (e) { UI.toast(e.message, "err", 6000); btn.disabled = false; }
    });
  }

  function editDialog(u) {
    const self = u.id === state.me;
    const m = UI.modal({
      title: "Modifier le compte", sub: u.email,
      body: `${UI.field("Nom complet", UI.textInput("full_name", u.full_name || ""))}
        ${UI.field("Rôle", UI.selectInput("role", Object.entries(Auth.ROLES).map(([k, r]) => [k, r.label + " — " + r.desc]), u.role, self ? "disabled" : ""))}
        <label class="row small" style="gap:7px"><input type="checkbox" name="active"${u.status === "active" || u.status === "pending" ? " checked" : ""}${self ? " disabled" : ""}>
          Compte actif (peut se connecter)</label>
        ${self ? `<p class="hint">Vous ne pouvez pas retirer vos propres droits d'administrateur.</p>` : ""}`,
      footer: `<button class="btn" data-modal-close>Annuler</button>
               <button class="btn btn-primary" data-save>${icon("check", 15)} Enregistrer</button>`,
    });
    const btn = m.el.querySelector("[data-save]");
    btn.addEventListener("click", async () => {
      const f = UI.readForm(m.el);
      btn.disabled = true;
      try {
        await Cloud.admin("update", { id: u.id, full_name: f.full_name.trim(), role: self ? "admin" : f.role, active: self ? true : !!f.active });
        m.close(); UI.toast("Compte mis à jour.", "ok"); load();
      } catch (e) { UI.toast(e.message, "err", 6000); btn.disabled = false; }
    });
  }

  function resetDialog(u, onDone) {
    const self = u.id === state.me;
    if (self) return Views.Users.changeOwnPassword();
    const m = UI.modal({
      title: "Réinitialiser le mot de passe", sub: u.full_name ? u.full_name + " — " + u.email : u.email,
      body: `${pwdField(Cloud.tempPassword())}
        <p class="small muted">L'ancien mot de passe cesse immédiatement de fonctionner.</p>`,
      footer: `<button class="btn" data-modal-close>Annuler</button>
               <button class="btn btn-primary" data-save>${icon("lock", 15)} Réinitialiser</button>`,
    });
    bindGen(m);
    const btn = m.el.querySelector("[data-save]");
    btn.addEventListener("click", async () => {
      const pwd = m.el.querySelector('[name="password"]').value;
      if (pwd.length < Cloud.MIN_PWD) return UI.toast("Mot de passe trop court.", "warn");
      btn.disabled = true;
      try {
        await Cloud.admin("reset_password", { id: u.id, password: pwd });
        m.close(); credentialsDialog("Mot de passe réinitialisé", u.email, pwd);
        if (typeof onDone === "function") onDone();
        load();
      } catch (e) { UI.toast(e.message, "err", 6000); btn.disabled = false; }
    });
  }

  /* ------------------------------------------------------ Mon compte */
  function changeOwnPassword() {
    const m = UI.modal({
      title: "Changer mon mot de passe", sub: (Cloud.profile() || {}).email || "", size: "narrow",
      body: `<form id="cp-form" class="stack" novalidate>${Gate.passwordFields(true)}</form>`,
      footer: `<button class="btn" data-modal-close>Annuler</button>
               <button class="btn btn-primary" data-save>${icon("check", 15)} Enregistrer</button>`,
    });
    Gate.bindShow(m.el);
    const btn = m.el.querySelector("[data-save]");
    const go = async () => {
      const f = UI.readForm(m.el);
      if (!f.current) return UI.toast("Saisissez votre mot de passe actuel.", "warn");
      const bad = Cloud.checkNew(f.next, f.confirm);
      if (bad) return UI.toast(bad, "warn");
      btn.disabled = true;
      try { await Cloud.changePassword(f.current, f.next); m.close(); UI.toast("Mot de passe modifié.", "ok"); }
      catch (e) { UI.toast(e.message, "err", 6000); btn.disabled = false; }
    };
    btn.addEventListener("click", go);
    m.el.querySelector("#cp-form").addEventListener("submit", e => { e.preventDefault(); go(); });
  }

  function accountMenu() {
    const p = Cloud.profile() || {};
    const admin = Auth.role() === "admin";
    const m = UI.modal({
      title: "Mon compte", size: "narrow",
      body: `<div class="row" style="gap:12px">
          <span class="rail-avatar" style="width:40px;height:40px;flex-basis:40px;font-size:14px;background:var(--c-accent-soft);color:var(--c-accent)">
            ${esc((p.full_name || p.email || "?").split(/\s+/).map(s => s[0]).slice(0, 2).join("").toUpperCase())}</span>
          <div><div class="strong">${esc(p.full_name || "—")}</div><div class="small muted">${esc(p.email || "")}</div>
            <span class="tag accent" style="margin-top:4px">${esc(ROLE_LABEL(p.role))}</span></div>
        </div>
        <div class="stack-sm">
          <button class="btn" style="justify-content:flex-start" data-acc="pwd">${icon("lock", 15)} Changer mon mot de passe</button>
          ${admin ? `<button class="btn" style="justify-content:flex-start" data-acc="users">${icon("user", 15)} Gérer les comptes</button>` : ""}
          <button class="btn" style="justify-content:flex-start" data-acc="support">${icon("info", 15)} ${admin ? "Demandes de support" : "Contacter le support"}</button>
          <button class="btn btn-danger" style="justify-content:flex-start" data-acc="out">${icon("external", 15)} Se déconnecter</button>
        </div>`,
      footer: null,
    });
    m.el.querySelector('[data-acc="pwd"]').addEventListener("click", () => { m.close(); changeOwnPassword(); });
    const u = m.el.querySelector('[data-acc="users"]');
    if (u) u.addEventListener("click", () => { m.close(); App.go("users"); });
    m.el.querySelector('[data-acc="support"]').addEventListener("click", () => { m.close(); App.go("support"); });
    m.el.querySelector('[data-acc="out"]').addEventListener("click", async () => {
      await Repo.flush(); await Cloud.signOut(); location.reload();
    });
  }

  const find = id => (state.users || []).find(u => u.id === id);
  UI.register({
    usrNew: () => createDialog(),
    usrReload: () => { state.users = null; state.error = ""; App.render(); },
    usrEdit: d => { const u = find(d.id); if (u) editDialog(u); },
    usrReset: d => { const u = find(d.id); if (u) resetDialog(u); },
    usrDel: async d => {
      const u = find(d.id); if (!u) return;
      const ok = await UI.confirm({ title: "Supprimer ce compte ?", message: (u.full_name || "") + " — " + u.email,
        detail: "La personne ne pourra plus se connecter. Pour une suspension temporaire, préférez la désactivation.",
        confirmLabel: "Supprimer définitivement", danger: true });
      if (!ok) return;
      try { await Cloud.admin("delete", { id: u.id }); UI.toast("Compte supprimé.", "ok"); load(); }
      catch (e) { UI.toast(e.message, "err", 6000); }
    },
    switchUser: () => accountMenu(),
    myPassword: () => changeOwnPassword(),
  }, UI.Actions);
  UI.register({
    usrSearch: (d, el) => {
      state.q = el.value; const pos = el.selectionStart; App.render();
      const again = document.querySelector('[data-inp="usrSearch"]');
      if (again) { again.focus(); again.setSelectionRange(pos, pos); }
    },
  }, UI.Inputs);

  /** Réinitialisation à partir d'une adresse e-mail (demande de support). */
  async function resetByEmail(email, onDone) {
    if (!state.users) await load();
    const u = (state.users || []).find(x => String(x.email).toLowerCase() === String(email).toLowerCase());
    if (!u) return UI.toast("Aucun compte avec l'adresse " + email + ".", "warn", 5000);
    resetDialog(u, onDone);
  }

  return { render, actions, accountMenu, changeOwnPassword, createDialog, resetByEmail, load };
})();


/* ===== 13d-view-support.js =========================================== */
/* =========================================================================
 * 13d — SUPPORT : boîte de réception des demandes (administrateurs) et
 * formulaire de contact (autres rôles).
 * ========================================================================= */
Views.Support = (() => {
  "use strict";
  const { esc, dateTimeFR } = Core;
  const icon = UI.icon;
  const state = { rows: null, loading: false, error: "", filter: "nouveau", sent: null };
  const isAdmin = () => Auth.role() === "admin";

  async function load() {
    if (!isAdmin()) return;
    state.loading = true; state.error = "";
    try {
      const { data, error } = await Cloud.client().from("support_requests").select("*").order("created_at", { ascending: false }).limit(500);
      if (error) throw error;
      state.rows = data || [];
    } catch (e) { state.error = Cloud.frMsg(e); }
    state.loading = false;
    if (App.state.route === "support") App.render();
    else {
      const link = document.querySelector('.rail-link[data-route="support"]');
      if (link) {
        let b = link.querySelector(".rail-badge");
        if (newCount() && !b) { b = document.createElement("span"); b.className = "rail-badge"; link.appendChild(b); }
        if (b) { if (newCount()) b.textContent = newCount(); else b.remove(); }
      }
    }
  }
  const newCount = () => (state.rows || []).filter(r => r.status === "nouveau").length;

  function actions() {
    return isAdmin() ? `<button class="btn" data-act="supReload">${icon("refresh", 15)} Actualiser</button>` : "";
  }

  function render() {
    return isAdmin() ? inbox() : contact();
  }

  function contact() {
    const p = Cloud.profile() || {};
    if (state.sent) {
      return `<div class="card" style="max-width:640px"><div class="card-body">${Gate.sentBox(state.sent.res, state.sent.req).replace(
        /<button class="btn" type="button" data-gtab="login">[\s\S]*?<\/button>/, `<button class="btn" data-act="supAgain">${icon("plus", 15)} Nouvelle demande</button>`)}</div></div>`;
    }
    return `<div class="card" style="max-width:680px">
      <div class="card-head"><h3>Contacter le support</h3></div>
      <div class="card-body" id="sup-box">${Gate.supportForm("question", p.email)}</div></div>`;
  }

  function inbox() {
    if (!state.rows && !state.loading && !state.error) load();
    if (state.error) return `<div class="notice danger">${icon("alert", 15)}<div>${esc(state.error)}</div></div>`;
    if (!state.rows) return `<div class="empty">${icon("refresh", 18, "spin")}<br>Chargement des demandes…</div>`;
    const rows = state.rows.filter(r => state.filter === "tous" || r.status === state.filter);
    return `<div class="stack">
      <div class="card"><div class="card-head">
        <div class="chip-row">${[["nouveau", "À traiter (" + newCount() + ")"], ["traite", "Traitées"], ["tous", "Toutes"]].map(([v, l]) =>
          `<button class="chip ${state.filter === v ? "active" : ""}" data-act="supFilter" data-v="${v}">${esc(l)}</button>`).join("")}</div>
        <span class="spacer xsmall muted-3">Chaque demande vous est aussi envoyée par e-mail (${esc(Cloud.SUPPORT_EMAIL)}).</span>
      </div>
      ${rows.length ? `<div class="stack-sm" style="padding:12px">${rows.map(card).join("")}</div>`
        : Frag.empty(state.filter === "nouveau" ? "Aucune demande en attente" : "Aucune demande", "Les demandes envoyées depuis la page de connexion ou « Mon compte » apparaissent ici.")}
      </div></div>`;
  }

  function card(r) {
    const k = Cloud.KINDS[r.kind] || r.kind;
    const tagCls = { creation_compte: "accent", mot_de_passe: "warn", probleme: "danger" }[r.kind] || "";
    return `<div class="card" style="${r.status === "nouveau" ? "border-left:3px solid var(--c-accent)" : "opacity:.75"}"><div class="card-body stack-sm">
      <div class="row between">
        <div class="row" style="gap:8px"><span class="tag ${tagCls}">${esc(k)}</span>
          <span class="strong">${esc(r.full_name || "—")}</span>
          <a class="small" href="mailto:${esc(r.email)}">${esc(r.email)}</a>
          ${r.company ? `<span class="small muted">· ${esc(r.company)}</span>` : ""}</div>
        <span class="xsmall muted-3">${esc(dateTimeFR(r.created_at))}${r.status === "traite" ? " · traitée le " + esc(dateTimeFR(r.handled_at)) : ""}</span>
      </div>
      ${r.message ? `<div class="small" style="white-space:pre-wrap">${esc(r.message)}</div>` : ""}
      <div class="row" style="gap:6px">
        ${r.kind === "creation_compte" && r.status === "nouveau" ? `<button class="btn btn-sm btn-primary" data-act="supCreate" data-id="${esc(r.id)}">${icon("plus", 14)} Créer le compte</button>` : ""}
        ${r.kind === "mot_de_passe" && r.status === "nouveau" ? `<button class="btn btn-sm btn-primary" data-act="supReset" data-id="${esc(r.id)}">${icon("lock", 14)} Réinitialiser le mot de passe</button>` : ""}
        <a class="btn btn-sm" href="mailto:${esc(r.email)}?subject=${encodeURIComponent("Re : " + k)}">${icon("external", 14)} Répondre</a>
        <button class="btn btn-sm" data-act="supToggle" data-id="${esc(r.id)}">${r.status === "nouveau" ? icon("check", 14) + " Marquer traitée" : "Rouvrir"}</button>
        <button class="btn btn-sm btn-ghost btn-icon" data-act="supDel" data-id="${esc(r.id)}" title="Supprimer">${icon("trash", 14)}</button>
      </div>
    </div></div>`;
  }

  async function setStatus(r, status) {
    const patch = status === "traite"
      ? { status, handled_at: new Date().toISOString(), handled_by: (Cloud.profile() || {}).id }
      : { status, handled_at: null, handled_by: null };
    const { error } = await Cloud.client().from("support_requests").update(patch).eq("id", r.id);
    if (error) return UI.toast(Cloud.frMsg(error), "err");
    Object.assign(r, patch);
    App.render();
  }

  function mount(page) {
    const box = page.querySelector("#sup-box");
    if (box) Gate.bindSupport(box, (res, req) => { state.sent = { res, req }; App.render(); });
  }

  const find = id => (state.rows || []).find(r => r.id === id);
  UI.register({
    supReload: () => { state.rows = null; App.render(); },
    supFilter: d => { state.filter = d.v; App.render(); },
    supAgain: () => { state.sent = null; App.render(); },
    supToggle: d => { const r = find(d.id); if (r) setStatus(r, r.status === "nouveau" ? "traite" : "nouveau"); },
    supCreate: d => {
      const r = find(d.id); if (!r) return;
      Views.Users.createDialog({ email: r.email, full_name: r.full_name, onDone: () => setStatus(r, "traite") });
    },
    supReset: d => { const r = find(d.id); if (r) Views.Users.resetByEmail(r.email, () => setStatus(r, "traite")); },
    supDel: async d => {
      const r = find(d.id); if (!r) return;
      const ok = await UI.confirm({ title: "Supprimer cette demande ?", message: (r.full_name || "") + " — " + r.email, confirmLabel: "Supprimer", danger: true });
      if (!ok) return;
      const { error } = await Cloud.client().from("support_requests").delete().eq("id", r.id);
      if (error) return UI.toast(Cloud.frMsg(error), "err");
      state.rows = state.rows.filter(x => x.id !== r.id); App.render();
    },
  }, UI.Actions);

  return { render, actions, mount, load, newCount };
})();


/* ===== 14-view-dashboard.js ========================================== */
/* =========================================================================
 * 14 — TABLEAU DE BORD (§3)
 * ========================================================================= */
Views.Dashboard = (() => {
  "use strict";
  const { esc, eur, num, dateFR } = Core;
  const icon = UI.icon;

  function actions() {
    return `<button class="btn" data-act="search">${icon("search", 15)} Rechercher <span class="kbd">Ctrl K</span></button>
            <button class="btn btn-primary" data-act="prjNew">${icon("plus", 15)} Nouveau projet</button>`;
  }

  function render() {
    const refs = { coefficients: Repo.coefficients.all() };
    const projects = Repo.projects.list(p => p.status !== "archivé");
    const archived = Repo.projects.all().length - projects.length;
    const totals = projects.map(p => ({ p, t: Calc.projectTotals(p, refs) })).filter(x => x.t);
    const grand = Core.sum(totals, x => x.t.totalTTC);
    const grandRemainder = Core.sum(totals, x => x.t.remainder);
    const dwellings = Core.sum(projects, p => Core.parseNum(p.nbDwellings));
    const recent = projects.slice().sort((a, b) => Core.cmp(b.updatedAt, a.updatedAt)).slice(0, 6);
    const items = Repo.items.list(i => i.active !== false);
    const s = Repo.settings.get();
    const dpeInProjects = Core.sum(projects, p => (p.dpes || []).length);
    const dpeInbox = (Repo.state().dpeInbox || []).length;

    const byMission = [...Core.groupBy(projects, p => p.missionType || "Autre").entries()]
      .map(([k, v]) => ({ k, n: v.length })).sort((a, b) => b.n - a.n);
    const maxMission = byMission.reduce((m, x) => Math.max(m, x.n), 1);

    return `
    <div class="stack">
      <div class="stat-grid">
        ${Frag.stat("Projets actifs", String(projects.length), archived ? archived + " archivé(s)" : "Aucun archivé")}
        ${Frag.stat("Montant total chiffré", eur(grand), "Scénarios retenus, TTC", "accent")}
        ${Frag.stat("Reste à charge cumulé", eur(grandRemainder), "après aides renseignées", "ember")}
        ${Frag.stat("Logements suivis", num(dwellings, 0), projects.length + " copropriétés")}
        ${Frag.stat("DPE analysés", String(dpeInProjects + dpeInbox), dpeInbox ? dpeInbox + " en attente dans l'espace d'analyse" : "tous rattachés à un projet")}
        ${Frag.stat("Postes au catalogue", String(items.length), Repo.categories.list(c => c.active !== false).length + " catégories")}
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3>Derniers projets modifiés</h3>
            <button class="btn btn-sm spacer" data-act="go" data-route="projects">Tous les projets</button></div>
          <div class="table-wrap">
            <table class="tbl">
              <thead><tr><th>Projet</th><th>Mission</th><th class="r">Montant TTC</th><th class="r">Modifié</th></tr></thead>
              <tbody>
                ${recent.length ? recent.map(p => {
                  const t = Calc.projectTotals(p, refs);
                  return `<tr>
                    <td><button class="btn btn-ghost" style="padding:0" data-act="prjOpen" data-id="${p.id}">
                      <span class="strong">${esc(p.name)}</span></button>
                      <div class="xsmall muted-3">${esc(p.city || p.coproName || "—")} · ${esc(p.version)}</div></td>
                    <td><span class="tag">${esc(p.missionType || "—")}</span></td>
                    <td class="num r strong">${t ? eur(t.totalTTC) : "—"}</td>
                    <td class="num r small muted">${dateFR(p.updatedAt)}</td>
                  </tr>`;
                }).join("") : `<tr><td colspan="4">${Frag.empty("Aucun projet",
                  "Créez un dossier de chiffrage pour démarrer.",
                  `<button class="btn btn-primary" data-act="prjNew">${icon("plus", 15)} Nouveau projet</button>`)}</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>

        <div class="stack">
          <div class="card">
            <div class="card-head"><h3>Répartition par type de mission</h3></div>
            <div class="card-body stack-sm">
              ${byMission.length ? byMission.map(x => `
                <div>
                  <div class="row between xsmall"><span>${esc(x.k)}</span><span class="mono">${x.n}</span></div>
                  <div class="bar"><span style="width:${(x.n / maxMission) * 100}%"></span></div>
                </div>`).join("") : `<p class="hint">Aucun projet enregistré.</p>`}
            </div>
          </div>

          <div class="card">
            <div class="card-head"><h3>Accès rapide</h3></div>
            <div class="card-body stack-sm">
              <button class="btn" style="justify-content:flex-start" data-act="go" data-route="dpe">${icon("gauge", 15)} Analyser des DPE (import 3CL)</button>
              <button class="btn" style="justify-content:flex-start" data-act="prjNew">${icon("plus", 15)} Créer un projet</button>
              <button class="btn" style="justify-content:flex-start" data-act="go" data-route="catalog">${icon("book", 15)} Gérer le catalogue de prix</button>
              <button class="btn" style="justify-content:flex-start" data-act="go" data-route="compare">${icon("chart", 15)} Comparer des scénarios</button>
              <button class="btn" style="justify-content:flex-start" data-act="go" data-route="reports">${icon("report", 15)} Générer un rapport</button>
              <button class="btn" style="justify-content:flex-start" data-act="setExport">${icon("download", 15)} Sauvegarder les données</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-body row between">
          <div class="small muted">
            ${icon("save", 14)} Données enregistrées dans ce navigateur (${esc(Repo.driverName())}) —
            ${Repo.savedAt() ? "dernière sauvegarde " + Core.dateTimeFR(Repo.savedAt()) : "sauvegarde automatique active"}.
          </div>
          <div class="small muted-3">${esc(s.bureauName || "Bureau d'études")} · ${esc(Auth.name())} (${esc(Auth.roleLabel())})</div>
        </div>
      </div>
    </div>`;
  }

  return { render, actions };
})();


/* ===== 15-view-compare.js ============================================ */
/* =========================================================================
 * 15 — COMPARATEUR DE SCÉNARIOS (§14, §15)
 * ========================================================================= */
Views.Compare = (() => {
  "use strict";
  const { esc, eur, num } = Core;
  const icon = UI.icon;

  const state = { projectId: null };

  function project() {
    const id = state.projectId || App.state.projectId;
    return id ? Repo.projects.get(id) : (Repo.projects.list(p => p.status !== "archivé")[0] || null);
  }

  function actions() {
    const p = project();
    return p ? `<button class="btn" data-act="cmpXlsx">${icon("download", 15)} Excel</button>
                <button class="btn btn-primary" data-act="cmpPdf">${icon("report", 15)} Rapport PDF</button>` : "";
  }

  /** Ligne du tableau comparatif : libellé + valeur par scénario + mise en avant. */
  function row(label, values, fmt, best, hint) {
    let bestIdx = -1;
    if (best && values.some(v => Number.isFinite(v) && v !== 0)) {
      const candidates = values.map((v, i) => ({ v, i })).filter(x => Number.isFinite(x.v) && x.v !== 0);
      if (candidates.length) {
        bestIdx = candidates.reduce((a, b) => (best === "min" ? (b.v < a.v ? b : a) : (b.v > a.v ? b : a))).i;
      }
    }
    return `<tr>
      <td class="lbl-cell">${esc(label)}${hint ? `<div class="xsmall muted-3">${esc(hint)}</div>` : ""}</td>
      ${values.map((v, i) => `<td class="num r ${i === bestIdx ? "strong" : ""}" ${i === bestIdx ? 'style="color:var(--c-ok)"' : ""}>${fmt(v)}</td>`).join("")}
    </tr>`;
  }

  function render() {
    const projects = Repo.projects.list(p => p.status !== "archivé");
    if (!projects.length) return Frag.empty("Aucun projet", "Créez un projet et au moins deux scénarios pour les comparer.",
      `<button class="btn btn-primary" data-act="prjNew">${icon("plus", 15)} Nouveau projet</button>`);
    const p = project();
    if (!p) return Frag.empty("Projet introuvable", "Sélectionnez un projet.");
    const refs = { coefficients: Repo.coefficients.all() };
    const all = Calc.compare(p, refs);

    const head = `
      <div class="card"><div class="card-body row between">
        <div class="row">
          <span class="lbl">Projet</span>
          <select class="inp" style="max-width:380px" data-chg="cmpPickProject">
            ${projects.map(x => `<option value="${x.id}"${x.id === p.id ? " selected" : ""}>${esc(x.name)} — ${esc(x.version)}</option>`).join("")}
          </select>
        </div>
        <div class="btn-group">
          <button class="btn" data-act="prjOpen" data-id="${p.id}">${icon("external", 15)} Ouvrir le projet</button>
          <button class="btn btn-primary" data-act="sNewFromCompare">${icon("plus", 15)} Nouveau scénario</button>
        </div>
      </div></div>`;

    if (!all.length) return head + Frag.empty("Aucun scénario", "Créez au moins un scénario dans ce projet.");

    const money = v => (Number.isFinite(v) ? eur(v) : "—");
    const years = v => (v ? num(v, 1) + " ans" : "—");
    const kwh = v => (v ? num(v, 0) + " kWh" : "—");
    const pctf = v => (v ? num(v, 1) + " %" : "—");

    return `
      ${head}
      <div class="card">
        <div class="card-head"><h3>Comparaison des scénarios — ${esc(p.name)}</h3>
          <span class="spacer small muted-3">Le scénario retenu est surligné ; la meilleure valeur de chaque ligne est en vert.</span></div>
        <div class="table-wrap">
          <table class="tbl cmp-tbl">
            <colgroup><col>${all.map(s => `<col class="${(p.scenarios.find(x => x.id === s.scenarioId) || {}).selected ? "sel" : ""}">`).join("")}</colgroup>
            <thead><tr>
              <th style="min-width:220px">Indicateur</th>
              ${all.map(s => {
                const sc = p.scenarios.find(x => x.id === s.scenarioId);
                return `<th class="scn">
                  <div class="strong" style="text-transform:none;font-size:12.5px;color:var(--c-text)">${esc(s.name)}</div>
                  ${sc && sc.selected ? `<span class="tag accent">Retenu</span>` : `<button class="btn btn-sm" data-act="sSelectCmp" data-id="${s.scenarioId}">Retenir</button>`}
                </th>`;
              }).join("")}
            </tr></thead>
            <tbody>
              ${row("Nombre de postes", all.map(s => s.nbLines), v => num(v, 0))}
              ${row("Travaux HT", all.map(s => s.worksHT), money)}
              ${row("Frais annexes HT", all.map(s => s.feesHT), money)}
              ${row("Travaux HT (total)", all.map(s => s.totalHT), money)}
              ${row("TVA", all.map(s => s.totalVAT), money)}
              ${row("Travaux TTC", all.map(s => s.totalTTC), money)}
              ${row("Fourchette basse TTC", all.map(s => s.range.ttcLow), money, null, "± " + num(p.uncertainty, 0) + " %")}
              ${row("Fourchette haute TTC", all.map(s => s.range.ttcHigh), money)}
              ${row("Aides", all.map(s => s.aidsTotal), money, "max")}
              ${row("Reste à charge", all.map(s => s.remainder), money, "min")}
              ${row("€ / logement (TTC)", all.map(s => s.perDwellingTTC), money)}
              ${row("€ / logement (reste à charge)", all.map(s => s.perDwellingRemainder), money, "min")}
              ${row("€ / m² habitable", all.map(s => s.perM2TTC), money)}
              ${row("Économie d'énergie", all.map(s => s.eco.savingPct), pctf, "max")}
              ${row("Énergie économisée", all.map(s => s.eco.energySavedKwh), kwh, "max", "par an")}
              ${row("Économie financière", all.map(s => s.eco.annualSaving), money, "max", "par an")}
              ${row("Temps de retour (net d'aides)", all.map(s => s.eco.payback), years, "min")}
              ${row("VAN", all.map(s => (s.eco.annualSaving ? s.eco.npv : NaN)), money, "max", "sur " + num(all[0].eco.horizon, 0) + " ans")}
              ${row("TRI", all.map(s => (s.eco.irr === null ? NaN : s.eco.irr)), v => (Number.isFinite(v) ? num(v, 1) + " %" : "—"), "max")}
            </tbody>
          </table>
        </div>
      </div>

      ${p.buildings && p.buildings.length ? `<div class="card">
        <div class="card-head"><h3>Coût TTC par bâtiment</h3></div>
        <div class="table-wrap"><table class="tbl">
          <thead><tr><th>Bâtiment</th>${all.map(s => `<th class="r">${esc(s.name)}</th>`).join("")}</tr></thead>
          <tbody>${p.buildings.map(b => `<tr>
            <td class="strong">${esc(b.name)}</td>
            ${all.map(s => {
              const x = s.byBuilding.find(y => y.id === b.id);
              return `<td class="num r">${x ? eur(x.ttc) : "—"}</td>`;
            }).join("")}
          </tr>`).join("")}</tbody>
        </table></div>
      </div>` : ""}

      <div class="grid-3">
        ${all.map(s => {
          const sc = p.scenarios.find(x => x.id === s.scenarioId);
          return `<div class="card" style="${sc && sc.selected ? "border-color:var(--c-accent)" : ""}">
            <div class="card-head"><h3 style="text-transform:none;font-size:13.5px;color:var(--c-text)">${esc(s.name)}</h3></div>
            <div class="card-body stack-sm">
              ${sc && sc.description ? `<p class="small muted">${esc(sc.description)}</p>` : ""}
              <div class="lbl">Postes principaux</div>
              ${s.lines.slice().sort((a, b) => b.t.totalHT - a.t.totalHT).slice(0, 5).map(l =>
                `<div class="row between xsmall"><span>${esc(l.line.label.slice(0, 46))}</span>
                 <span class="mono">${eur(l.t.totalHT)}</span></div>`).join("") || `<p class="hint">Aucun poste.</p>`}
              ${s.lines.length > 5 ? `<p class="xsmall muted-3">+ ${s.lines.length - 5} autre(s) poste(s)</p>` : ""}
            </div>
          </div>`;
        }).join("")}
      </div>`;
  }

  UI.register({
    sSelectCmp: async d => {
      const p = project();
      p.scenarios.forEach(s => { s.selected = s.id === d.id; });
      Repo.touch("projects"); await Repo.flush();
      UI.toast("Scénario retenu.", "ok"); App.render();
    },
    sNewFromCompare: () => {
      const p = project();
      App.state.projectId = p.id;
      Views.Project.scenarioDialog(null);
    },
    cmpXlsx: () => ImportExport.exportProjectXlsx(project()),
    cmpPdf: () => Reporting.projectPdf(project()),
  }, UI.Actions);

  UI.register({
    cmpPickProject: (d, el) => { state.projectId = el.value; App.state.projectId = el.value; App.render(); },
  }, UI.Changes);

  return { render, actions, project };
})();

/* ===== 18-import-export.js =========================================== */
/* =========================================================================
 * 18 — IMPORT / EXPORT (§8, §22, §23)
 * Classeur Excel 8 feuilles, export/import du catalogue, import de métrés,
 * sauvegarde et restauration JSON.
 * ========================================================================= */
const ImportExport = (() => {
  "use strict";
  const { esc, num } = Core;
  const icon = UI.icon;

  const HEADER_FILL = "FF14252F";
  const HEADER_FONT = "FFFFFFFF";
  const ACCENT = "FF1B5A73";
  const SOFT = "FFE2EDF2";
  const BORDER = { style: "thin", color: { argb: "FFD8E0E5" } };
  const THIN = { top: BORDER, left: BORDER, bottom: BORDER, right: BORDER };
  const EUR = '#,##0" €"';
  const EUR2 = '#,##0.00" €"';

  /* ------------------------------------------------------ Remise du fichier */
  let dlPromise;
  function downloadsCap() {
    if (!dlPromise) {
      dlPromise = (typeof window !== "undefined" && window.claude && typeof window.claude.use === "function")
        ? window.claude.use("downloads").catch(() => null)
        : Promise.resolve(null);
    }
    return dlPromise;
  }

  function anchorSave(filename, blob) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  /**
   * Remet un fichier à l'utilisateur.
   * Utilise la passerelle de téléchargement de l'environnement lorsqu'elle
   * existe, sinon un lien de téléchargement classique.
   */
  async function deliver(filename, data, onExtensionRefused) {
    const cap = await downloadsCap();
    if (!cap) {
      anchorSave(filename, data instanceof Blob ? data : new Blob([data]));
      UI.toast("Fichier généré : " + filename, "ok");
      return true;
    }
    try {
      await cap.save({ filename, data });
      UI.toast("Fichier enregistré : " + filename, "ok");
      return true;
    } catch (e) {
      const code = e && e.code;
      if (code === "declined") { UI.toast("Enregistrement annulé.", "warn"); return false; }
      if (code === "rejected_extension" || code === "extension_not_enabled") {
        if (onExtensionRefused) { onExtensionRefused(); return false; }
        UI.toast("Ce format de fichier n'est pas accepté par l'environnement d'exécution.", "err", 6000);
        return false;
      }
      if (code === "too_large") { UI.toast("Fichier trop volumineux (limite 16 Mo).", "err", 6000); return false; }
      if (code === "rate_limited") { UI.toast("Une autre demande d'enregistrement est en cours. Réessayez dans un instant.", "warn"); return false; }
      console.error(e);
      UI.toast("Enregistrement impossible : " + (e && e.message ? e.message : "erreur inconnue"), "err", 6000);
      return false;
    }
  }

  /** Propose le même contenu en CSV quand le classeur .xlsx est refusé. */
  function offerCsv(sheets, baseName) {
    const body = `<p class="small">L'environnement d'exécution n'accepte pas les fichiers <span class="mono">.xlsx</span>.
      Le même contenu peut être enregistré en CSV, une feuille par fichier.</p>
      <div class="stack-sm">${sheets.map((s, i) =>
        `<button class="btn" style="justify-content:flex-start" data-csv="${i}">${icon("download", 15)} ${esc(s.name)}.csv</button>`).join("")}</div>`;
    const m = UI.modal({ title: "Classeur Excel indisponible ici", body, footer: `<button class="btn" data-modal-close>Fermer</button>` });
    m.el.querySelectorAll("[data-csv]").forEach(b => b.addEventListener("click", async () => {
      const s = sheets[+b.dataset.csv];
      const csv = s.rows.map(r => r.map(cell => {
        const v = cell === null || cell === undefined ? "" : String(cell);
        return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(";")).join("\r\n");
      await api.deliver(Core.slug(baseName + "-" + s.name) + ".csv", "﻿" + csv);
    }));
  }

  function requireExcelJS() {
    if (typeof ExcelJS === "undefined") {
      UI.toast("La bibliothèque Excel n'a pas pu être chargée (réseau ?). Réessayez dans un instant.", "err", 6000);
      return false;
    }
    return true;
  }

  /* --------------------------------------------------- Helpers de mise en page */
  function titleBlock(ws, cols, title, subtitle) {
    ws.mergeCells(1, 1, 1, cols);
    const c1 = ws.getCell(1, 1);
    c1.value = title;
    c1.font = { size: 14, bold: true, color: { argb: ACCENT } };
    ws.getRow(1).height = 22;
    ws.mergeCells(2, 1, 2, cols);
    const c2 = ws.getCell(2, 1);
    c2.value = subtitle;
    c2.font = { size: 10, italic: true, color: { argb: "FF6B7A85" } };
  }

  function headerRow(ws, rowIdx, headers, aligns) {
    const r = ws.getRow(rowIdx);
    headers.forEach((h, i) => {
      const c = r.getCell(i + 1);
      c.value = h;
      c.font = { bold: true, color: { argb: HEADER_FONT } };
      c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: HEADER_FILL } };
      c.alignment = { vertical: "middle", horizontal: (aligns && aligns[i]) || "left", wrapText: true };
      c.border = THIN;
    });
    r.height = 22;
    return r;
  }

  function dataRow(ws, rowIdx, values, formats) {
    const r = ws.getRow(rowIdx);
    values.forEach((v, i) => {
      const c = r.getCell(i + 1);
      c.value = v === undefined ? null : v;
      c.border = THIN;
      if (formats && formats[i]) c.numFmt = formats[i];
    });
    return r;
  }

  function kvSheet(ws, pairs, startRow) {
    let r = startRow;
    pairs.forEach(([k, v, fmt]) => {
      const rowo = ws.getRow(r);
      rowo.getCell(1).value = k;
      rowo.getCell(1).font = { bold: true, color: { argb: "FF44535F" } };
      rowo.getCell(2).value = v === undefined || v === "" ? "—" : v;
      if (fmt) rowo.getCell(2).numFmt = fmt;
      rowo.getCell(1).border = THIN; rowo.getCell(2).border = THIN;
      r++;
    });
    return r;
  }

  /* ============================================ Export classeur projet (§22) */

    /* Feuille 2 — Projet */

    /* Feuille 3 — Bâtiments */

    /* Feuille 4 — Détail des travaux */

    r4b++;

    (t ? t.fees : []).forEach(f => {

    /* Feuille 5 — Scénarios */
    const ws5 = wb.addWorksheet("5. Scénarios");
    ws5.columns = [{ width: 34 }, ...all.map(() => ({ width: 20 }))];
    titleBlock(ws5, all.length + 1, "Comparaison des scénarios", sub);

    const cmpRows = [
      ["Nombre de postes", all.map(x => x.nbLines), null],
      ["Travaux HT", all.map(x => x.worksHT), EUR],
      ["Frais annexes HT", all.map(x => x.feesHT), EUR],
      ["Total HT", all.map(x => x.totalHT), EUR],
      ["TVA", all.map(x => x.totalVAT), EUR],
      ["Total TTC", all.map(x => x.totalTTC), EUR],
      ["Fourchette basse TTC", all.map(x => x.range.ttcLow), EUR],
      ["Fourchette haute TTC", all.map(x => x.range.ttcHigh), EUR],
      ["Aides", all.map(x => x.aidsTotal), EUR],
      ["Reste à charge", all.map(x => x.remainder), EUR],
      ["Coût TTC / logement", all.map(x => x.perDwellingTTC), EUR],
      ["Reste à charge / logement", all.map(x => x.perDwellingRemainder), EUR],
      ["Coût TTC / m²", all.map(x => x.perM2TTC), EUR2],
      ["Économie d'énergie (%)", all.map(x => x.eco.savingPct / 100), "0.0 %"],

      ["VAN", all.map(x => x.eco.npv), EUR],

      ["Temps de retour net d'aides (ans)", all.map(x => x.eco.payback || 0), "0.0"],
      ["VAN", all.map(x => x.eco.npv), EUR],
      ["TRI (%)", all.map(x => (x.eco.irr === null ? 0 : x.eco.irr / 100)), "0.0 %"],

        ["Besoin chauffage (kWh/an)", 14], ["Besoin ECS (kWh/an)", 12], ["Déperditions (W/K)", 12],

        const sm = Dpe.summary(rec.data);
        const mm = Dpe.metrics([rec]);
        const b = (p.buildings || []).find(x => x.id === rec.buildingId);
        const row = dataRow(ws9, 5 + i, [
          rec.fileName, sm.address || "", b ? b.name : "", sm.year ? (Number(sm.year) || String(sm.year)) : null, sm.surface,
          sm.cls || "", sm.gesCls || "", sm.epM2, sm.gesM2, sm.besoinCh, sm.besoinEcs, sm.deperd,
          mm.facadeArea, mm.roofArea, mm.lowFloorArea, mm.glazingArea, mm.nbBaies,
          sm.heating || "", sm.energy || "", sm.ecs || "", sm.vmc || "",
        ], [null, null, null, "0", "#,##0.00", null, null, "#,##0", "#,##0.0", "#,##0", "#,##0", "#,##0.0",
          "#,##0.00", "#,##0.00", "#,##0.00", "#,##0.00", "#,##0"]);
        [[6, sm.cls, Dpe.COLORS], [7, sm.gesCls, Dpe.GES_COLORS]].forEach(([col, L, pal]) => {
          if (!L || !pal[L]) return;
          const c = row.getCell(col);
          c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF" + pal[L][0].slice(1) } };
          c.font = { bold: true, color: { argb: "FF" + pal[L][1].slice(1) } };
          c.alignment = { horizontal: "center" };
        });
      });
    }

    await writeWorkbook(wb, Core.slug(p.name + "-" + p.version) + "-chiffrage.xlsx", () => {
      offerCsv(projectCsvSheets(p, all, t), p.name + "-" + p.version);
    });
  }

  function catalogSheet(ws, sub) {
    ws.columns = [{ width: 30 }, { width: 22 }, { width: 48 }, { width: 10 }, { width: 14 },
      { width: 9 }, { width: 14 }, { width: 24 }, { width: 13 }, { width: 18 }, { width: 18 }, { width: 10 }, { width: 30 }];
    titleBlock(ws, 13, "Catalogue de prix", sub);
    headerRow(ws, 4, ["Catégorie", "Sous-catégorie", "Désignation", "Unité", "Prix HT", "TVA",
      "Prix TTC", "Source", "Date", "Région", "Fournisseur", "Actif", "Commentaire"],
      ["left", "left", "left", "left", "right", "right", "right", "left", "left", "left", "left", "center", "left"]);
    const items = Repo.items.list().slice().sort((a, b) => {
      const ca = (Repo.categories.get(a.categoryId) || {}).order ?? 99;
      const cb = (Repo.categories.get(b.categoryId) || {}).order ?? 99;
      return ca - cb || Core.cmp(a.label, b.label);
    });
    items.forEach((i, idx) => {
      const c = Repo.categories.get(i.categoryId);
      dataRow(ws, 5 + idx, [

  async function parseCatalogFile(file) {
    const rows = await readTable(file);
    if (!rows.length) throw new Error("Fichier vide.");
    const header = rows[0].map(h => Core.norm(String(h || "")).trim());
    const map = {};
    header.forEach((h, i) => { if (KNOWN_COLS[h]) map[KNOWN_COLS[h]] = i; });
    const missing = REQUIRED_COLS.filter(c => {
      const key = KNOWN_COLS[Core.norm(c)];
      return map[key] === undefined;
    });
    const out = { total: 0, valid: [], errors: [], duplicates: [], missing };
    if (missing.length) return out;

    const seen = new Set();
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r || r.every(c => c === null || c === undefined || String(c).trim() === "")) continue;
      out.total++;
      const get = k => (map[k] === undefined ? "" : String(r[map[k]] ?? "").trim());
      const label = get("label");
      const category = get("category");
      const unit = get("unit");
      const priceHT = Core.parseNum(get("priceHT"));
      if (!label) { out.errors.push({ row: i + 1, label, reason: "Désignation vide" }); continue; }
      if (!category) { out.errors.push({ row: i + 1, label, reason: "Catégorie vide" }); continue; }
      if (!unit) { out.errors.push({ row: i + 1, label, reason: "Unité vide" }); continue; }
      if (!(priceHT > 0)) { out.errors.push({ row: i + 1, label, reason: "Prix HT absent ou non numérique" }); continue; }
      const key = Core.norm(category) + "|" + Core.norm(label);
      if (seen.has(key)) { out.errors.push({ row: i + 1, label, reason: "Doublon dans le fichier" }); continue; }
      seen.add(key);
      const existing = Repo.items.list().some(it => {
        const c = Repo.categories.get(it.categoryId);
        return Core.norm(it.label) === Core.norm(label) && c && Core.norm(c.name) === Core.norm(category);
      });
      const rec = {
        category, subCategory: get("subCategory"), label, unit, priceHT,
        vatRate: map.vatRate === undefined ? (Repo.settings.get().defaultVat || 5.5) : (Core.parseNum(get("vatRate")) || 0),
        source: get("source"), priceDate: normalizeDate(get("priceDate")),
        region: get("region"), supplier: get("supplier"),
        description: get("description"), comment: get("comment"),
        isDuplicate: existing,
      };
      if (existing) out.duplicates.push(rec);
      out.valid.push(rec);
    }
    return out;
  }

  function normalizeDate(v) {
    if (!v) return Core.nowIso().slice(0, 10);
    const s = String(v).trim();
    let m = s.match(/^(\d{2})[/-](\d{2})[/-](\d{4})$/);
    if (m) return `${m[3]}-${m[2]}-${m[1]}`;
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    const d = new Date(s);
    return isNaN(d) ? Core.nowIso().slice(0, 10) : d.toISOString().slice(0, 10);
  }

  /** Lit un .xlsx (ExcelJS) ou un .csv en tableau de tableaux. */
  async function readTable(file) {
    const name = (file.name || "").toLowerCase();
    if (name.endsWith(".csv") || file.type === "text/csv") {
      const text = await file.text();
      const sep = (text.split("\n")[0].match(/;/g) || []).length >= (text.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
      return text.replace(/^﻿/, "").split(/\r?\n/).filter(l => l.trim() !== "").map(line => splitCsv(line, sep));
    }
    if (!requireExcelJS()) throw new Error("Bibliothèque Excel indisponible.");
    const buf = await file.arrayBuffer();
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buf);
    const ws = wb.worksheets[0];
    if (!ws) throw new Error("Aucune feuille dans le classeur.");
    const rows = [];
    ws.eachRow({ includeEmpty: false }, row => {
      const vals = [];
      row.eachCell({ includeEmpty: true }, cell => {
        let v = cell.value;
        if (v && typeof v === "object") {
          if (v.result !== undefined) v = v.result;
          else if (v.text !== undefined) v = v.text;
          else if (v instanceof Date) v = v.toISOString().slice(0, 10);
          else if (Array.isArray(v.richText)) v = v.richText.map(t => t.text).join("");
        }
        vals.push(v);
      });
      rows.push(vals);
    });
    return rows;
  }

  function splitCsv(line, sep) {
    const out = []; let cur = ""; let q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (q) {
        if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
        else if (c === '"') q = false;
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === sep) { out.push(cur); cur = ""; }
      else cur += c;
    }
    out.push(cur);
    return out;
  }

const Reporting = (() => {

  const { num } = Core;

  const INK = [22, 33, 42];
  const ACCENT = [27, 90, 115];
