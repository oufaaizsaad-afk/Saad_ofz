  const LINE = [216, 224, 229];
  const SOFT = [226, 237, 242];

  const money = n => new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 }).format(Math.round(Number(n) || 0)) + " \u20ac";
  const money2 = n => new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(n) || 0) + " \u20ac";

  /**
   * Les polices standard du PDF sont encodees en WinAnsi : les espaces fines
   * insecables des nombres francais et quelques caracteres (m2, oe) n'y sont
   * pas representables. On normalise tout le texte en amont, une seule fois,
   * en interceptant doc.text et doc.autoTable.
   */
  function clean(v) {
    if (v === null || v === undefined) return v;
    if (typeof v !== "string") return v;
    return v
      .replace(/[\u202f\u00a0\u2009]/g, " ")
      .replace(/\u00b2/g, "2").replace(/\u00b3/g, "3")
      .replace(/\u0153/g, "oe").replace(/\u0152/g, "OE")
      .replace(/\u2264/g, "<=").replace(/\u2265/g, ">=");
  }
  function cleanDeep(v) {
    if (Array.isArray(v)) return v.map(cleanDeep);
    if (v && typeof v === "object") {
      if (v.content !== undefined) return Object.assign({}, v, { content: cleanDeep(v.content) });
      return v;
    }
    return clean(v);
  }
  /** Applique la normalisation a toutes les sorties texte du document. */
  function harden(doc) {
    const rawText = doc.text.bind(doc);
    doc.text = (t, ...rest) => rawText(Array.isArray(t) ? t.map(clean) : clean(t), ...rest);
    const rawSplit = doc.splitTextToSize.bind(doc);
    doc.splitTextToSize = (t, ...rest) => rawSplit(clean(t), ...rest);
    const rawAuto = doc.autoTable.bind(doc);
    doc.autoTable = (opts) => rawAuto(Object.assign({}, opts, {
      head: opts.head ? cleanDeep(opts.head) : opts.head,
      body: opts.body ? cleanDeep(opts.body) : opts.body,
    }));
    return doc;
  }

  function ready() {
    if (typeof window.jspdf === "undefined" || !window.jspdf.jsPDF) {
      UI.toast("La bibliothèque PDF n'a pas pu être chargée (réseau ?). Réessayez dans un instant.", "err", 6000);
      return null;
    }
    return window.jspdf.jsPDF;
  }

  async function projectPdf(p) {
    if (!p) return UI.toast("Aucun projet sélectionné.", "warn");
    const JsPDF = ready();
    if (!JsPDF) return;

    const s = Repo.settings.get();
    const refs = { coefficients: Repo.coefficients.all() };
    const all = Calc.compare(p, refs);
    const sel = p.scenarios.find(x => x.selected) || p.scenarios[0];
    const t = all.find(x => x.scenarioId === (sel && sel.id)) || all[0];

    const doc = harden(new JsPDF({ unit: "mm", format: "a4" }));
    const W = doc.internal.pageSize.getWidth();
    const H = doc.internal.pageSize.getHeight();
    const M = 16;
    const dateStr = new Intl.DateTimeFormat("fr-FR", { day: "2-digit", month: "long", year: "numeric" }).format(new Date());

    /* ------------------------------------------------------- Page de garde */
    doc.setFillColor(...INK);
    doc.rect(0, 0, W, 62, "F");
    if (s.bureauLogo) {
      try { doc.addImage(s.bureauLogo, "PNG", M, 14, 30, 30); } catch (e) { /* logo illisible : ignoré */ }
    }
    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9);
    doc.text((s.bureauName || "Bureau d'études").toUpperCase(), s.bureauLogo ? M + 36 : M, 22);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    if (s.bureauAddress) doc.text(s.bureauAddress, s.bureauLogo ? M + 36 : M, 27);
    if (s.bureauContact) doc.text(s.bureauContact, s.bureauLogo ? M + 36 : M, 31.5);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(20);
    doc.text("Chiffrage de travaux", M, 47);
    doc.setFontSize(11);
    doc.setFont("helvetica", "normal");
    doc.text(p.missionType || "", M, 54);

    doc.setTextColor(...INK);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(17);
    doc.text(doc.splitTextToSize(p.name, W - 2 * M), M, 78);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10.5);
    doc.setTextColor(...MUTED);
    let y = 88 + (doc.splitTextToSize(p.name, W - 2 * M).length - 1) * 7;
    [
      p.coproName, [p.address, p.postalCode, p.city].filter(Boolean).join(" "),
      p.department ? "Département " + p.department : "",
    ].filter(Boolean).forEach(l => { doc.text(l, M, y); y += 5.5; });

    y += 6;
    const facts = [
      ["Référence dossier", p.reference || "—"],
      ["Version du chiffrage", p.version],
      ["Date du chiffrage", Core.dateFR(p.studyDate)],
      ["Chargé d'étude", p.engineer || "—"],
      ["Édité le", dateStr],
      ["Niveau de précision", p.precisionLevel + "  (± " + num(p.uncertainty, 0) + " %)"],
    ];
    doc.setDrawColor(...LINE);
    facts.forEach(([k, v]) => {
      doc.setTextColor(...MUTED); doc.setFontSize(8.5);
      doc.text(k.toUpperCase(), M, y);
      doc.setTextColor(...INK); doc.setFontSize(10.5);
      doc.text(String(v), M + 52, y);
      y += 7;
    });

    if (t) {
      y += 4;
      doc.setFillColor(...SOFT);
      doc.roundedRect(M, y, W - 2 * M, 30, 2, 2, "F");
      doc.setTextColor(...MUTED); doc.setFontSize(8.5);
      doc.text("MONTANT TOTAL TTC — " + t.name.toUpperCase(), M + 6, y + 9);
      doc.setTextColor(...ACCENT); doc.setFont("helvetica", "bold"); doc.setFontSize(19);
      doc.text(money(t.totalTTC), M + 6, y + 20);
      doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...MUTED);
      doc.text("Fourchette " + money(t.range.ttcLow) + " – " + money(t.range.ttcHigh), M + 6, y + 26);
    }

    doc.setTextColor(...MUTED); doc.setFontSize(8);
    doc.text("Estimation établie par un bureau d'études — ne constitue pas un devis d'entreprise.", M, H - 14);

    /* ------------------------------------------------------------ Résumé */
    doc.addPage();
    sectionTitle(doc, "Résumé du chiffrage", M);
    doc.autoTable({
      startY: 32, margin: { left: M, right: M },
      body: [
        ["Scénario retenu", t ? t.name : "—"],
        ["Nombre de postes chiffrés", t ? String(t.nbLines) : "0"],
        ["Nombre de bâtiments", String((p.buildings || []).length)],
        ["Nombre de logements", String(Calc.dwellings(p))],
        ["Surface habitable", p.livingArea ? num(p.livingArea, 0) + " m2" : "—"],
        ["Travaux HT", money(t ? t.worksHT : 0)],
        ["Frais annexes HT", money(t ? t.feesHT : 0)],
        ["Total HT", money(t ? t.totalHT : 0)],
        ["TVA", money(t ? t.totalVAT : 0)],
        ["Total TTC", money(t ? t.totalTTC : 0)],
        ["Fourchette d'estimation TTC", t ? money(t.range.ttcLow) + " à " + money(t.range.ttcHigh) : "—"],
        ["Total des aides", money(t ? t.aidsTotal : 0)],
        ["Reste à charge", money(t ? t.remainder : 0)],
        ["Coût TTC par logement", money(t ? t.perDwellingTTC : 0)],
        ["Reste à charge par logement", money(t ? t.perDwellingRemainder : 0)],
      ],
      theme: "grid", styles: baseStyle(), columnStyles: { 0: { fontStyle: "bold", cellWidth: 78 }, 1: { halign: "right" } },
    });

    if (p.buildings && p.buildings.length && t) {
      doc.autoTable({
        startY: doc.lastAutoTable.finalY + 8, margin: { left: M, right: M },
        head: [["Bâtiment", "Logements", "Total HT", "Total TTC", "€ / logement"]],
        body: t.byBuilding.map(b => [b.name, String(b.nbDwellings || "—"), money(b.ht), money(b.ttc),
          b.perDwellingTTC ? money(b.perDwellingTTC) : "—"]),
        theme: "grid", styles: baseStyle(), headStyles: headStyle(),
        columnStyles: { 1: { halign: "right" }, 2: { halign: "right" }, 3: { halign: "right" }, 4: { halign: "right" } },
      });
    }

    /* ------------------------------------------------------- État initial DPE */
    dpeProjectSection(doc, p, M, W);

    /* ------------------------------------------------------------ Travaux */
    doc.addPage();
    sectionTitle(doc, "Détail des travaux — " + (t ? t.name : ""), M);
    const byCat = t ? Core.groupBy(t.lines, x => x.line.categoryId) : new Map();
    const body = [];
    byCat.forEach((rows, catId) => {
      const c = Repo.categories.get(catId);
      body.push([{ content: (c ? c.name : "Hors catégorie") + "  —  " + money(Core.sum(rows, r => r.t.totalHT)) + " HT",
        colSpan: 6, styles: { fillColor: SOFT, textColor: INK, fontStyle: "bold" } }]);
      rows.forEach(({ line, t: lt }) => body.push([
        line.label, num(lt.quantity, 2) + " " + line.unit, money2(lt.unitPriceHT),
        num(line.vatRate, 1) + " %", money(lt.totalHT), money(lt.totalTTC),
      ]));
    });
    doc.autoTable({
      startY: 32, margin: { left: M, right: M },
      head: [["Désignation", "Quantité", "PU HT", "TVA", "Total HT", "Total TTC"]],
      body: body.length ? body : [["Aucun poste chiffré", "", "", "", "", ""]],
      theme: "grid", styles: baseStyle(), headStyles: headStyle(),
      columnStyles: { 0: { cellWidth: 68 }, 1: { halign: "right" }, 2: { halign: "right" }, 3: { halign: "right" }, 4: { halign: "right" }, 5: { halign: "right" } },
    });

    if (t && t.fees.length) {
      doc.autoTable({
        startY: doc.lastAutoTable.finalY + 8, margin: { left: M, right: M },
        head: [["Frais annexes", "Mode", "Montant HT", "TVA", "Montant TTC"]],
        body: t.fees.map(f => [f.fee.label, feeMode(f.fee), money(f.ht), num(f.fee.vatRate, 1) + " %", money(f.ttc)]),
        theme: "grid", styles: baseStyle(), headStyles: headStyle(),
        columnStyles: { 2: { halign: "right" }, 3: { halign: "right" }, 4: { halign: "right" } },
      });
    }

    /* ---------------------------------------------------------- Scénarios */
    if (all.length) {
      doc.addPage();
      sectionTitle(doc, "Comparaison des scénarios", M);
      const rows = [
        ["Nombre de postes", all.map(x => String(x.nbLines))],
        ["Travaux HT", all.map(x => money(x.totalHT))],
        ["TVA", all.map(x => money(x.totalVAT))],
        ["Travaux TTC", all.map(x => money(x.totalTTC))],
        ["Aides", all.map(x => money(x.aidsTotal))],
        ["Reste à charge", all.map(x => money(x.remainder))],
        ["€ / logement (TTC)", all.map(x => money(x.perDwellingTTC))],
        ["Économie d'énergie", all.map(x => num(x.eco.savingPct, 0) + " %")],
        ["Économie € / an", all.map(x => (x.eco.annualSaving ? money(x.eco.annualSaving) : "—"))],
        ["Temps de retour", all.map(x => (x.eco.payback ? num(x.eco.payback, 1) + " ans" : "—"))],
      ];
      doc.autoTable({
        startY: 32, margin: { left: M, right: M },
        head: [["Indicateur", ...all.map(x => x.name)]],
        body: rows.map(r => [r[0], ...r[1]]),
        theme: "grid", styles: baseStyle(), headStyles: headStyle(),
        columnStyles: Object.fromEntries(all.map((_, i) => [i + 1, { halign: "right" }])),
        didParseCell: data => {
          if (data.section === "body" && data.column.index > 0) {
            const sc = p.scenarios[data.column.index - 1];
            if (sc && sc.selected) data.cell.styles.fillColor = SOFT;
          }
        },
      });
      let yy = doc.lastAutoTable.finalY + 8;
      all.forEach(x => {
        const sc = p.scenarios.find(z => z.id === x.scenarioId);
        if (!sc || !sc.description) return;
        doc.setFontSize(9); doc.setTextColor(...INK); doc.setFont("helvetica", "bold");
        doc.text(x.name, M, yy); yy += 5;
        doc.setFont("helvetica", "normal"); doc.setTextColor(...MUTED);
        const lines = doc.splitTextToSize(sc.description, W - 2 * M);
        doc.text(lines, M, yy); yy += lines.length * 4.5 + 4;
      });
    }

    /* --------------------------------------------------------------- Aides */
    doc.addPage();
    sectionTitle(doc, "Aides financières et reste à charge", M);
    doc.autoTable({
      startY: 32, margin: { left: M, right: M },
      head: [["Aide", "Mode", "Montant", "Statut"]],
      body: t && t.aids.length
        ? t.aids.map(a => [a.aid.label, aidMode(a.aid), money(a.amount), a.aid.verified ? "Vérifié" : "À vérifier"])
        : [["Aucune aide renseignée pour ce scénario", "", "", ""]],
      theme: "grid", styles: baseStyle(), headStyles: headStyle(),
      columnStyles: { 2: { halign: "right" } },
    });
    doc.autoTable({
      startY: doc.lastAutoTable.finalY + 6, margin: { left: M, right: M },
      body: [
        ["Montant TTC des travaux", money(t ? t.totalTTC : 0)],
        ["Total des aides", "- " + money(t ? t.aidsTotal : 0)],
        ["Reste à charge", money(t ? t.remainder : 0)],
        ["Reste à charge par logement", money(t ? t.perDwellingRemainder : 0)],
        ["Reste à charge par tantième", p.totalTantiemes ? money2(Calc.perTantieme(t ? t.remainder : 0, p)) : "—"],
      ],
      theme: "grid", styles: baseStyle(),
      columnStyles: { 0: { fontStyle: "bold", cellWidth: 78 }, 1: { halign: "right" } },
    });
    noteBlock(doc, doc.lastAutoTable.finalY + 8, M, W,
      "Les montants d'aide indiqués reposent sur les paramètres saisis dans l'application. Les barèmes et conditions "
      + "des dispositifs (MaPrimeRénov', CEE, éco-PTZ, aides locales) évoluent et doivent être vérifiés auprès des "
      + "sources officielles en vigueur à la date de l'étude.");

    /* -------------------------------------------------- Analyse économique */
    doc.addPage();
    sectionTitle(doc, "Analyse économique", M);
    const eco = p.economics || {};
    doc.autoTable({
      startY: 32, margin: { left: M, right: M },
      head: [["Hypothèse", "Valeur"]],
      body: [
        ["Consommation avant travaux", eco.consoBefore ? num(eco.consoBefore, 0) + " kWh/an" : "—"],
        ["Prix de l'énergie", eco.energyPrice ? money2(eco.energyPrice) + " / kWh" : "—"],
        ["Inflation énergie", num(eco.energyInflation, 1) + " %/an"],
        ["Charges d'exploitation avant / après", money(eco.opexBefore) + "  /  " + money(eco.opexAfter)],
        ["Taux d'actualisation", num(eco.discountRate, 1) + " %"],
        ["Horizon d'analyse", num(eco.horizon, 0) + " ans"],
      ],
      theme: "grid", styles: baseStyle(), headStyles: headStyle(),
      columnStyles: { 0: { cellWidth: 78 }, 1: { halign: "right" } },
    });
    doc.autoTable({
      startY: doc.lastAutoTable.finalY + 8, margin: { left: M, right: M },
      head: [["Indicateur", ...all.map(x => x.name)]],
      body: [
        ["CAPEX TTC", ...all.map(x => money(x.eco.capex))],
        ["CAPEX net d'aides", ...all.map(x => money(x.eco.netCapex))],
        ["Énergie économisée", ...all.map(x => (x.eco.energySavedKwh ? num(x.eco.energySavedKwh, 0) + " kWh/an" : "—"))],
        ["Économie annuelle", ...all.map(x => (x.eco.annualSaving ? money(x.eco.annualSaving) : "—"))],
        ["Temps de retour net", ...all.map(x => (x.eco.payback ? num(x.eco.payback, 1) + " ans" : "—"))],
        ["VAN", ...all.map(x => (x.eco.annualSaving ? money(x.eco.npv) : "—"))],
        ["TRI", ...all.map(x => (x.eco.irr === null ? "—" : num(x.eco.irr, 1) + " %"))],
        ["Coût global", ...all.map(x => money(x.eco.globalCost))],
      ],
      theme: "grid", styles: baseStyle(), headStyles: headStyle(),
      columnStyles: Object.fromEntries(all.map((_, i) => [i + 1, { halign: "right" }])),
    });

    /* ----------------------------------------------------------- Hypothèses */
    doc.addPage();
    sectionTitle(doc, "Hypothèses et sources de prix", M);
    const sources = [...new Set((t ? t.lines : []).map(l => {
      const it = Repo.items.get(l.line.catalogItemId);
      return it ? (it.source || "Non renseignée") : "Prix saisi au projet";
    }))];
    doc.autoTable({
      startY: 32, margin: { left: M, right: M },
      head: [["Poste", "Prix catalogue HT", "Coefficients", "Prix projet HT", "Source", "Date du prix"]],
      body: (t ? t.lines : []).map(({ line, t: lt }) => {
        const it = Repo.items.get(line.catalogItemId);
        const coefs = (line.coefficientIds || []).map(id => {
          const c = Repo.coefficients.all().find(x => x.id === id);
          return c ? c.label + " (x" + num(c.value, 3) + ")" : "";
        }).filter(Boolean);
        if (line.manualCoef && line.manualCoef !== 1) coefs.push("libre x" + num(line.manualCoef, 3));
        return [line.label, money2(lt.basePrice), coefs.join(" · ") || "—", money2(lt.unitPriceHT),
          it ? (it.source || "—") : "saisi au projet", it ? Core.dateFR(it.priceDate) : "—"];
      }),
      theme: "grid", styles: Object.assign(baseStyle(), { fontSize: 7.4 }), headStyles: headStyle(),
      columnStyles: { 0: { cellWidth: 52 }, 1: { halign: "right" }, 3: { halign: "right" } },
    });
    noteBlock(doc, doc.lastAutoTable.finalY + 8, M, W,
      "Prix issus du catalogue interne du bureau d'études, hors aléas de chantier non identifiés. "
      + "Niveau de précision : " + p.precisionLevel + " (± " + num(p.uncertainty, 0) + " %). "
      + "TVA appliquée poste par poste selon la nature des travaux. "
      + (p.comment ? "Commentaires : " + p.comment : ""));

    /* -------------------------------------------------------- Pieds de page */
    const total = doc.internal.getNumberOfPages();
    for (let i = 1; i <= total; i++) {
      doc.setPage(i);
      if (i === 1) continue;
      doc.setDrawColor(...LINE);
      doc.line(M, H - 12, W - M, H - 12);
      doc.setFontSize(7.5); doc.setTextColor(...MUTED); doc.setFont("helvetica", "normal");
      doc.text((s.bureauName || "Bureau d'études") + " — " + p.name + " — " + p.version, M, H - 8);
      doc.text(i + " / " + total, W - M, H - 8, { align: "right" });
    }

    const blob = doc.output("blob");
    await ImportExport.deliver(Core.slug(p.name + "-" + p.version) + "-rapport.pdf", blob);
  }

  /* ======================================================== RAPPORTS DPE */
  const hexRgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const dn = (v, d = 0) => (Dpe.numOf(v) === null ? "—" : num(Dpe.numOf(v), d));
  const dv = v => (v === null || v === undefined || v === "" ? "—" : String(v));
  const unitOr = (v, d, u) => (Dpe.numOf(v) === null ? "—" : num(Dpe.numOf(v), d) + " " + u);

  /** Pastille de classe dessinée (énergie ou GES). */
  function classBox(doc, cls, x, y, size, kind) {
    const pal = kind === "ges" ? Dpe.GES_COLORS : Dpe.COLORS;
    if (!cls || !pal[cls]) {
      doc.setFillColor(233, 238, 241); doc.roundedRect(x, y, size, size, 1.5, 1.5, "F");
      doc.setTextColor(...MUTED); doc.setFontSize(size * 1.4); doc.text("—", x + size / 2, y + size * 0.68, { align: "center" });
      return;
    }
    doc.setFillColor(...hexRgb(pal[cls][0]));
    doc.roundedRect(x, y, size, size, 1.5, 1.5, "F");
    doc.setTextColor(...hexRgb(pal[cls][1]));
    doc.setFont("helvetica", "bold"); doc.setFontSize(size * 1.7);
    doc.text(cls, x + size / 2, y + size * 0.72, { align: "center" });
    doc.setFont("helvetica", "normal");
  }

  function dpeHeader(doc, title, sub, W, M) {
    doc.setFillColor(...INK); doc.rect(0, 0, W, 26, "F");
    doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(14);
    doc.text(title, M, 13);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5);
    doc.text(sub, M, 19.5);
    doc.text(new Intl.DateTimeFormat("fr-FR").format(new Date()), W - M, 13, { align: "right" });
  }

  function dpeFooters(doc, label, W, H, M) {
    const s = Repo.settings.get();
    const total = doc.internal.getNumberOfPages();
    for (let i = 1; i <= total; i++) {
      doc.setPage(i);
      doc.setDrawColor(...LINE); doc.line(M, H - 12, W - M, H - 12);
      doc.setFontSize(7.5); doc.setTextColor(...MUTED); doc.setFont("helvetica", "normal");
      doc.text((s.bureauName || "Bureau d'études") + " — " + label, M, H - 8);
      doc.text(i + " / " + total, W - M, H - 8, { align: "right" });
    }
  }

  const kvHead = (t) => [{ content: t.toUpperCase(), colSpan: 2, styles: { fillColor: SOFT, textColor: ACCENT, fontStyle: "bold", fontSize: 7.6 } }];

  /** Rapport d'un DPE : identité, étiquettes, systèmes, déperditions, parois. */
  async function dpePdf(rec, contextName) {
    const JsPDF = ready();
    if (!JsPDF) return;
    const d = rec.data || {};
    const sm = Dpe.summary(d);
    const s = d.sortie || {};
    const doc = harden(new JsPDF({ unit: "mm", format: "a4" }));
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 14;

    dpeHeader(doc, "Rapport DPE — extraction des données", contextName + "  ·  " + rec.fileName, W, M);
    doc.setTextColor(...INK); doc.setFont("helvetica", "bold"); doc.setFontSize(12);
    const addr = doc.splitTextToSize(sm.address || rec.fileName, W - 2 * M - 70);
    doc.text(addr, M, 36);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...MUTED);
    const facts = [sm.year ? "Construit en " + sm.year : "", sm.surface ? num(sm.surface, 0) + " m2 habitables" : "",
      sm.zone ? "Zone " + sm.zone : "", sm.date ? "Visite du " + sm.date : ""].filter(Boolean).join("  ·  ");
    doc.text(facts, M, 36 + addr.length * 5 + 1);

    // Étiquettes
    const bx = W - M - 62;
    classBox(doc, sm.cls, bx, 30, 16, "ep");
    doc.setTextColor(...INK); doc.setFontSize(8); doc.setFont("helvetica", "bold");
    doc.text("Énergie", bx + 19, 34);
    doc.setFont("helvetica", "normal");
    doc.text(sm.epM2 !== null ? num(sm.epM2, 0) + " kWh EP/m2.an" : "—", bx + 19, 39);
    doc.setTextColor(...MUTED); doc.setFontSize(7);
    doc.text(sm.clsSource === "fichier" ? "classe du fichier" : sm.clsSource === "calcul" ? "classe recalculée" : "", bx + 19, 43.5);
    classBox(doc, sm.gesCls, bx + 44, 32, 11, "ges");
    doc.setTextColor(...MUTED); doc.setFontSize(7);
    doc.text("GES", bx + 49.5, 47, { align: "center" });

    const g = d.genCH || {}, e = d.emetteur || {}, w = d.genECS || {}, v = d.vmc || {};
    const L = Dpe.losses([rec]);
    const left = [
      kvHead("Identification"),
      ["Adresse", dv(sm.address)], ["Commune", dv([sm.postcode, sm.city].filter(Boolean).join(" "))],
      ["N° DPE", dv(sm.numero)], ["Logiciel", dv(sm.software)],
      kvHead("Caractéristiques"),
      ["Année / période", dv([sm.year, sm.period].filter(Boolean).join(" · "))],
      ["Surface habitable", unitOr(sm.surface, 2, "m2")], ["Hauteur sous plafond", unitOr(sm.hsp, 2, "m")],
      ["Zone / altitude", dv([sm.zone, sm.altitude ? sm.altitude + " m" : ""].filter(Boolean).join(" · "))],
      ["Inertie", dv(sm.inertie)],
      kvHead("Ventilation"),
      ["Type", dv(v.type_ventilation)], ["Q4Pa conv.", unitOr(v.q4pa_conv, 2, "m3/h.m2")],
      ["Hvent / Hperm", dn(v.hvent, 2) + " / " + dn(v.hperm, 2) + " W/K"],
    ];
    const right = [
      kvHead("Chauffage"),
      ["Générateur", dv(g.type_generateur_ch)], ["Énergie", dv(g.type_energie)],
      ["Puissance nominale", Dpe.numOf(g.pn) !== null ? num(Dpe.numOf(g.pn) / 1000, 1) + " kW" : "—"],
      ["Rendement génération", Dpe.numOf(g.rendement_generation) !== null ? num(Dpe.numOf(g.rendement_generation) * 100, 0) + " %" : "—"],
      ["Émission", dv(e.type_emission_distribution)],
      kvHead("Eau chaude sanitaire"),
      ["Générateur", dv(w.type_generateur_ecs)], ["Énergie", dv(w.type_energie)], ["Stockage", dv(w.type_stockage_ecs)],
      kvHead("Bilan"),
      ["Besoin chauffage", unitOr(s.besoin_ch, 0, "kWh/an")], ["Besoin ECS", unitOr(s.besoin_ecs, 0, "kWh/an")],
      ["Total 5 usages (EP)", unitOr(sm.ep, 0, "kWh EP/an")],
      ...(sm.hasEp ? [["Total 5 usages (EF)", unitOr(sm.ef, 0, "kWh EF/an")]] : []),
      ["Émissions GES", unitOr(sm.gesM2, 1, "kgCO2/m2.an")],
      ["Coût annuel estimé", sm.cost !== null ? money(sm.cost) : "—"],
    ];
    const half = (W - 2 * M - 4) / 2;
    const kvStyles = Object.assign(baseStyle(), { fontSize: 7.6, cellPadding: 1.6 });
    doc.autoTable({ startY: 54, margin: { left: M, right: W - M - half }, body: left, theme: "grid", styles: kvStyles,
      columnStyles: { 0: { textColor: MUTED, cellWidth: half * 0.4 } } });
    const yl = doc.lastAutoTable.finalY;
    doc.autoTable({ startY: 54, margin: { left: M + half + 4, right: M }, body: right, theme: "grid", styles: kvStyles,
      columnStyles: { 0: { textColor: MUTED, cellWidth: half * 0.4 } } });
    let y = Math.max(yl, doc.lastAutoTable.finalY) + 7;

    // Déperditions
    if (L.total > 0) {
      if (y > H - 70) { doc.addPage(); y = 20; }
      doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(...ACCENT);
      doc.text("Répartition des déperditions — " + num(L.total, 0) + " W/K", M, y); y += 4;
      L.rows.filter(r => r.value > 0).forEach(r => {
        doc.setFont("helvetica", "normal"); doc.setFontSize(7.8); doc.setTextColor(...INK);
        doc.text(r.label, M, y + 3.4);
        doc.setFillColor(233, 238, 241); doc.rect(M + 40, y + 1, W - 2 * M - 80, 3, "F");
        doc.setFillColor(...hexRgb(r.color)); doc.rect(M + 40, y + 1, (W - 2 * M - 80) * r.pct / 100, 3, "F");
        doc.setTextColor(...MUTED);
        doc.text(num(r.pct, 1) + " %  ·  " + num(r.value, 0) + " W/K", W - M, y + 3.4, { align: "right" });
        y += 5.6;
      });
      y += 4;
    }

    // Parois
    const table = (title, head, rows) => {
      if (!rows.length) return;
      doc.autoTable({
        startY: y, margin: { left: M, right: M },
        head: [[{ content: title + " (" + rows.length + ")", colSpan: head.length, styles: { fillColor: SOFT, textColor: ACCENT, fontStyle: "bold" } }], head],
        body: rows, theme: "grid", styles: Object.assign(baseStyle(), { fontSize: 7.2, cellPadding: 1.5 }), headStyles: headStyle(),
      });
      y = doc.lastAutoTable.finalY + 5;
    };
    table("Murs", ["Orientation", "Adjacence", "Matériaux", "Isolation", "Surface m2", "U"],
      (d.murs || []).map(x => [dv(x.orientation), dv(x.type_adjacence), dv(x.materiaux_structure_mur), dv(x.type_isolation), dn(x.surface_paroi_opaque, 2), dn(x.umur, 2)]));
    table("Planchers bas", ["Adjacence", "Type", "Isolation", "Surface m2", "U"],
      (d.pbas || []).map(x => [dv(x.type_adjacence), dv(x.type_plancher_bas), dv(x.type_isolation), dn(x.surface_paroi_opaque, 2), dn(x.upb_final !== undefined ? x.upb_final : x.upb, 3)]));
    table("Planchers hauts", ["Adjacence", "Type", "Isolation", "Surface m2", "U"],
      (d.phauts || []).map(x => [dv(x.type_adjacence), dv(x.type_plancher_haut), dv(x.type_isolation), dn(x.surface_paroi_opaque, 2), dn(x.uph, 2)]));
    table("Baies vitrées", ["Orientation", "Vitrage", "Menuiserie", "Fermeture", "Surface m2", "Uw"],
      (d.baies || []).map(x => [dv(x.orientation), dv(x.type_vitrage), dv(x.type_materiaux_menuiserie), dv(x.type_fermeture), dn(x.surface_totale_baie, 2), dn(x.uw, 2)]));
    table("Portes", ["Adjacence", "Type", "Surface m2", "U"],
      (d.portes || []).map(x => [dv(x.type_adjacence), dv(x.type_porte), dn(x.surface_porte, 2), dn(x.uporte, 2)]));

    dpeFooters(doc, "Rapport DPE — " + rec.fileName, W, H, M);
    await ImportExport.deliver("rapport-dpe-" + Core.slug(rec.fileName.replace(/\.xlsx?$/i, "")) + ".pdf", doc.output("blob"));
  }

  /** Tableau récapitulatif des DPE (partagé synthèse / rapport projet). */
  function dpeRecapTable(doc, list, startY, M) {
    doc.autoTable({
      startY, margin: { left: M, right: M },
      head: [["Fichier", "Adresse", "Surface", "Classe", "GES", "EP kWh/m2", "Besoin CH", "Déperd. W/K"]],
      body: list.map(r => {
        const sm = Dpe.summary(r.data);
        return [r.fileName.replace(/\.xlsx?$/i, ""), sm.address || "—", sm.surface ? num(sm.surface, 0) + " m2" : "—",
          sm.cls || "—", sm.gesCls || "—", dn(sm.epM2, 0), dn(sm.besoinCh, 0), dn(sm.deperd, 0)];
      }),
      theme: "grid", styles: Object.assign(baseStyle(), { fontSize: 7.4 }), headStyles: headStyle(),
      columnStyles: { 0: { cellWidth: 36 }, 2: { halign: "right" }, 3: { halign: "center", fontStyle: "bold" }, 4: { halign: "center" },
        5: { halign: "right" }, 6: { halign: "right" }, 7: { halign: "right" } },
      didParseCell: data => {
        if (data.section !== "body") return;
        const pal = data.column.index === 3 ? Dpe.COLORS : data.column.index === 4 ? Dpe.GES_COLORS : null;
        const c = pal && pal[data.cell.raw];
        if (c) { data.cell.styles.fillColor = hexRgb(c[0]); data.cell.styles.textColor = hexRgb(c[1]); }
      },
    });
    return doc.lastAutoTable.finalY;
  }

  function classStrip(doc, list, x, y, w) {
    const dist = Dpe.classDistribution(list);
    const n = list.length || 1;
    const cw = (w - 6 * 2) / 7;
    Dpe.LETTERS.forEach((L, i) => {
      const cx = x + i * (cw + 2);
      const c = dist[L] || 0;
      doc.setFillColor(...hexRgb(Dpe.COLORS[L][0]));
      if (!c) doc.setFillColor(233, 238, 241);
      doc.roundedRect(cx, y, cw, 9, 1, 1, "F");
      doc.setTextColor(...(c ? hexRgb(Dpe.COLORS[L][1]) : MUTED));
      doc.setFont("helvetica", "bold"); doc.setFontSize(10);
      doc.text(L, cx + cw / 2, y + 6.2, { align: "center" });
      doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(...INK);
      doc.text(c ? c + "  ·  " + num(c / n * 100, 0) + " %" : "0", cx + cw / 2, y + 13, { align: "center" });
    });
    return y + 17;
  }

  /** Synthèse multi-DPE (reprend la synthèse projet du DPE Infos Extractor). */
  async function dpeSynthPdf(list, name) {
    if (!list || !list.length) return UI.toast("Aucun DPE à synthétiser.", "warn");
    const JsPDF = ready();
    if (!JsPDF) return;
    const doc = harden(new JsPDF({ unit: "mm", format: "a4" }));
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 14;
    const n = list.length;
    dpeHeader(doc, "Synthèse DPE — " + name, n + " DPE analysé" + (n > 1 ? "s" : ""), W, M);

    const a = fn => Dpe.avg(list, fn);
    const m = Dpe.metrics(list);
    doc.autoTable({
      startY: 32, margin: { left: M, right: M },
      head: [["DPE", "Surface cumulée", "Surface moy.", "EP moy. kWh/m2", "Besoin CH moy.", "Déperd. moy."]],
      body: [[String(n), num(m.livingArea, 0) + " m2", a(s => s.surface) ? num(a(s => s.surface), 0) + " m2" : "—",
        a(s => s.epM2) ? num(a(s => s.epM2), 0) : "—", a(s => s.besoinCh) ? num(a(s => s.besoinCh), 0) + " kWh/an" : "—",
        a(s => s.deperd) ? num(a(s => s.deperd), 0) + " W/K" : "—"]],
      theme: "grid", styles: Object.assign(baseStyle(), { halign: "center", fontStyle: "bold", fontSize: 9 }), headStyles: Object.assign(headStyle(), { halign: "center" }),
    });
    let y = doc.lastAutoTable.finalY + 7;
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...ACCENT);
    doc.text("Distribution des classes énergie", M, y); y += 3;
    y = classStrip(doc, list, M, y, W - 2 * M) + 3;

    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...ACCENT);
    doc.text("Métrés cumulés issus des DPE", M, y); y += 2;
    doc.autoTable({
      startY: y, margin: { left: M, right: M },
      head: [["Façades ext.", "Toiture", "Plancher bas", "Vitrages", "Baies"]],
      body: [[num(m.facadeArea, 0) + " m2", num(m.roofArea, 0) + " m2", num(m.lowFloorArea, 0) + " m2", num(m.glazingArea, 0) + " m2", num(m.nbBaies, 0)]],
      theme: "grid", styles: Object.assign(baseStyle(), { halign: "center" }), headStyles: Object.assign(headStyle(), { halign: "center" }),
    });
    y = doc.lastAutoTable.finalY + 6;

    // Groupes en deux colonnes
    const groups = Dpe.synthGroups(list).filter(gp => gp.sorted.length);
    const half = (W - 2 * M - 4) / 2;
    for (let i = 0; i < groups.length; i += 2) {
      if (y > H - 60) { doc.addPage(); y = 20; }
      let yMax = y;
      [groups[i], groups[i + 1]].forEach((gp, j) => {
        if (!gp) return;
        doc.autoTable({
          startY: y, margin: { left: M + j * (half + 4), right: j ? M : W - M - half },
          head: [[{ content: gp.title.toUpperCase(), styles: { fillColor: hexRgb(gp.color), textColor: [255, 255, 255] } },
            { content: gp.total + " occ.", styles: { fillColor: hexRgb(gp.color), textColor: [255, 255, 255], halign: "right" } }]],
          body: gp.sorted.slice(0, 8).map(([label, c]) => [label, c + "  (" + num(c / gp.total * 100, 0) + " %)"]),
          theme: "grid", styles: Object.assign(baseStyle(), { fontSize: 7, cellPadding: 1.4 }),
          headStyles: Object.assign(headStyle(), { fontSize: 7 }),
          columnStyles: { 1: { halign: "right", cellWidth: 24 } },
        });
        yMax = Math.max(yMax, doc.lastAutoTable.finalY);
      });
      y = yMax + 4;
    }

    doc.addPage();
    sectionTitle(doc, "Récapitulatif des DPE", M);
    dpeRecapTable(doc, list, 32, M);

    dpeFooters(doc, "Synthèse DPE — " + name, W, H, M);
    await ImportExport.deliver("synthese-dpe-" + Core.slug(name) + ".pdf", doc.output("blob"));
  }

  /** Section « État initial » du rapport de chiffrage. */
  function dpeProjectSection(doc, p, M, W) {
    const list = p.dpes || [];
    if (!list.length) return;
    doc.addPage();
    sectionTitle(doc, "État initial — diagnostics DPE", M);
    let y = 32;
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...MUTED);
    doc.text(list.length + " DPE rattaché(s) au projet — distribution des classes énergie :", M, y); y += 3;
    y = classStrip(doc, list, M, y, W - 2 * M) + 2;
    y = dpeRecapTable(doc, list, y, M) + 7;
    const L = Dpe.losses(list);
    const m = Dpe.metrics(list);
    doc.autoTable({
      startY: y, margin: { left: M, right: W / 2 + 2 },
      head: [["Déperditions", "W/K", "Part"]],
      body: L.rows.filter(r => r.value > 0).map(r => [r.label, num(r.value, 0), num(r.pct, 1) + " %"]).concat([["Total", num(L.total, 0), "100 %"]]),
      theme: "grid", styles: Object.assign(baseStyle(), { fontSize: 7.6 }), headStyles: headStyle(),
      columnStyles: { 1: { halign: "right" }, 2: { halign: "right" } },
    });
    const y1 = doc.lastAutoTable.finalY;
    doc.autoTable({
      startY: y, margin: { left: W / 2 + 2, right: M },
      head: [["Métrés issus des DPE", "Valeur"]],
      body: [
        ["Surface habitable", num(m.livingArea, 0) + " m2"], ["Façades extérieures", num(m.facadeArea, 0) + " m2"],
        ["Toiture / plancher haut", num(m.roofArea, 0) + " m2"], ["Plancher bas", num(m.lowFloorArea, 0) + " m2"],
        ["Vitrages", num(m.glazingArea, 0) + " m2 · " + num(m.nbBaies, 0) + " baies"],
      ],
      theme: "grid", styles: Object.assign(baseStyle(), { fontSize: 7.6 }), headStyles: headStyle(),
      columnStyles: { 1: { halign: "right" } },
    });
    noteBlock(doc, Math.max(y1, doc.lastAutoTable.finalY) + 7, M, W,
      "Données extraites des exports DPE 3CL (méthode conventionnelle ADEME 2021). Les consommations et coûts d'un DPE "
      + "reposent sur des hypothèses d'usage conventionnelles et ne reflètent pas nécessairement les consommations réelles.");
  }

  function baseStyle() {
    return { font: "helvetica", fontSize: 8.4, cellPadding: 2.2, textColor: INK, lineColor: LINE, lineWidth: 0.1 };
  }
  function headStyle() {
    return { fillColor: INK, textColor: [255, 255, 255], fontStyle: "bold", fontSize: 8 };
  }
  function sectionTitle(doc, title, M) {
    doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.setTextColor(...ACCENT);
    doc.text(title, M, 22);
    doc.setDrawColor(...ACCENT); doc.setLineWidth(0.6);
    doc.line(M, 25, M + 26, 25);
    doc.setLineWidth(0.1);
  }
  function noteBlock(doc, y, M, W, text) {
    const lines = doc.splitTextToSize(text, W - 2 * M - 8);
    doc.setFillColor(246, 248, 249);
    doc.roundedRect(M, y, W - 2 * M, lines.length * 4.2 + 8, 2, 2, "F");
    doc.setFontSize(8); doc.setTextColor(...MUTED); doc.setFont("helvetica", "normal");
    doc.text(lines, M + 4, y + 6);
  }
  const feeMode = f => ({ forfait: "Forfait", m2: "€/m²", logement: "€/logement", pct: num(f.value, 2) + " % des travaux" }[f.mode] || f.mode);
  const aidMode = a => ({ forfait: "Forfait", pct: num(a.value, 2) + " % " + (a.basis === "ttc" ? "TTC" : "HT"), logement: "€/logement", m2: "€/m²", custom: "Règle libre" }[a.mode] || a.mode);

  return { projectPdf, dpePdf, dpeSynthPdf };
})();

/* =========================================================================
 * 20 — DÉMARRAGE
 * ========================================================================= */
(function () {
  "use strict";
  function start() {
    App.boot().catch(err => {
      console.error(err);
      const root = document.getElementById("app");
      if (root) {
        root.innerHTML = `<div style="padding:40px;max-width:640px;margin:0 auto">
          <h2 style="margin-bottom:10px">L'application n'a pas pu démarrer</h2>
          <p class="muted small">${Core.esc(err.message)}</p>
          <p class="muted small" style="margin-top:10px">Rechargez la page. Si le problème persiste, exportez vos
          données depuis un autre poste ou contactez l'administrateur.</p></div>`;
      }
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();

</script>
