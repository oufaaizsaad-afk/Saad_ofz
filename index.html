<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Application de bureau d'etudes : extraction et synthese des DPE 3CL ADEME, chiffrage de travaux de renovation energetique, PPPT, DTG, audits.">
<title>BET Chiffrage — DPE & Travaux</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap">
<style>
/* =========================================================================
 * BET Chiffrage — feuille de style applicative
 * Identité : « bleu de plan » sur papier gris froid, typographie IBM Plex
 * (Sans pour l'interface, Mono pour toute donnée chiffrée, Serif réservé
 * aux pages de garde de rapport). Densité type logiciel métier.
 * ========================================================================= */

:root {
  /* Palette claire (état par défaut, y compris quand aucun thème n'est stampé) */
  --c-ground: #F1F4F6;
  --c-surface: #FFFFFF;
  --c-surface-2: #F7F9FA;
  --c-surface-3: #E9EEF1;
  --c-line: #D8E0E5;
  --c-line-soft: #E7ECEF;
  --c-text: #16212A;
  --c-text-2: #536270;
  --c-text-3: #7E8C99;
  --c-accent: #1B5A73;
  --c-accent-hover: #164A5E;
  --c-accent-soft: #E2EDF2;
  --c-accent-text: #FFFFFF;
  --c-ember: #A9501C;
  --c-ember-soft: #F8EDE5;
  --c-ok: #2C7355;
  --c-ok-soft: #E6F1EB;
  --c-warn: #96690F;
  --c-warn-soft: #FAF0DC;
  --c-danger: #A2382A;
  --c-danger-soft: #FAE9E6;
  --c-rail: #12212B;
  --c-rail-2: #1B2E3A;
  --c-rail-text: #C6D3DB;
  --c-rail-text-2: #7E93A1;
  --c-rail-active: #24404F;
  --shadow-1: 0 1px 2px rgba(18, 33, 43, .06);
  --shadow-2: 0 4px 16px rgba(18, 33, 43, .10);
  --shadow-3: 0 16px 48px rgba(18, 33, 43, .22);
  --r-sm: 4px; --r-md: 6px; --r-lg: 10px; --r-xl: 14px;
  --rail-w: 236px;
  --f-sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --f-serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --c-ground: #0D141A;
    --c-surface: #141D24;
    --c-surface-2: #18232B;
    --c-surface-3: #1F2C35;
    --c-line: #26343E;
    --c-line-soft: #1E2A33;
    --c-text: #E3EAEF;
    --c-text-2: #9AABB7;
    --c-text-3: #71838F;
    --c-accent: #5AA6C4;
    --c-accent-hover: #7CBBD5;
    --c-accent-soft: #16303C;
    --c-accent-text: #08171E;
    --c-ember: #D98A55;
    --c-ember-soft: #2B1F16;
    --c-ok: #64BC93;
    --c-ok-soft: #142A20;
    --c-warn: #D6AB5C;
    --c-warn-soft: #2A2313;
    --c-danger: #E0796A;
    --c-danger-soft: #2E1815;
    --c-rail: #0A1116;
    --c-rail-2: #101B22;
    --c-rail-text: #B6C6D1;
    --c-rail-text-2: #677A87;
    --c-rail-active: #1B2F3A;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 4px 16px rgba(0, 0, 0, .5);
    --shadow-3: 0 16px 48px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --c-ground: #0D141A;
  --c-surface: #141D24;
  --c-surface-2: #18232B;
  --c-surface-3: #1F2C35;
  --c-line: #26343E;
  --c-line-soft: #1E2A33;
  --c-text: #E3EAEF;
  --c-text-2: #9AABB7;
  --c-text-3: #71838F;
  --c-accent: #5AA6C4;
  --c-accent-hover: #7CBBD5;
  --c-accent-soft: #16303C;
  --c-accent-text: #08171E;
  --c-ember: #D98A55;
  --c-ember-soft: #2B1F16;
  --c-ok: #64BC93;
  --c-ok-soft: #142A20;
  --c-warn: #D6AB5C;
  --c-warn-soft: #2A2313;
  --c-danger: #E0796A;
  --c-danger-soft: #2E1815;
  --c-rail: #0A1116;
  --c-rail-2: #101B22;
  --c-rail-text: #B6C6D1;
  --c-rail-text-2: #677A87;
  --c-rail-active: #1B2F3A;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 4px 16px rgba(0, 0, 0, .5);
  --shadow-3: 0 16px 48px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--c-ground);
  color: var(--c-text);
  font-family: var(--f-sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--c-accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; border-radius: 3px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ------------------------------------------------------------------ Layout */
#app { display: flex; min-height: 100vh; }

.rail {
  width: var(--rail-w); flex: 0 0 var(--rail-w);
  background: var(--c-rail); color: var(--c-rail-text);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; z-index: 40;
}
.rail-brand { padding: 18px 18px 14px; display: flex; gap: 10px; align-items: center; }
.rail-mark {
  width: 30px; height: 30px; border-radius: var(--r-md); flex: 0 0 30px;
  background: linear-gradient(150deg, #2D6E8A, #12384A);
  display: grid; place-items: center; color: #DCEDF4;
  font-family: var(--f-mono); font-size: 13px; font-weight: 600; letter-spacing: -.04em;
}
.rail-title { font-size: 13.5px; font-weight: 600; color: #E8F0F5; line-height: 1.15; }
.rail-sub { font-size: 10.5px; color: var(--c-rail-text-2); letter-spacing: .07em; text-transform: uppercase; margin-top: 2px; }
.rail-nav { padding: 6px 10px; display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
.rail-group { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--c-rail-text-2); padding: 14px 8px 5px; }
.rail-link {
  display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: var(--r-md);
  color: var(--c-rail-text); background: none; border: 0; width: 100%; text-align: left;
  cursor: pointer; font-size: 13.5px; transition: background .12s, color .12s;
}
.rail-link:hover { background: var(--c-rail-2); color: #fff; }
.rail-link.active { background: var(--c-rail-active); color: #fff; font-weight: 500; }
.rail-link .ic { opacity: .85; flex: 0 0 auto; }
.rail-link.active .ic { opacity: 1; }
.rail-badge {
  margin-left: auto; font-family: var(--f-mono); font-size: 10.5px; color: var(--c-rail-text-2);
  background: var(--c-rail-2); padding: 1px 6px; border-radius: 999px;
}
.rail-foot { margin-top: auto; border-top: 1px solid #1D2E38; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.rail-user { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: var(--r-md); background: var(--c-rail-2); }
.rail-avatar {
  width: 26px; height: 26px; border-radius: 50%; flex: 0 0 26px; display: grid; place-items: center;
  background: #2C566B; color: #DCEDF4; font-size: 11px; font-weight: 600;
}
.rail-user-name { font-size: 12.5px; color: #E8F0F5; line-height: 1.2; }
.rail-user-role { font-size: 10.5px; color: var(--c-rail-text-2); }
.rail-status { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--c-rail-text-2); padding: 0 8px 2px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c-ok); flex: 0 0 6px; }
.dot.pending { background: var(--c-warn); }
.dot.err { background: var(--c-danger); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30; background: var(--c-surface);
  border-bottom: 1px solid var(--c-line); padding: 0 20px;
  display: flex; align-items: center; gap: 14px; min-height: 56px; flex-wrap: wrap;
}
.topbar h1 { font-size: 16px; }
.topbar-crumb { font-size: 11.5px; color: var(--c-text-3); letter-spacing: .04em; text-transform: uppercase; }
.topbar-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.page { padding: 20px; flex: 1; }
.page-narrow { max-width: 1100px; }

/* ---------------------------------------------------------------- Contrôles */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r-md);
  border: 1px solid var(--c-line); background: var(--c-surface); color: var(--c-text);
  font-size: 13px; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--c-surface-2); border-color: var(--c-text-3); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--c-accent); border-color: var(--c-accent); color: var(--c-accent-text); font-weight: 500; }
.btn-primary:hover { background: var(--c-accent-hover); border-color: var(--c-accent-hover); }
.btn-danger { color: var(--c-danger); border-color: var(--c-line); }
.btn-danger:hover { background: var(--c-danger-soft); border-color: var(--c-danger); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--c-text-2); }
.btn-ghost:hover { background: var(--c-surface-3); color: var(--c-text); }
.btn-sm { padding: 3px 8px; font-size: 12px; }
.btn-icon { padding: 5px; border-radius: var(--r-md); }
.btn-group { display: inline-flex; gap: 6px; }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .lbl {
  font-size: 11px; color: var(--c-text-2); letter-spacing: .05em; text-transform: uppercase; font-weight: 500;
}
.inp, select.inp, textarea.inp {
  width: 100%; padding: 6px 9px; border: 1px solid var(--c-line); border-radius: var(--r-md);
  background: var(--c-surface); color: var(--c-text); font-size: 13.5px; transition: border-color .12s, box-shadow .12s;
}
.inp:hover { border-color: var(--c-text-3); }
.inp:focus { outline: none; border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accent-soft); }
.inp.num, input.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.inp[aria-invalid="true"] { border-color: var(--c-danger); }
textarea.inp { resize: vertical; min-height: 60px; font-size: 13px; line-height: 1.5; }
.hint { font-size: 11.5px; color: var(--c-text-3); }
.err-msg { font-size: 11.5px; color: var(--c-danger); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }

.search {
  position: relative; display: flex; align-items: center; min-width: 220px; flex: 1; max-width: 420px;
}
.search .ic { position: absolute; left: 9px; color: var(--c-text-3); pointer-events: none; }
.search input { padding-left: 30px; }
.kbd {
  font-family: var(--f-mono); font-size: 10.5px; border: 1px solid var(--c-line); border-bottom-width: 2px;
  border-radius: var(--r-sm); padding: 0 4px; color: var(--c-text-3); background: var(--c-surface-2);
}

/* ------------------------------------------------------------------- Cartes */
.card { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-lg); }
.card-head {
  display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--c-line-soft);
}
.card-head h3 { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--c-text-2); font-weight: 600; }
.card-head .spacer { margin-left: auto; }
.card-body { padding: 14px; }
.card-body.tight { padding: 0; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.stat {
  background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-lg); padding: 12px 14px;
  display: flex; flex-direction: column; gap: 3px;
}
.stat-l { font-size: 11px; color: var(--c-text-2); letter-spacing: .05em; text-transform: uppercase; }
.stat-v { font-family: var(--f-mono); font-size: 21px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat-v.accent { color: var(--c-accent); }
.stat-v.ember { color: var(--c-ember); }
.stat-sub { font-size: 11.5px; color: var(--c-text-3); }

/* ------------------------------------------------------------------ Tableaux */
.table-wrap { overflow-x: auto; border-radius: var(--r-lg); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tbl th {
  background: var(--c-surface-2); text-align: left; font-weight: 600; font-size: 10.5px;
  letter-spacing: .07em; text-transform: uppercase; color: var(--c-text-2);
  padding: 8px 10px; border-bottom: 1px solid var(--c-line); white-space: nowrap; position: sticky; top: 0; z-index: 2;
}
table.tbl th.sortable { cursor: pointer; user-select: none; }
table.tbl th.sortable:hover { color: var(--c-text); }
table.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--c-line-soft); vertical-align: middle; }
table.tbl tbody tr:last-child td { border-bottom: none; }
table.tbl tbody tr:hover td { background: var(--c-surface-2); }
table.tbl td.r, table.tbl th.r { text-align: right; }
table.tbl td.c, table.tbl th.c { text-align: center; }
table.tbl td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.tbl tr.grp td {
  background: var(--c-surface-3); font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
  font-weight: 600; color: var(--c-text-2); padding: 7px 10px; position: sticky; top: 29px;
}
table.tbl tr.inactive td { opacity: .48; }
table.tbl tr.picked td { background: var(--c-accent-soft); }
.empty { text-align: center; padding: 34px 20px; color: var(--c-text-3); font-size: 13.5px; }
.empty strong { display: block; color: var(--c-text-2); font-size: 14px; margin-bottom: 4px; }

/* ---------------------------------------------------------------- Étiquettes */
.tag {
  display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 1.5px 7px;
  border-radius: 999px; background: var(--c-surface-3); color: var(--c-text-2); white-space: nowrap;
}
.tag.ok { background: var(--c-ok-soft); color: var(--c-ok); }
.tag.warn { background: var(--c-warn-soft); color: var(--c-warn); }
.tag.danger { background: var(--c-danger-soft); color: var(--c-danger); }
.tag.accent { background: var(--c-accent-soft); color: var(--c-accent); }
.tag.ember { background: var(--c-ember-soft); color: var(--c-ember); }
.tag-cat { font-weight: 500; }
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font-size: 12px; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--c-line);
  background: var(--c-surface); color: var(--c-text-2); cursor: pointer; white-space: nowrap; transition: all .12s;
}
.chip:hover { border-color: var(--c-text-3); color: var(--c-text); }
.chip.active { background: var(--c-accent); border-color: var(--c-accent); color: var(--c-accent-text); font-weight: 500; }
.cat-dot { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: 0 0 9px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--c-line); overflow-x: auto; }
.tab {
  padding: 8px 13px; font-size: 13px; border: 0; background: none; color: var(--c-text-2); cursor: pointer;
  border-bottom: 2px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 6px;
}
.tab:hover { color: var(--c-text); }
.tab.active { color: var(--c-accent); border-bottom-color: var(--c-accent); font-weight: 500; }
.tab .cnt { font-family: var(--f-mono); font-size: 10.5px; background: var(--c-surface-3); padding: 0 5px; border-radius: 999px; }

/* ------------------------------------------------------------ Modale / tiroir */
.overlay {
  position: fixed; inset: 0; background: rgba(10, 20, 26, .5); z-index: 100;
  display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-xl);
  box-shadow: var(--shadow-3); width: 100%; max-width: 640px; animation: pop .14s ease-out;
}
.modal.wide { max-width: 980px; }
.modal.narrow { max-width: 440px; }
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.99); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .modal { animation: none; } }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--c-line); }
.modal-head h3 { font-size: 15px; }
.modal-head .sub { font-size: 12px; color: var(--c-text-3); }
.modal-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; max-height: 70vh; overflow-y: auto; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--c-line); }
.modal-foot .left { margin-right: auto; }

.toasts { position: fixed; bottom: 18px; right: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--c-surface); border: 1px solid var(--c-line); border-left: 3px solid var(--c-accent);
  border-radius: var(--r-md); box-shadow: var(--shadow-2); padding: 9px 14px; font-size: 13px;
  min-width: 240px; max-width: 380px; animation: slide .16s ease-out;
}
.toast.ok { border-left-color: var(--c-ok); }
.toast.warn { border-left-color: var(--c-warn); }
.toast.err { border-left-color: var(--c-danger); }
@keyframes slide { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

/* ------------------------------------------------------------------- Divers */
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.spacer { margin-left: auto; }
.muted { color: var(--c-text-2); }
.muted-3 { color: var(--c-text-3); }
.small { font-size: 12px; }
.xsmall { font-size: 11px; }
.strong { font-weight: 600; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.divider { height: 1px; background: var(--c-line-soft); }
.notice {
  display: flex; gap: 9px; padding: 10px 12px; border-radius: var(--r-md); font-size: 12.5px;
  background: var(--c-accent-soft); color: var(--c-text); border: 1px solid transparent; line-height: 1.5;
}
.notice.warn { background: var(--c-warn-soft); }
.notice.danger { background: var(--c-danger-soft); }
.notice .ic { flex: 0 0 auto; margin-top: 1px; }

.totalbar {
  position: sticky; bottom: 0; z-index: 20; background: var(--c-surface); border: 1px solid var(--c-line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-2); margin-top: 14px; overflow: hidden;
}
.totalbar-head {
  display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--c-surface-2);
  border-bottom: 1px solid var(--c-line-soft); font-size: 11px; letter-spacing: .07em;
  text-transform: uppercase; color: var(--c-text-2); font-weight: 600;
}
.totalbar-body { display: flex; flex-wrap: wrap; }
.totalbar-cell { flex: 1; min-width: 140px; padding: 10px 14px; border-right: 1px solid var(--c-line-soft); }
.totalbar-cell:last-child { border-right: none; }

.bar { height: 6px; border-radius: 3px; background: var(--c-surface-3); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--c-accent); }
.range-bar { position: relative; height: 26px; }

/* Cartes flottantes (verre dépoli) */
.gate-float {
  position: absolute; z-index: 1; color: #fff; border-radius: 16px; padding: 13px 15px;
  background: rgba(14,34,48,.46); border: 1px solid rgba(255,255,255,.2);

.gf-lbl { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.66); }

/* Colonne de connexion */

.gate-card { border: 1px solid var(--c-line); border-radius: 18px; background: #fff; box-shadow: 0 1px 2px rgba(18,33,43,.05), 0 20px 48px rgba(18,33,43,.08); overflow: hidden; }
.gate-tabs { padding: 6px 8px 0; background: var(--c-surface-2); gap: 0; }

.gate-cta {
  justify-content: center; padding: 12px; border-radius: 11px; font-size: 14px; font-weight: 600;
  background: linear-gradient(135deg, #1B5A73, #12384A); border: 0; box-shadow: 0 10px 22px rgba(27,90,115,.28);

.gate a { color: var(--c-accent); }

/* Illustration */
.hero-scan { animation: gate-pulse 3.2s ease-in-out infinite; }

@keyframes gate-zoom { from { transform: scale(1.08); } to { transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  .gate-media img, .gate-media .hero-svg, .gate-float, .gate-side-inner, .hero-scan { animation: none !important; }

@media (max-width: 1080px) {

  .gate-float-b, .gate-float-c { display: none; }

  .rail, .topbar-actions, .btn, .toasts { display: none !important; }

}

<div id="app">
  <div style="display:grid;place-items:center;min-height:70vh;font-family:system-ui,sans-serif;color:#536270">
    Chargement de l'application…
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>

/* ===== 01-core.js ==================================================== */
/* =========================================================================
 * 01 — CORE : utilitaires transverses (aucune dépendance métier)
 * ========================================================================= */
const Core = (() => {
  "use strict";

  /** Identifiant unique stable (compatible avec un uuid Postgres côté Supabase). */
  function uid(prefix = "id") {
    const rnd = (typeof crypto !== "undefined" && crypto.randomUUID)
      ? crypto.randomUUID()
      : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
          const r = (Math.random() * 16) | 0;
          return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
        });
    return prefix + "_" + rnd;
  }

  const nowIso = () => new Date().toISOString();

  /** Date ISO -> 30/08/2026 */
  function dateFR(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    if (isNaN(d)) return String(iso);
    return new Intl.DateTimeFormat("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" }).format(d);
  }
  function dateTimeFR(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    if (isNaN(d)) return String(iso);
    return new Intl.DateTimeFormat("fr-FR", {
      day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit",
    }).format(d);
  }
  /** yyyy-mm-dd pour <input type="date"> */
  function dateInput(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toISOString().slice(0, 10);
  }

  const nfEUR0 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
  const nfEUR2 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const nfNum = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 2 });

  /** Montant € arrondi à l'euro. */
  const eur = n => nfEUR0.format(Number.isFinite(+n) ? +n : 0);
  /** Montant € avec centimes (prix unitaires). */
  const eur2 = n => nfEUR2.format(Number.isFinite(+n) ? +n : 0);
  /** Nombre décimal fr-FR. */
  const num = (n, d = 2) =>
    new Intl.NumberFormat("fr-FR", { maximumFractionDigits: d }).format(Number.isFinite(+n) ? +n : 0);
  const pct = (n, d = 1) => num(n, d) + " %";

  /** Parse un nombre saisi par l'utilisateur : accepte « 1 250,75 » et « 1250.75 ». */
  function parseNum(v) {
    if (typeof v === "number") return Number.isFinite(v) ? v : 0;
    if (v === null || v === undefined) return 0;
    const s = String(v).trim().replace(/\s| | /g, "").replace(",", ".");
    if (s === "") return 0;
    const n = parseFloat(s);
    return Number.isFinite(n) ? n : 0;
  }

  /** Arrondi à n décimales sans dérive binaire. */
  const round = (n, d = 2) => {
    const f = Math.pow(10, d);
    return Math.round((Number(n) + Number.EPSILON) * f) / f;
  };

  /** Échappement HTML — toute donnée utilisateur passe par là avant injection. */
  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  /** Échappement pour attribut JS inline (onclick="…"). */
  const escAttr = s => esc(s).replace(/`/g, "&#96;");

  /** Normalisation pour recherche : sans accents, minuscules. */
  function norm(s) {
    return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }

  /** Recherche « tous les mots présents ». */
  function matches(haystack, query) {
    const q = norm(query).trim();
    if (!q) return true;
    const h = norm(haystack);
    return q.split(/\s+/).every(w => h.includes(w));
  }

  const clone = o => (typeof structuredClone === "function" ? structuredClone(o) : JSON.parse(JSON.stringify(o)));

  const sum = (arr, fn = x => x) => arr.reduce((a, b) => a + (Number(fn(b)) || 0), 0);

  function groupBy(arr, keyFn) {
    const m = new Map();
    for (const item of arr) {
      const k = keyFn(item);
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(item);
    }
    return m;
  }

  function debounce(fn, ms = 250) {
    let t;
    return function (...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); };
  }

  /**
   * Évaluateur d'expression arithmétique sûr (métrés calculés).
   * N'accepte que chiffres, . , ( ) + - * / et espaces — pas d'eval de code.
   * Retourne {ok, value, error}.
   */
  function evalFormula(expr) {
    const raw = String(expr || "").trim();
    if (!raw) return { ok: false, value: 0, error: "Formule vide" };
    const cleaned = raw.replace(/ | /g, "").replace(/,/g, ".").replace(/×/g, "*").replace(/÷/g, "/");
    if (!/^[0-9+\-*/().\s]+$/.test(cleaned)) {
      return { ok: false, value: 0, error: "Caractère non autorisé (chiffres et + - * / ( ) uniquement)" };
    }
    if (/[+\-*/]\s*[*/]/.test(cleaned) || /^[*/]/.test(cleaned) || /[+\-*/]$/.test(cleaned)) {
      return { ok: false, value: 0, error: "Formule mal formée" };
    }
    let depth = 0;
    for (const c of cleaned) {
      if (c === "(") depth++;
      if (c === ")") depth--;
      if (depth < 0) return { ok: false, value: 0, error: "Parenthèses déséquilibrées" };
    }
    if (depth !== 0) return { ok: false, value: 0, error: "Parenthèses déséquilibrées" };
    try {
      // eslint-disable-next-line no-new-func
      const v = Function('"use strict"; return (' + cleaned + ");")();
      if (!Number.isFinite(v)) return { ok: false, value: 0, error: "Résultat non numérique" };
      return { ok: true, value: v, error: null };
    } catch (e) {
      return { ok: false, value: 0, error: "Formule invalide" };
    }
  }

  /** Bus d'événements applicatif minimal. */
  const Bus = (() => {
    const map = new Map();
    return {
      on(evt, fn) {
        if (!map.has(evt)) map.set(evt, new Set());
        map.get(evt).add(fn);
        return () => map.get(evt).delete(fn);
      },
      emit(evt, payload) {
        (map.get(evt) || []).forEach(fn => { try { fn(payload); } catch (e) { console.error(e); } });
      },
    };
  })();

  /** Tri générique multi-type. */
  function cmp(a, b) {
    if (typeof a === "number" && typeof b === "number") return a - b;
    return String(a ?? "").localeCompare(String(b ?? ""), "fr", { numeric: true, sensitivity: "base" });
  }

  function slug(s) {
    return norm(s).replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "").slice(0, 60);
  }

  return {
    uid, nowIso, dateFR, dateTimeFR, dateInput,
    eur, eur2, num, pct, parseNum, round,
    esc, escAttr, norm, matches, clone, sum, groupBy, debounce,
    evalFormula, Bus, cmp, slug, nfNum,
  };
})();


/* ===== 02-schema.js ================================================== */
/* =========================================================================
 * 02 — SCHEMA : fabriques d'entités + contrat de données.
 *
 * Chaque entité porte : id, createdAt, updatedAt, et (quand pertinent)
 * createdBy/updatedBy. Ce schéma est volontairement « plat et relationnel »
 * pour être transposable tel quel en tables PostgreSQL / Supabase :
 *   users, settings, categories, units, vat_rates, coefficients, aid_rules,
 *   fee_templates, catalog_items, catalog_price_history,
 *   projects, buildings, measurements, scenarios, scenario_lines,
 *   scenario_fees, scenario_aids, economics
 * ========================================================================= */
const Schema = (() => {
  "use strict";
  const { uid, nowIso } = Core;

  const stamp = (prefix) => ({ id: uid(prefix), createdAt: nowIso(), updatedAt: nowIso() });

  /* ---------------------------------------------------------------- Catalogue */
  function catalogItem(p = {}) {
    return {
      ...stamp("itm"),
      categoryId: p.categoryId || null,
      subCategory: p.subCategory || "",
      label: p.label || "",
      description: p.description || "",
      unit: p.unit || "u",
      priceHT: Core.parseNum(p.priceHT),
      vatRate: p.vatRate === undefined || p.vatRate === null ? 5.5 : Core.parseNum(p.vatRate),
      source: p.source || "",
      priceDate: p.priceDate || nowIso().slice(0, 10),
      region: p.region || "",
      supplier: p.supplier || "",
      comment: p.comment || "",
      active: p.active === undefined ? true : !!p.active,
      createdBy: p.createdBy || null,
      updatedBy: p.updatedBy || null,
      /** Historique des prix : jamais écrasé, toujours empilé (cf. §7). */
      history: p.history || [],
    };
  }

  function priceHistoryEntry(p = {}) {
    return {
      id: uid("hst"),
      at: p.at || nowIso(),
      priceHT: Core.parseNum(p.priceHT),
      vatRate: Core.parseNum(p.vatRate),
      source: p.source || "",
      priceDate: p.priceDate || "",
      user: p.user || "",
      note: p.note || "",
    };
  }

  function category(p = {}) {
    return {
      ...stamp("cat"),
      name: p.name || "",
      icon: p.icon || "ti-list",
      color: p.color || "#D3D1C7",
      textColor: p.textColor || "#444441",
      order: p.order === undefined ? 99 : p.order,
      active: p.active === undefined ? true : !!p.active,
      subCategories: p.subCategories || [],
    };
  }

  /* ------------------------------------------------------------------ Projet */
  function project(p = {}) {
    return {
      ...stamp("prj"),
      name: p.name || "",
      coproName: p.coproName || "",
      address: p.address || "",
      postalCode: p.postalCode || "",
      city: p.city || "",
      department: p.department || "",
      constructionYear: p.constructionYear || "",
      nbBuildings: Core.parseNum(p.nbBuildings),
      nbDwellings: Core.parseNum(p.nbDwellings),
      livingArea: Core.parseNum(p.livingArea),
      floorArea: Core.parseNum(p.floorArea),
      nbLevels: Core.parseNum(p.nbLevels),
      heatingType: p.heatingType || "",
      dhwType: p.dhwType || "",
      energy: p.energy || "",
      studyDate: p.studyDate || nowIso().slice(0, 10),
      engineer: p.engineer || "",
      reference: p.reference || "",
      version: p.version || "V1",
      /** Chaîne de versions : id du projet source si ce projet est une V(n+1). */
      parentId: p.parentId || null,
      missionType: p.missionType || "PPPT",
      comment: p.comment || "",
      status: p.status || "actif", // actif | archivé
      /** Niveau de précision du chiffrage (cf. §19). */
      precisionLevel: p.precisionLevel || "Estimation préliminaire",
      uncertainty: p.uncertainty === undefined ? 15 : Core.parseNum(p.uncertainty),
      /** Tantièmes : total de la copropriété (pour la quote-part). */
      totalTantiemes: Core.parseNum(p.totalTantiemes) || 10000,
      buildings: p.buildings || [],
      scenarios: p.scenarios || [],
      economics: p.economics || economics(),
      /** DPE rattachés (données extraites des exports 3CL). */
      dpes: p.dpes || [],
      createdBy: p.createdBy || null,
      updatedBy: p.updatedBy || null,
    };
  }

  function building(p = {}) {
    return {
      id: uid("bat"),
      name: p.name || "Bâtiment A",
      nbDwellings: Core.parseNum(p.nbDwellings),
      nbLevels: Core.parseNum(p.nbLevels),
      tantiemes: Core.parseNum(p.tantiemes),
      /** Métrés normalisés + métrés personnalisés (cf. §5 et §11). */
      metrics: p.metrics || {},
      customMetrics: p.customMetrics || [],
      comment: p.comment || "",
    };
  }

  /** Un métré : valeur + origine tracée (saisie / calcul / import). */
  function measurement(p = {}) {
    return {
      value: Core.parseNum(p.value),
      origin: p.origin || "saisie", // saisie | calcul | import
      formula: p.formula || "",
      sourceFile: p.sourceFile || "",
      at: p.at || nowIso(),
      by: p.by || "",
    };
  }

  /* --------------------------------------------------------------- Scénarios */
  function scenario(p = {}) {
    return {
      id: uid("scn"),
      name: p.name || "Nouveau scénario",
      description: p.description || "",
      color: p.color || "#B5D4F4",
      selected: !!p.selected,
      lines: p.lines || [],
      fees: p.fees || [],
      aids: p.aids || [],
      /** Économie d'énergie attendue, en % de la consommation avant travaux. */
      energySavingPct: Core.parseNum(p.energySavingPct),
      createdAt: p.createdAt || nowIso(),
    };
  }

  /** Une ligne de travaux dans un scénario. */
  function line(p = {}) {
    return {
      id: uid("lin"),
      catalogItemId: p.catalogItemId || null,
      /** Copie figée du poste au moment de l'ajout : le chiffrage ne bouge pas
       *  si le catalogue est mis à jour plus tard (traçabilité). */
      label: p.label || "",
      categoryId: p.categoryId || null,
      unit: p.unit || "u",
      priceHT: Core.parseNum(p.priceHT),
      vatRate: Core.parseNum(p.vatRate),
      catalogPriceHT: Core.parseNum(p.catalogPriceHT),
      quantity: Core.parseNum(p.quantity),
      quantityOrigin: p.quantityOrigin || "saisie",
      quantityFormula: p.quantityFormula || "",
      /** Coefficients appliqués : liste d'ids de coefficients du référentiel. */
      coefficientIds: p.coefficientIds || [],
      /** Coefficient libre supplémentaire (1 = neutre). */
      manualCoef: p.manualCoef === undefined ? 1 : Core.parseNum(p.manualCoef) || 1,
      /** Remise en % sur le prix. */
      discountPct: Core.parseNum(p.discountPct),
      /** Affectation : [] = toute la copropriété, sinon liste d'ids bâtiments. */
      buildingIds: p.buildingIds || [],
      comment: p.comment || "",
    };
  }

  /** Frais annexe (installation chantier, MOE, SPS…). */
  function fee(p = {}) {
    return {
      id: uid("fee"),
      label: p.label || "",
      mode: p.mode || "forfait", // forfait | m2 | logement | pct
      value: Core.parseNum(p.value),
      vatRate: p.vatRate === undefined ? 20 : Core.parseNum(p.vatRate),
      /** Pour mode m2 : quelle surface (livingArea | facadeArea | roofArea | floorArea) */
      basis: p.basis || "livingArea",
      comment: p.comment || "",
    };
  }

  /** Aide financière appliquée à un scénario. */
  function aid(p = {}) {
    return {
      id: uid("aid"),
      ruleId: p.ruleId || null,
      label: p.label || "",
      mode: p.mode || "forfait", // forfait | pct | logement | m2 | custom
      value: Core.parseNum(p.value),
      basis: p.basis || "ht", // pour pct : ht | ttc
      cap: Core.parseNum(p.cap), // plafond, 0 = aucun
      verified: !!p.verified,
      comment: p.comment || "",
    };
  }

  /* ---------------------------------------------------- Analyse économique */
  function economics(p = {}) {
    return {
      consoBefore: Core.parseNum(p.consoBefore), // kWhEP/an (ou kWh final selon usage)
      energyPrice: p.energyPrice === undefined ? 0 : Core.parseNum(p.energyPrice), // €/kWh
      opexBefore: Core.parseNum(p.opexBefore), // charges d'exploitation €/an avant
      opexAfter: Core.parseNum(p.opexAfter), // €/an après
      discountRate: p.discountRate === undefined ? 4 : Core.parseNum(p.discountRate), // %
      horizon: p.horizon === undefined ? 25 : Core.parseNum(p.horizon), // années
      energyInflation: p.energyInflation === undefined ? 3 : Core.parseNum(p.energyInflation), // %/an
    };
  }

  /* ----------------------------------------------------------- Référentiels */
  function coefficient(p = {}) {
    return {
      id: uid("coe"),
      family: p.family || "Complexité",
      label: p.label || "",
      value: p.value === undefined ? 1 : Core.parseNum(p.value),
      comment: p.comment || "",
      active: p.active === undefined ? true : !!p.active,
    };
  }

  function vatRate(p = {}) {
    return {
      id: uid("tva"),
      rate: Core.parseNum(p.rate),
      label: p.label || "",
      isDefault: !!p.isDefault,
      active: p.active === undefined ? true : !!p.active,
    };
  }

  function unit(p = {}) {
    return { id: uid("unt"), code: p.code || "", label: p.label || "", active: true };
  }

  function aidRule(p = {}) {
    return {
      id: uid("rul"),
      name: p.name || "",
      device: p.device || "", // MaPrimeRénov' | CEE | éco-PTZ | Locale | Autre
      mode: p.mode || "forfait",
      value: Core.parseNum(p.value),
      basis: p.basis || "ht",
      cap: Core.parseNum(p.cap),
      conditions: p.conditions || "",
      source: p.source || "",
      validFrom: p.validFrom || "",
      verified: !!p.verified,
      active: p.active === undefined ? true : !!p.active,
    };
  }

  function user(p = {}) {
    return {
      id: uid("usr"),
      name: p.name || "",
      email: p.email || "",
      role: p.role || "ingenieur", // admin | ingenieur | consultation
      active: p.active === undefined ? true : !!p.active,
      createdAt: nowIso(),
    };
  }

  return {
    catalogItem, priceHistoryEntry, category,
    project, building, measurement,
    scenario, line, fee, aid, economics,
    coefficient, vatRate, unit, aidRule, user,
  };
})();

    ["Éco-PTZ copropriété", "éco-PTZ", "logement", 0, "ht", 0,
      "Prêt à taux zéro : ne réduit pas le coût mais le reste à charge immédiat. À renseigner : montant par logement et durée."],
    ["Aide locale (collectivité / EPCI)", "Locale", "forfait", 0, "ht", 0,
      "À renseigner selon le dispositif du territoire concerné."],
  ];

  const HEATING_TYPES = ["Chaudière collective gaz", "Chaudière collective fioul", "Chauffage individuel gaz",
    "Chauffage électrique individuel", "Réseau de chaleur urbain", "PAC collective", "PAC individuelle", "Autre"];
  const DHW_TYPES = ["ECS collective (production centralisée)", "ECS individuelle électrique",

  const ENERGIES = ["Gaz naturel", "Électricité", "Fioul", "Réseau de chaleur", "Bois / biomasse", "Propane", "Mixte"];
  const MISSION_TYPES = ["PPPT", "DTG", "Audit énergétique", "DPE collectif", "Étude thermique",
    "Étude CVC", "Étude de faisabilité", "Chiffrage de travaux", "Autre"];
  const PRECISION_LEVELS = [
    { label: "Estimation indicative", defaultUncertainty: 20 },
    { label: "Estimation préliminaire", defaultUncertainty: 15 },
    { label: "Estimation détaillée", defaultUncertainty: 10 },
  ];

  /** Métrés standard d'un bâtiment (§5). */
  const BUILDING_METRICS = [
    { key: "livingArea", label: "Surface habitable", unit: "m²" },
    { key: "facadeArea", label: "Surface de façade", unit: "m²" },
    { key: "roofArea", label: "Surface de toiture", unit: "m²" },
    { key: "lowFloorArea", label: "Surface de plancher bas", unit: "m²" },
    { key: "glazingArea", label: "Surface de vitrages", unit: "m²" },
    { key: "networkLength", label: "Longueur des réseaux", unit: "ml" },
  ];

  /** Construit l'état initial complet de la base. */
  function build() {
    const categories = CATEGORIES.map(([name, icon, color, textColor], i) =>
      Schema.category({ name, icon, color, textColor, order: i, subCategories: [] })
    );
    const catIndex = categories.map(c => c.id);

    const items = ITEMS.map(([ci, sub, label, unit, ht, tva]) => {

        priceHT: ht,
        vatRate: tva,

      it.history = [Schema.priceHistoryEntry({
        priceHT: ht, vatRate: tva, source: SEED_SOURCE, priceDate: SEED_DATE,
        user: "Initialisation", note: "Reprise du bordereau SO_chiffrage_VF",
      })];
      return it;
